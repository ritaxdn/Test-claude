<title>Mon Dressing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a store "dressing room" — category sidebar | the look being built (stacked swipeable rails: haut, bas, chaussures, sac) | product grid.
   Phone: the look fills the screen like an outfit app, with a bottom tab bar. Deliberately single light theme: white ground so product photos melt into the page. */
:root{
  color-scheme:light;
  --bg:#ffffff; --card:#ffffff; --on-ink:#ffffff; --ink:#111111; --muted:#7a7a7a; --line:#e6e6e6; --soft:#f5f5f4;
  --accent:#b7d39a; --accent-ink:#1d2a12; --sel:#111111;
  --display:"Bodoni Moda",Didot,"Times New Roman",serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --navh:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}

/* header */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.04em}
.crumb b{color:var(--ink);font-weight:600}
.logo{text-align:center}
.logo h1{margin:0;font-weight:700;font-size:24px;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.hright{display:flex;justify-content:flex-end}
.pill{border:0;background:var(--ink);color:var(--on-ink);border-radius:6px;padding:9px 14px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center}
.pill .n{background:var(--card);color:var(--ink);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:11px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:#a3243f;border-color:#a3243f}
.btn:disabled{opacity:.45;cursor:default}

/* 3 columns */
.room{display:grid;grid-template-columns:200px minmax(300px,380px) minmax(0,1fr);min-height:calc(100vh - 80px)}
.room>*{min-width:0}
aside.nav{border-right:1px solid var(--line);padding:22px 16px 22px 0}
.nav a{display:block;padding:3px 8px;color:var(--ink);text-decoration:none;font-size:13.5px;border-radius:3px;cursor:pointer}
.nav a.top{font-weight:600}
.nav a.sub{padding-left:18px;color:#444;font-size:13px}
.nav a[aria-current="true"]{background:var(--soft);font-weight:700}
.nav .gap{height:14px}
.nav sup{color:var(--muted);font-size:10px;margin-left:4px;font-variant-numeric:tabular-nums}

/* look column */
.look{border-right:1px solid var(--line);padding:22px 0 22px;display:flex;flex-direction:column;gap:6px;position:relative}
.lookhead{display:flex;flex-direction:column;align-items:stretch;padding-inline:18px;gap:10px}
.lookhead .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lookhead h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em}
.lines{font-size:12px;line-height:1.45;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.lines div{display:flex;justify-content:space-between;gap:10px;min-width:0}
.lines div em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lines span{color:var(--muted);white-space:nowrap;flex-shrink:0}
.tot{font-size:12px;font-weight:600;color:var(--muted)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toggles button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}

.rails{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding-block:14px 8px}
.rail{position:relative}
.track{--sw:190px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:calc(50% - var(--sw) / 2);scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 var(--sw);scroll-snap-align:center;display:grid;place-items:center;border:0;background:none;padding:2px;opacity:.35;transform:scale(.82);transition:opacity .25s,transform .25s}
.slide.on{opacity:1;transform:none}
.slide img{max-width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none}
.rail[data-slot="jacket"] .slide{height:180px}
.rail[data-slot="top"] .slide,.rail[data-slot="layer"] .slide{height:190px}
.rail[data-slot="dress"] .slide{height:300px}
.rail[data-slot="bottom"] .slide{height:200px}
.rail[data-slot="shoes"] .slide{height:150px}
.rail[data-slot="bag"] .slide{height:130px}
.rail[data-slot="acc"] .slide{height:120px}
.ph{width:100%;height:100%;border:1.5px dashed #cfcfcf;border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;padding:8px;background:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:#4a4a4a;color:var(--on-ink);display:grid;place-items:center;font-size:14px;opacity:0;transition:opacity .2s;z-index:2}
.arrow.l{left:6px}.arrow.r{right:6px}
.rail:hover .arrow,.arrow:focus-visible{opacity:.85}
.rlabel{position:absolute;left:18px;top:2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);z-index:1}
.lookfoot{display:flex;justify-content:center;gap:12px;align-items:center;padding:10px 18px 0;flex-wrap:wrap}
.shuffle{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.save{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;letter-spacing:.1em;font-size:12px;padding:0 22px;height:52px;border-radius:999px;text-transform:uppercase}

/* grid column */
.shop{padding:16px 0 22px 18px;display:flex;flex-direction:column;gap:10px}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.shophead input{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;width:180px;max-width:100%;color:var(--ink)}
.chips{display:none;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:12px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{position:relative;border:1px solid transparent;background:var(--card);padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tile:hover{border-color:var(--line)}
.tile.sel{border-color:var(--sel);border-width:2px;padding:9px 7px 9px}
.tile .im{width:100%;aspect-ratio:1;display:grid;place-items:center}
.tile img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.tile b{font-weight:500;font-size:12.5px;line-height:1.25}
.tile small{color:var(--muted);font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);vertical-align:middle;margin-right:4px}
.info{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.fav{position:absolute;top:6px;left:6px;font-size:14px;color:#a3243f}
.empty{padding:40px 8px;color:var(--muted);text-align:center}
.empty h3{font-family:var(--display);font-weight:500;font-size:24px;color:var(--ink);margin:0 0 6px}

/* saved looks */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.lk{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--card);min-width:0}
.lk .stack{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lk .stack>*{aspect-ratio:1;display:grid;place-items:center;background:var(--card);overflow:hidden;text-align:center}
.lk .stack img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.lk b{font-size:13px;font-weight:600;text-align:center}
.lk .refnote{font-size:11px;color:var(--muted);text-align:center;line-height:1.4}
.lk .ref{font-size:12px;text-align:center;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.lk.done{background:var(--soft)}
.lk.done .stack{opacity:.55}
.worn{align-self:center;font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--on-ink)}
.fresh{align-self:center;font-size:11px;color:var(--muted)}
.lk .wearbtn{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lk .wearbtn.undo{background:var(--card);border-color:var(--line);color:var(--muted)}
.lookbar{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lookbar button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px}
.lookbar button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.lk{position:relative}
.lk.pick{outline:2px solid var(--ink);outline-offset:-1px}
.selmode .lk{cursor:pointer}
.lkchk{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0}
.lk.pick .lkchk{background:var(--ink);color:var(--on-ink)}
.selbar{grid-column:1/-1;position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:var(--on-ink);border-radius:10px;padding:10px 12px;font-size:13px}
.selbar select{border-radius:999px;border:0;padding:7px 10px;font-size:12px;min-width:0;flex:1 1 180px;background:var(--card);color:#111}
.selmode .lk .row,.selmode .lk .cpick{display:none}
.selbar button{border:1px solid rgba(255,255,255,.5);background:transparent;color:var(--on-ink);border-radius:999px;padding:6px 12px;font-size:12px}
.selbar select:disabled{opacity:.5}
.lk .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.lk .row .wearbtn{font-size:12px}
.lk .row button{font-size:12px;padding:8px 10px}

/* bottom bar (phone) */
.tabbar{display:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--card);z-index:21;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) 22px;
  display:flex;flex-direction:column;gap:16px;box-shadow:-20px 0 60px rgba(0,0,0,.12)}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dhead small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.x{border:0;background:none;font-size:26px;line-height:1;padding:4px 8px}
.big{aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--card)}
.big img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.drawer h2{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}
.stats div{padding:10px 0;display:flex;flex-direction:column}
.stats div+div{padding-left:12px;border-left:1px solid var(--line)}
.stats b{font-family:var(--display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stats span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
label.full{grid-column:1/-1}
fieldset.tags{grid-column:1/-1;border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
fieldset.tags legend{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:4px;width:100%}
label.tag{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer}
label.tag input{width:auto;margin:0}
form input,form select,form textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
form textarea{min-height:64px;resize:vertical}
.brow{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:12px;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);padding:10px 12px;border-radius:8px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--tb,0px) + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap}

/* tablet */
@media (max-width:1060px){
  .room{grid-template-columns:170px minmax(280px,340px) minmax(0,1fr)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* phone: outfit app */
@media (max-width:760px){
  :root{--tb:var(--navh)}
  body{padding-bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom,0px))}
  header{grid-template-columns:auto 1fr auto;padding-block:12px 10px}
  .crumb{display:none}
  .logo{text-align:left}
  .logo h1{font-family:var(--display);letter-spacing:0;text-transform:none;font-size:28px;padding:0}
  .logo small{display:none}
  .room{display:block;min-height:0}
  aside.nav{display:none}
  .look{border:0;padding-top:10px}
  .shop{padding:12px 0}
  .chips{display:flex}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  body[data-tab="look"] .shop{display:none}
  body[data-tab="closet"] .look,body[data-tab="looks"] .look{display:none}
  .lookhead .lines{display:none}
  .toggles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
  .toggles button{white-space:nowrap}
  .lookhead{justify-content:center}
  .rail[data-slot="jacket"] .slide{height:min(26vh,200px)}
  .rail[data-slot="top"] .slide,.rail[data-slot="layer"] .slide{height:min(30vh,220px)}
  .rail[data-slot="dress"] .slide{height:min(46vh,360px)}
  .rail[data-slot="bottom"] .slide{height:min(30vh,230px)}
  .rail[data-slot="shoes"] .slide{height:min(18vh,150px)}
  .arrow{display:none}
  .track{--sw:min(56vw,230px)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:#000;justify-content:space-around;align-items:center;
    height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;color:#8d8d8d;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:.06em;padding:6px 10px}
  .tabbar button[aria-current="true"]{color:var(--on-ink)}
  .tabbar .plus{width:46px;height:46px;border-radius:50%;background:var(--card);color:#000;font-size:26px;justify-content:center;padding:0}
}
.editing{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px}
.editing b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.editing button{border:0;background:none;font-size:12px;text-decoration:underline;color:var(--muted);white-space:nowrap}
.upd{border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:700;letter-spacing:.06em;font-size:12px;padding:0 18px;height:52px;border-radius:999px;text-transform:uppercase}
.accrail{padding-top:18px}
.accgrid{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 18px 6px}
.accpick{flex:0 0 62px;height:62px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:3px;position:relative;font-size:9px;overflow:hidden}
.accpick img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.accpick.on{border:2px solid var(--ink);padding:2px}
.accpick.on::after{content:"✓";position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;background:var(--ink);color:var(--on-ink);border-radius:50%;width:15px;height:15px;display:grid;place-items:center}
.stats-v,.valise{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.wide,.vform,.kpis,.row1{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line)}
.kpis div{padding:12px 0;display:flex;flex-direction:column;min-width:0}
.kpis div+div{padding-left:14px;border-left:1px solid var(--line)}
.kpis b{font-family:var(--display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.kpis span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats-v section{min-width:0;display:flex;flex-direction:column;gap:6px}
.stats-v h4,.valise h4{margin:6px 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 1.6fr 2.5ch;gap:8px;align-items:center;font-size:12.5px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{height:8px;border-radius:4px;background:linear-gradient(var(--ink),var(--ink)) 0/var(--w) 100% no-repeat,var(--soft)}
.bar b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-size:11px;min-width:0}
.mini img{width:100%;aspect-ratio:1;object-fit:contain;mix-blend-mode:multiply}
.mini span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini b{font-size:11px}
.vform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:10px;padding:12px}
.vform input,.vform select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;min-width:0;background:var(--card);color:var(--ink);text-transform:none;letter-spacing:0}
.vform label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:1 1 120px;min-width:0}
.vday{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card);min-width:0}
.vday b{font-size:12px}
.vday .stack{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.vday .stack>*{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;font-size:10px;text-align:center}
.vday .stack img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.row1{display:flex;gap:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.chiprow button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.chiprow button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.vform input[type=file]{padding:6px;font-size:12px}

<script>
const GROUPS=[
  {name:"Hauts",cats:["T-shirts","Débardeurs","Crop tops","Bodies","Blouses & tops","Chemises","Pulls & gilets"]},
  {name:"Vêtements",cats:["Vestes","Manteaux","Trenchs","Fourrures","Robes","Combinaisons","Jeans","Pantalons","Jupes","Leggings","Bas"]},
  {name:"Chaussures",cats:["Bottes","Talons","Mules & sandales","Plats","Sneakers"]},
  {name:"Sacs",cats:["Sacs"]},
  {name:"Accessoires",cats:["Accessoires"]},
];
const CATS=GROUPS.flatMap(g=>g.cats);
const TOPCATS=[...GROUPS[0].cats,"Hauts"];          // "Hauts" = ancienne catégorie, toujours acceptée
const SHOECATS=GROUPS.find(g=>g.name==="Chaussures").cats;
const STYLES=["Sport","Soirée","Casual"];
const TOOLS=["Aujourd'hui","Styliste IA","Planning","Envies","Mes tenues","Collections","Statistiques","Mode valise","Mode 3-3-3"];
let colls=[],ccol=null,openColl=null;
let valise=null;
const SLOTS=[
  {key:"jacket",label:"Veste / Manteau",cats:["Vestes","Manteaux","Trenchs","Fourrures"],add:"Vestes"},
  {key:"layer",label:"Haut par-dessus",cats:TOPCATS,add:"Pulls & gilets"},   // pull, cardigan, gilet porté sur le haut
  {key:"top",label:"Haut",cats:TOPCATS,add:"T-shirts"},
  {key:"dress",label:"Robe / Combi",cats:["Robes","Combinaisons"],add:"Robes"},
  {key:"bottom",label:"Bas",cats:["Jeans","Pantalons","Jupes","Leggings","Bas"],add:"Jeans"},
  {key:"shoes",label:"Chaussures",cats:SHOECATS,add:"Talons"},
  {key:"bag",label:"Sac",cats:["Sacs"],add:"Sacs"},
  {key:"acc",label:"Accessoires",cats:["Accessoires"],add:"Accessoires"},

      :`<div class="slide on"><button class="ph" data-addcat="${s.add}">+ Ajoute ${s.key==="bag"?"un sac":s.key==="acc"?"un accessoire":s.key==="jacket"?"une veste":s.key==="dress"?"une robe":s.key==="top"||s.key==="layer"?"un haut":s.key==="bottom"?"un bas":"des chaussures"}</button></div>`;
    return `<div class="rail" data-slot="${s.key}"><span class="rlabel">${s.label}</span>
      <div class="track" tabindex="-1">${slides}</div>
      ${list.length>1?'<button class="arrow l" data-dir="-1" aria-label="Précédent">‹</button><button class="arrow r" data-dir="1" aria-label="Suivant">›</button>':""}</div>`}).join("");
  r.querySelectorAll(".rail").forEach(rail=>{
    const k=rail.dataset.slot,tr=rail.querySelector(".track");if(!tr)return;
    centerOn(k,sel[k],false);
    let t;tr.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(()=>{if(Date.now()-(progScroll[k]||0)>900)pickCentered(k)},120)},{passive:true});
  });

const progScroll={};
function centerOn(k,id,smooth=true){
  progScroll[k]=Date.now();
  const tr=document.querySelector(`.rail[data-slot="${k}"] .track`);if(!tr||!id)return;
  const el=tr.querySelector(`.slide[data-id="${id}"]`);if(!el)return;
  tr.scrollTo({left:el.offsetLeft-(tr.clientWidth-el.offsetWidth)/2,behavior:smooth?"smooth":"auto"});
}
function pickCentered(k){
  const tr=document.querySelector(`.rail[data-slot="${k}"] .track`);if(!tr)return;
  const mid=tr.scrollLeft+tr.clientWidth/2;let best=null,d=1e9;
  tr.querySelectorAll(".slide[data-id]").forEach(s=>{const c=s.offsetLeft+s.offsetWidth/2,dd=Math.abs(c-mid);if(dd<d){d=dd;best=s}});
  if(best&&sel[k]!==best.dataset.id){sel[k]=best.dataset.id;saveUi();markOn();renderLines();renderGrid()}
}
function markOn(){document.querySelectorAll(".rail").forEach(r=>{const k=r.dataset.slot;r.querySelectorAll(".slide[data-id]").forEach(s=>s.classList.toggle("on",s.dataset.id===sel[k]))})}
function renderLines(){

  $("#lines").innerHTML=rows.map(i=>`<div><em>${esc(i.name)}</em><span>${esc(i.brand||"")}</span></div>`).join("");
  $("#lines").hidden=!rows.length;
  $("#tot").textContent=`${rows.length} pièce${rows.length>1?"s":""}`;
}
function tryOn(id){
  if(!lookOpen&&!isPhone())setLook(true);
  const it=byId(id),k=it&&slotOf(it.category);
  if(!k){openSheet(id);return}
  if(k==="acc"){shown.acc=true;toggleAcc(id);renderToggles();if(matchMedia("(max-width:760px)").matches)setTab("look");return}
  sel[k]=id;
  if(!shown[k]){shown[k]=true;exclusive(k);renderToggles();renderRails()} else {centerOn(k,id);markOn();renderLines()}
  saveUi();renderGrid();
  if(matchMedia("(max-width:760px)").matches)setTab("look");
}

function buildValise(days,style,season,bag){
  const cab=bag!=="Soute";
  const st=style==="Mixte"?"Casual":style;
  const tg=i=>i.tags||[],sportOnly=i=>tg(i).includes("Sport")&&!tg(i).some(t=>t!=="Sport");
  const okS=i=>!i.season||i.season==="Toute l'année"||i.season===season;
  const okT=i=>style==="Sport"?tg(i).includes("Sport"):!sportOnly(i)&&(style==="Mixte"||!tg(i).length||tg(i).includes(style));
  const P={};SLOTS.forEach(s=>P[s.key]=inSlot(s.key).filter(i=>okS(i)&&okT(i)));
  const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,Math.max(0,Math.min(n,a.length)));
  let best=null;
  for(let t=0;t<300;t++){
    const cap={top:pick(P.top,Math.min(cab?4:6,Math.ceil(days/2)+(cab?1:2))),bottom:pick(P.bottom,Math.min(cab?3:4,Math.ceil(days/3)+1)),dress:days>=3?pick(P.dress,days>=6?(cab?2:3):1):[],
      jacket:pick(P.jacket,cab?1:2),shoes:pick(P.shoes,cab?(days>=4?2:1):(days>=4?3:2)),bag:pick(P.bag,cab?1:2),acc:pick(P.acc,cab?2:4)};
    const sh=cap.shoes.length?cap.shoes:[null],combos=[];
    for(const s of sh){for(const a of cap.top)for(const b of cap.bottom)combos.push({top:a,bottom:b,shoes:s});for(const d of cap.dress)combos.push({dress:d,shoes:s})}
    if(!combos.length)continue;
    const sc=combos.map(c=>{const o={...c,jacket:cap.jacket[0]||null,bag:cap.bag[0]||null};return{o,s:harmonyV([...Object.values(o),...cap.acc],st)}}).sort((a,b)=>b.s-a.s);
    const good=sc.filter(x=>x.s>-4),n=new Set(Object.values(cap).flat().map(i=>i.id)).size;
    const score=Math.min(good.length,days)*10-n*1.5+good.slice(0,days).reduce((a,x)=>a+x.s,0)/days;
    if(!best||score>best.score)best={score,cap,list:good.length?good:sc};
  }
  if(!best)return{days,style,season,bag,pack:[],outfits:[]};
  // varier : on prend à chaque fois la tenue qui réutilise le moins les pièces des jours précédents
  const used={},chosen=[],pool=[...best.list];
  for(let d=0;d<days&&pool.length;d++){
    pool.sort((p,q)=>Object.values(p.o).filter(Boolean).reduce((a,i)=>a+(used[i.id]||0),0)*3-p.s-(Object.values(q.o).filter(Boolean).reduce((a,i)=>a+(used[i.id]||0),0)*3-q.s));
    const x=pool.shift();chosen.push(x);Object.values(x.o).filter(Boolean).forEach(i=>used[i.id]=(used[i.id]||0)+1);
  }
  const outfits=[];
  for(let d=0;d<days;d++){const x=chosen[d%chosen.length],o={};SLOTS.forEach(s=>{if(s.key==="acc"){if(best.cap.acc.length)o.acc=best.cap.acc.map(i=>i.id)}else if(x.o[s.key])o[s.key]=x.o[s.key].id});outfits.push(o)}
  const pack=[...new Map(Object.values(best.cap).flat().map(i=>[i.id,i])).values()].sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category));
  return{days,style,season,bag,pack,outfits};
}

let wdet=null;

const seasonPen=i=>{const cs=capSeason();if(i.season&&i.season!=="Toute l'année"&&i.season!==cs)return 8;
  if(cs==="Automne / Hiver"&&/sandale|tong|mule|babouche|short|maillot|paille/i.test(i.name))return 8;return 0};   // de saison d'abord
const wishPseudo=w=>({id:"__wish",name:w.name,category:w.category,color:w.color||"",thumb:w.thumb,tags:[]});
function wishIdeas(w,slot,n){
  const wi=wishPseudo(w),get=id=>id==="__wish"?wi:byId(id);
  const need={dress:["shoes","bag","jacket"],top:["bottom","shoes","bag","jacket"],layer:["top","bottom","shoes","bag"],bottom:["top","shoes","bag","jacket"],
    jacket:["top","bottom","shoes","bag"],shoes:["top","bottom","bag","jacket"],bag:["top","bottom","shoes","jacket"],acc:["top","bottom","shoes","bag"]}[slot]||["top","bottom","shoes"];
  const used={},out=[];
  for(let t=0;t<n*3&&out.length<n;t++){
    const o={[slot]:"__wish"};
    for(const k of need){
      const vals=lookIds(o).map(get).filter(Boolean),style=lookStyle(vals.filter(i=>i.id!=="__wish"));
      const c=inSlot(k).filter(i=>k!=="layer"||/pull|cardigan|gilet|chemise|maille/i.test(i.name+" "+i.category))
        .map(i=>({i,s:harmonyV([...vals,i],style)-(OVERUSED.has(i.id)?15:0)-seasonPen(i)-(used[i.id]||0)*7+Math.random()*3})).sort((a,b)=>b.s-a.s);
      if(!c.length)continue;
      if(k==="jacket"&&c[0].s<-2)continue;                 // pas de veste si rien ne va
      o[k]=c[0].i.id;
    }
    // un ou deux accessoires s'ils ajoutent quelque chose
    for(let a=0;a<2;a++){const vals=lookIds(o).map(get).filter(Boolean);
      const c=inSlot("acc").filter(i=>!ids(o.acc).includes(i.id)).map(i=>({i,s:harmonyV([...vals,i],lookStyle(vals))-harmonyV(vals,lookStyle(vals))-(OVERUSED.has(i.id)?15:0)-seasonPen(i)-(used[i.id]||0)*4})).sort((a,b)=>b.s-a.s)[0];
      if(c&&c.s>-1)o.acc=[...ids(o.acc),c.i.id]}
    const key=lookKey(o);if(out.some(x=>lookKey(x.o)===key))continue;
    lookIds(o).forEach(id=>{if(id!=="__wish")used[id]=(used[id]||0)+1});
    const vals=lookIds(o).map(get).filter(Boolean),loud=[...new Set(vals.map(i=>i.color||"").filter(c=>!NEUTRAL.has(c)))],wk=wheelKind(loud);
    const star=vals.filter(i=>i.id!=="__wish"&&!["Accessoires","Sacs"].includes(i.category)).sort((a,b)=>((b.color&&!NEUTRAL.has(b.color))?1:0)-((a.color&&!NEUTRAL.has(a.color))?1:0))[0];
    const note=wk==="complémentaires"?`${loud.join(" et ")} : deux couleurs opposées sur le cercle chromatique, le contraste fait la tenue.`:
      wk==="triade"?`${loud.join(", ")} : une triade, trois couleurs en triangle sur le cercle.`:
      wk==="camaïeu"?`${loud.join(" et ")} : des couleurs voisines, un camaïeu doux.`:
      wk==="une couleur"?`Tout est neutre autour, sauf le ${loud[0].toLowerCase()} : une seule couleur, et elle ressort.`:
      `Une palette neutre : c'est la matière et la coupe de ta pièce qui font la tenue.`;
    out.push({o,name:star?`Avec ${star.name.charAt(0).toLowerCase()+star.name.slice(1)}`:"Tenue simple",note});
  }
  return out;
}

// cercle chromatique des peintres (rouge-jaune-bleu), en degrés
const WHEEL={"Rouge":0,"Orange":60,"Jaune":120,"Vert":180,"Bleu":240,"Violet":300,"Rose":330};
const wdist=(a,b)=>{const d=Math.abs(WHEEL[a]-WHEEL[b])%360;return Math.min(d,360-d)};
function wheelKind(cols){
  const c=cols.filter(x=>x in WHEEL);
  if(c.length<2)return c.length&&cols.length===c.length?"une couleur":"";
  if(c.length!==cols.length)return "";
  if(c.length===2){const d=wdist(c[0],c[1]);return d>=150?"complémentaires":d<=60?"camaïeu":""}
  if(c.length===3){const ds=[wdist(c[0],c[1]),wdist(c[1],c[2]),wdist(c[0],c[2])];return ds.every(d=>d>=100&&d<=140)?"triade":""}
  return "";
}
function wheelScore(cols){
  if(cols.length<2)return 0;
  const k=wheelKind(cols);
  if(k==="complémentaires"||k==="triade")return 3;          // couleurs opposées ou en triangle : ça marche
  if(k==="camaïeu")return 1;                                // couleurs voisines
  return -6*(cols.length-1);                                // couleurs vives qui se battent
}
const NEUTRAL=new Set(["Noir","Blanc","Beige","Marron","Gris","Doré","Argenté",""]);
function harmonyV(vals,style,key){
  let sc=0;vals=vals.filter(Boolean);
  const loud=new Set(vals.map(i=>i.color||"").filter(c=>!NEUTRAL.has(c)));
  sc+=wheelScore([...loud]);                                // cercle chromatique : complémentaires, triades, camaïeux
  const metals=new Set(vals.filter(i=>["Sacs","Accessoires"].includes(i.category)||SHOECATS.includes(i.category)).map(i=>i.color).filter(c=>c==="Doré"||c==="Argenté"));
  if(metals.size>1)sc-=4;                                   // pas d'or et d'argent mélangés
  const seas=new Set(vals.map(i=>i.season).filter(x=>x&&x!=="Toute l'année"));
  if(seas.size>1)sc-=8;                                     // pas été + hiver
  vals.forEach(i=>{if((i.tags||[]).includes(style))sc+=3;else if((i.tags||[]).length)sc-=5});
  const prints=vals.filter(i=>/léopard|python|camouflage|imprimé|arc-en-ciel|tapisserie|Multicolore/i.test(i.name+" "+i.color)).length;
  if(prints>1)sc-=5*(prints-1);                             // un seul imprimé fort
  const denim=vals.filter(i=>/jean|denim/i.test(i.name)).length;
  if(denim>1)sc-=3*(denim-1);                              // plusieurs denims : possible, mais jamais par défaut
  const types=vals.filter(i=>i.category==="Accessoires").map(accType).filter(t=>t!=="poignet");
  if(new Set(types).size<types.length)sc-=6;                // pas deux colliers ni deux paires de boucles
  if(key&&looks.some(l=>lookKey(l.items)===key))sc-=20;     // pas une tenue déjà enregistrée
  return sc+Math.random()*2;
}

$("#shuffle").onclick=()=>{

  const lastStyle=shufHist[0]?.style,cand=(styles.length?styles:STYLES).filter(t=>t!=="Sport"||Math.random()<.35);
  const sty=cand.filter(t=>t!==lastStyle);const style=(sty.length?sty:cand.length?cand:STYLES)[Math.floor(Math.random()*(sty.length||cand.length||STYLES.length))];
  const tg=i=>i.tags||[],sportOnly=i=>tg(i).includes("Sport")&&!tg(i).some(t=>t!=="Sport");

  act.forEach(s=>{let l=inSlot(s.key);
    if(s.key==="layer"){const o=l.filter(i=>OVER.test(i.name));if(o.length)l=o}        // par-dessus : pull, cardigan, gilet, chemise ouverte
    if(style==="Sport")pools[s.key]=l.filter(i=>tg(i).includes("Sport"));            // pas de pièce de ville dans une tenue sport
    else{const ok=l.filter(i=>!sportOnly(i)),p=ok.filter(i=>tg(i).includes(style));
      pools[s.key]=p.length>=3?p:ok}});                                               // jamais de sport en ville, et assez de choix
  // nouveauté : pièces vues dans les derniers mélanges, déjà très utilisées dans tes tenues, ou souvent portées = moins prioritaires
  const recent={};shufHist.forEach((h,n)=>h.ids.forEach(id=>recent[id]=(recent[id]||0)+(8-n)));
  const inLooks={};looks.forEach(l=>lookIds(l.items).forEach(id=>inLooks[id]=(inLooks[id]||0)+1));
  const fresh=i=>-(recent[i.id]||0)*1.2-(inLooks[i.id]||0)*0.8-(i.wears||0)*0.5+(!i.wears&&!inLooks[i.id]?3:0);
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const cands=[];
  for(let n=0;n<600;n++){
    const c={};
    act.forEach(s=>{const p=pools[s.key];if(!p.length)return;
      if(s.key==="acc"){const want=1+Math.floor(Math.random()*3),seenT=new Set(),out=[];
        for(const i of [...p].sort(()=>Math.random()-.5)){const t=accType(i);if(t!=="poignet"&&seenT.has(t))continue;seenT.add(t);out.push(i);if(out.length>=want)break}

      else c[s.key]=rnd(p)});
    if(c.layer&&c.top&&c.layer.id===c.top.id)delete c.layer;                  // jamais deux fois le même haut
    const vals=Object.values(c).flat();
    const key=lookKey(Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Array.isArray(v)?v.map(i=>i.id):v.id])));
    const sc=harmonyV(vals,style,key)+vals.reduce((a,i)=>a+fresh(i),0)/Math.max(1,vals.length)*2.5+Math.random()*4;

  }

  act.forEach(s=>{const v=best[s.key];if(!v){if(style==="Sport")shown[s.key]=false;return}sel[s.key]=s.key==="acc"?v.map(i=>i.id):v.id});

  try{localStorage.setItem("dressing.shuf",JSON.stringify(shufHist))}catch(_){}

};

  wcol.onSnapshot(s=>{wishes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));renderNav();if(view==="Envies")renderGrid()},()=>{});
  ccol.onSnapshot(s=>{colls=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));renderNav();if(view==="Collections")renderGrid()},()=>{});
  lcol.onSnapshot(s=>{looks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));renderAll()},()=>{});
})();
</script>

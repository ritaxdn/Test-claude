<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parc installé CRM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=Cormorant+Garamond:wght@400&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="crm.css">
<style>
/* Maquette « cycle de vie client » — s'appuie sur les jetons de crm.css (clair et sombre). */
html, body { background: var(--bg); color: var(--ink); font-family: var(--f-body); }
body { min-height: 100vh; background:
  radial-gradient(900px 600px at 92% -5%, var(--bg-glow2), transparent 60%),
  radial-gradient(800px 600px at -5% 45%, var(--bg-glow1), transparent 60%),
  radial-gradient(800px 600px at 100% 100%, var(--bg-glow3), transparent 60%), var(--bg); }
.mq-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--ink); color: var(--on-ink); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.mq-bar b { font-weight: 500; }
.mq-wrap { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
.mq-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.mq-logo { display: inline-flex; flex-direction: column; gap: 3px; }
.mq-logo .w { font-family: var(--f-mark); font-size: 22px; letter-spacing: .22em; text-transform: uppercase; line-height: 1; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mq-logo .t { font-family: var(--f-mono); font-size: 8px; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-2); }
.mq-h1 { font-family: var(--f-display); font-stretch: 118%; font-weight: 500; font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -.03em; text-transform: uppercase; line-height: .95; margin: 6px 0 0; text-wrap: balance; }
.mq-sub { color: var(--ink-2); max-width: 70ch; margin: 10px 0 0; }
.mq-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 22px 0 14px; }
.mq-kpis .card { cursor: pointer; }
.mq-kpis .card[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.mq-v { font-family: var(--f-display); font-stretch: 112%; font-weight: 500; font-size: 30px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.mq-funnel { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 6px 0 18px; }
.mq-funnel i { display: block; height: 100%; }
.mq-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.mq-table th { text-align: left; font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mq-table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.mq-table tr:last-child td { border-bottom: 0; }
.mq-scroll { overflow-x: auto; }
.steps { display: flex; align-items: center; gap: 0; min-width: 170px; }
.steps span { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--field); flex: none; }
.steps span.on { background: var(--ink); border-color: var(--ink); }
.steps span.cur { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.steps em { flex: 1; height: 2px; min-width: 14px; background: var(--line-strong); }
.steps em.on { background: var(--rainbow); }
.steps.big span { width: 16px; height: 16px; }
.step-labels { display: flex; justify-content: space-between; gap: 4px; margin-top: 6px; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.step-labels b { color: var(--ink); font-weight: 500; }
.pbar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 70px; }
.pbar i { display: block; height: 100%; background: var(--rainbow); }
.mq-modal { max-width: 820px; margin: 0 auto; }
.machine { border: 1px solid var(--line-strong); border-radius: 22px; padding: 16px 18px; background: var(--glass); display: grid; gap: 12px; }
.machine + .machine { margin-top: 12px; }
.prac { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.alert { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: var(--warn-bg); color: var(--warn); font-size: 13.5px; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert b { color: inherit; }
.alert .tools { margin-left: auto; }
.mq-set { display: grid; grid-template-columns: minmax(0, 1fr) 110px minmax(0, 200px); gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mq-set input, .mq-set select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--field); color: var(--ink); font: inherit; }
.mq-toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--on-ink); padding: 12px 16px; border-radius: 14px; font-size: 13.5px; box-shadow: var(--shadow); max-width: 360px; z-index: 50; }
.src { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 900px) { .mq-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .mq-kpis .card:last-child { grid-column: 1 / -1; } .prac { grid-template-columns: 1fr; } .mq-set { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="mq-bar"><b>Maquette</b><span>CRM Cellulift · cycle de vie client · données d'exemple, non connectée à la base</span></div>
<div class="mq-wrap">
  <div class="mq-top">
    <div class="mq-logo"><span class="w">Cellulift</span><svg width="140" height="14" viewBox="0 0 160 20" fill="none" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00BCD4"/><stop offset=".25" stop-color="#7B61FF"/><stop offset=".5" stop-color="#E91E8C"/><stop offset=".75" stop-color="#FF5722"/><stop offset="1" stop-color="#FFC107"/></linearGradient></defs><path d="M0 10 H50 L58 10 L64 2 L72 18 L80 6 L86 10 H100 L106 10 L112 4 L118 16 L124 10 H160" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t">CRM</span></div>
    <div class="seg-tabs" role="tablist" aria-label="Écrans de la maquette" style="margin:0;border:0">
      <button role="tab" id="t-parc" data-view="parc" aria-selected="true">Parc installé</button>
      <button role="tab" id="t-fiche" data-view="fiche" aria-selected="false">Fiche client</button>
      <button role="tab" id="t-accueil" data-view="accueil" aria-selected="false">Accueil commercial</button>
      <button role="tab" id="t-reglages" data-view="reglages" aria-selected="false">Réglages › Suivi client</button>
    </div>
  </div>
  <main id="view"></main>
</div>
<div id="toast" class="mq-toast" hidden></div>

<script>
const STEPS = ["vendu", "installe", "onboarde", "formation", "certifie", "autonome"];
const STEP_LABEL = { vendu: "Vendue", installe: "Installée", onboarde: "Onboardée", formation: "Formation", certifie: "Certifiée", autonome: "Autonome" };
const SUIVI = {
  onboarding_a_planifier: ["Onboarding à planifier", "warn", "Planifier l'onboarding", "Formateur"],
  praticien_inconnu: ["Praticien à compléter", "warn", "Compléter le praticien", "Commercial"],
  formation_non_commencee: ["Formation non commencée", "warn", "Relancer le praticien", "Commercial"],
  formation_a_l_arret: ["Formation à l'arrêt", "bad", "Appeler le praticien", "Commercial"],
  evaluation_echouee: ["Évaluation échouée", "bad", "Proposer un accompagnement", "Formateur"],
  point_90_jours: ["Point à 90 jours", "vio", "Planifier le point", "Commercial"],
};
// Données d'exemple (noms fictifs ; machines du catalogue Cellulift).
const ROWS = [
  { compte: "Clinique Lumière", ville: "Casablanca", machine: "HANOVER 5G", sn: "HN5G-24-0187", prat: "Dr Salma Benali", etape: "formation", pct: 46, act: "il y a 2 j", suivi: null, com: "Yassine B.", inst: "12/03/2025", onb: "18/03/2025" },
  { compte: "Clinique Lumière", ville: "Casablanca", machine: "HANOVER 5G", sn: "HN5G-24-0187", prat: "Dr Karim Lahlou", etape: "onboarde", pct: 0, act: "—", suivi: "formation_non_commencee", com: "Yassine B.", inst: "12/03/2025", onb: "18/03/2025" },
  { compte: "Clinique Lumière", ville: "Casablanca", machine: "DERMABRASIF 6G", sn: "DB6G-23-0412", prat: "Dr Salma Benali", etape: "autonome", pct: 100, act: "févr. 2026", suivi: null, com: "Yassine B.", inst: "04/11/2024", onb: "08/11/2024", cert: "CA-2026-7F3K-91QD" },
  { compte: "Centre Esthétique Tazi", ville: "Rabat", machine: "SEVENWAVES", sn: "SW7-25-0033", prat: "Dr Omar Tazi", etape: "certifie", pct: 100, act: "juil. 2026", suivi: "point_90_jours", com: "Salma K.", inst: "23/06/2025", onb: "30/06/2025", cert: "CA-2026-4H2N-77PL" },
  { compte: "Polyclinique du Nord", ville: "Tanger", machine: "LA QUEEN", sn: "LQ-26-0102", prat: "—", etape: "installe", pct: 0, act: "—", suivi: "praticien_inconnu", com: "Mehdi R.", inst: "14/10/2026", onb: "" },
  { compte: "Cabinet Dr Alaoui", ville: "Tanger", machine: "LA QUEEN", sn: "LQ-26-0117", prat: "Dr Hind Alaoui", etape: "installe", pct: 0, act: "—", suivi: "onboarding_a_planifier", com: "Mehdi R.", inst: "08/10/2026", onb: "" },
  { compte: "Skin Center Agadir", ville: "Agadir", machine: "SLIMAX LIPO 7", sn: "SL7-26-0041", prat: "Nora Chraibi", etape: "formation", pct: 35, act: "il y a 29 j", suivi: "formation_a_l_arret", com: "Salma K.", inst: "02/07/2026", onb: "09/07/2026" },
  { compte: "Clinique des Oliviers", ville: "Marrakech", machine: "FRAC'COV 4", sn: "FC4-26-0019", prat: "Dr Rachid Fassi", etape: "formation", pct: 100, act: "hier", suivi: "evaluation_echouee", com: "Yassine B.", inst: "15/08/2026", onb: "22/08/2026" },
  { compte: "Centre Beauté Oasis", ville: "Fès", machine: "LED BIO-LIGHT", sn: "LBL-26-0240", prat: "Sofia Kettani", etape: "formation", pct: 72, act: "aujourd'hui", suivi: null, com: "Salma K.", inst: "20/09/2026", onb: "24/09/2026" },
  { compte: "Clinique Ibn Rochd", ville: "Casablanca", machine: "HANOVER 5G", sn: "HN5G-26-0201", prat: "Dr Nabil Squalli", etape: "vendu", pct: 0, act: "—", suivi: null, com: "Yassine B.", inst: "", onb: "" },
];
const FILTERS = [
  ["suivi", "Suivi requis", (r) => r.suivi],
  ["onboarding", "Onboarding à planifier", (r) => r.suivi === "onboarding_a_planifier" || r.etape === "vendu"],
  ["non_commencee", "Formation non commencée", (r) => r.suivi === "formation_non_commencee"],
  ["formation", "En formation", (r) => r.etape === "formation"],
  ["certifies", "Certifiés", (r) => ["certifie", "autonome"].includes(r.etape)],
  ["tous", "Tous", () => true],
];
let view = "parc", filter = "suivi";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function steps(etape, big) {
  const i = STEPS.indexOf(etape);
  return `<div class="steps ${big ? "big" : ""}" role="img" aria-label="Étape : ${STEP_LABEL[etape]}">${STEPS.map((s, k) => `${k ? `<em class="${k <= i ? "on" : ""}"></em>` : ""}<span class="${k < i ? "on" : k === i ? "cur" : ""}" title="${STEP_LABEL[s]}"></span>`).join("")}</div>`;
}
const suiviPill = (k) => k ? `<span class="pill ${SUIVI[k][1]}">${SUIVI[k][0]}</span>` : `<span class="pill ok">À jour</span>`;
const pbar = (p) => `<div style="display:flex;align-items:center;gap:8px"><div class="pbar" style="flex:1"><i style="width:${p}%"></i></div><span style="font-family:var(--f-mono);font-size:11px">${p} %</span></div>`;

function viewParc() {
  const n = (f) => ROWS.filter(f).length, tot = ROWS.length;
  const k = [
    ["Machines × praticiens", tot, "tous"],
    ["Onboardés", n((r) => STEPS.indexOf(r.etape) >= 2), "tous"],
    ["Formation commencée", n((r) => STEPS.indexOf(r.etape) >= 3), "formation"],
    ["Certifiés", n((r) => STEPS.indexOf(r.etape) >= 4), "certifies"],
    ["Suivi requis", n((r) => r.suivi), "suivi"],
  ];
  const f = FILTERS.find((x) => x[0] === filter);
  const rows = ROWS.filter(f[2]);
  const seg = STEPS.map((s, i) => [s, ROWS.filter((r) => r.etape === s).length, ["var(--viz-0)", "#00BCD4", "#7B61FF", "#E91E8C", "#FF5722", "#FFC107"][i]]);
  return `<div class="sh-lab">Clients · parc installé</div>
    <h1 class="mq-h1">Parc installé</h1>
    <p class="mq-sub">Chaque machine vendue, ses praticiens, où ils en sont de l'onboarding et de la formation, et qui doit les suivre.</p>
    <div class="mq-kpis">${k.map(([l, v, fk]) => `<button class="card" data-filter="${fk}" aria-pressed="${filter === fk && l !== "Onboardés" && l !== "Machines × praticiens"}" style="text-align:left;font:inherit;color:inherit"><span class="sh-lab">${l}</span><span class="mq-v">${v}</span>${l === "Suivi requis" ? `<span class="hint" style="margin:0">dont ${n((r) => r.suivi && SUIVI[r.suivi][1] === "bad")} urgents</span>` : l !== "Machines × praticiens" ? `<span class="hint" style="margin:0">${Math.round((v / tot) * 100)} % du parc</span>` : `<span class="hint" style="margin:0">${new Set(ROWS.map((r) => r.compte)).size} clients</span>`}</button>`).join("")}</div>
    <div class="mq-funnel" aria-hidden="true">${seg.map(([s, v, c]) => v ? `<i style="width:${(v / tot) * 100}%;background:${c}" title="${STEP_LABEL[s]} : ${v}"></i>` : "").join("")}</div>
    <div class="tools" style="margin-bottom:14px">${seg.map(([s, v, c]) => `<span class="hint" style="margin:0;display:inline-flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:${c};display:inline-block"></i>${STEP_LABEL[s]} ${v}</span>`).join("")}</div>
    <div class="seg-tabs" role="tablist" aria-label="Filtres">${FILTERS.map(([k2, l, fn]) => `<button role="tab" data-filter="${k2}" aria-selected="${filter === k2}">${l} · ${ROWS.filter(fn).length}</button>`).join("")}</div>
    <section class="sh-card" style="padding:6px 8px"><div class="mq-scroll"><table class="mq-table"><thead><tr><th>Client</th><th>Machine</th><th>Praticien</th><th>Étape</th><th>Formation en ligne</th><th>Suivi</th><th>Commercial</th><th></th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td><b>${esc(r.compte)}</b><div class="hint" style="margin:0">${esc(r.ville)}</div></td><td>${esc(r.machine)}<div class="src">S/N ${esc(r.sn)}</div></td><td>${esc(r.prat)}</td>
        <td>${steps(r.etape)}<div class="src" style="margin-top:4px">${STEP_LABEL[r.etape]}</div></td><td style="min-width:120px">${STEPS.indexOf(r.etape) >= 3 ? pbar(r.pct) + `<div class="src">Activité : ${esc(r.act)}</div>` : `<span class="hint" style="margin:0">—</span>`}</td>
        <td>${suiviPill(r.suivi)}${r.suivi ? `<div class="src" style="margin-top:4px">${SUIVI[r.suivi][3]}</div>` : ""}</td><td>${esc(r.com)}</td>
        <td style="text-align:right">${r.suivi ? `<button class="btn small primary" data-do="${esc(SUIVI[r.suivi][2])}">${esc(SUIVI[r.suivi][2])}</button>` : ""} <button class="btn small" data-open="${esc(r.compte)}">Fiche</button></td></tr>`).join("") || `<tr><td colspan="8" class="hint">Aucune machine dans ce filtre.</td></tr>`}
    </tbody></table></div></section>
    <p class="hint" style="margin-top:12px">Sources : machines et onboarding saisis dans le CRM ; formation en ligne et certificats envoyés par CELLULIFT Academy. Suivis recalculés chaque nuit et à chaque synchronisation.</p>`;
}

function viewFiche(nom = "Clinique Lumière") {
  const rs = ROWS.filter((r) => r.compte === nom);
  const machines = [...new Set(rs.map((r) => r.sn))].map((sn) => rs.filter((r) => r.sn === sn));
  const suivis = rs.filter((r) => r.suivi);
  return `<div class="sh-card mq-modal">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div><h1 class="mq-h1" style="font-size:24px">${esc(nom)}</h1><div class="tools" style="margin-top:8px">${rs[0].prat.startsWith("Dr") ? `<span class="pill A">Médecin</span>` : `<span class="pill C">Non-médecin</span>`}<span class="pill ok">Client</span><span class="hint" style="margin:0">${esc(rs[0].ville)} · commercial ${esc(rs[0].com)}</span></div></div>
      <div class="tools"><button class="btn small" data-do="Appeler">Appeler</button><button class="btn small" data-do="Visite faite">Visite faite</button></div>
    </div>
    <div class="sep"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h3>Parc &amp; formation <span class="hint">· nouveau bloc</span></h3><span class="tools">${suivis.length ? `<span class="pill warn">${suivis.length} suivi${suivis.length > 1 ? "s" : ""} requis</span>` : `<span class="pill ok">Tout est à jour</span>`}</span></div>
    <div style="margin-top:12px">${machines.map((ps) => { const m = ps[0]; const top = ps.map((p) => STEPS.indexOf(p.etape)).reduce((a, b) => Math.max(a, b)); return `<div class="machine">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${esc(m.machine)}</b> <span class="src">S/N ${esc(m.sn)}</span><div class="hint" style="margin:2px 0 0">Installée le ${esc(m.inst) || "—"} · onboarding ${m.onb ? "fait le " + esc(m.onb) : "à planifier"}</div></div><div class="tools"><button class="btn small" data-do="Ajouter un praticien">+ Praticien</button>${m.onb ? "" : `<button class="btn small primary" data-do="Marquer onboardé">Marquer onboardé</button>`}</div></div>
      <div>${steps(STEPS[top], true)}<div class="step-labels">${STEPS.map((s, i) => i === top ? `<b>${STEP_LABEL[s]}</b>` : `<span>${STEP_LABEL[s]}</span>`).join("")}</div></div>
      ${ps.map((p) => `<div class="prac"><div><b>${esc(p.prat)}</b><div class="hint" style="margin:2px 0 0">${STEP_LABEL[p.etape]}${p.cert ? ` · certificat <span class="src">${esc(p.cert)}</span>` : ""}</div></div>
        <div>${STEPS.indexOf(p.etape) >= 3 ? pbar(p.pct) + `<div class="src" style="margin-top:3px">Dernière activité : ${esc(p.act)}</div>` : `<span class="hint" style="margin:0">Formation en ligne non commencée</span>`}</div>
        <div>${suiviPill(p.suivi)}</div>
        ${p.suivi ? `<div class="alert ${SUIVI[p.suivi][1] === "bad" ? "bad" : ""}" style="grid-column:1/-1"><span><b>${SUIVI[p.suivi][0]}.</b> ${p.suivi === "formation_non_commencee" ? `Onboardé le ${esc(p.onb)}, aucune leçon suivie depuis.` : ""} Tâche de suivi créée pour ${esc(p.com)}</span><span class="tools"><button class="btn small primary" data-do="${esc(SUIVI[p.suivi][2])}">${esc(SUIVI[p.suivi][2])}</button><button class="btn small" data-do="Ouvrir dans l'Academy">Voir dans l'Academy</button></span></div>` : ""}</div>`).join("")}
    </div>`; }).join("")}</div>
    <div class="sep"></div>
    <h3>Prochaine action</h3>
    ${suivis.length ? suivis.map((p) => `<div class="sh-row"><div class="src" style="width:76px">Aujourd'hui</div><div style="flex:1;min-width:0">Tâche · Suivi client · ${esc(p.prat)} — ${SUIVI[p.suivi][0].toLowerCase()} ${esc(p.machine)}</div><button class="btn small" data-do="Tâche faite">Fait</button></div>`).join("") : `<p class="hint">Aucune.</p>`}
    <p class="hint" style="margin-top:14px">Le reste de la fiche (contacts, devis, paiements, opportunités, activités, commentaires) est inchangé.</p>
  </div>`;
}

function viewAccueil() {
  const tasks = ROWS.filter((r) => r.suivi && r.com === "Yassine B.");
  return `<div class="sh-lab">Accueil commercial · Yassine B.</div><h1 class="mq-h1">À faire aujourd'hui</h1>
    <p class="mq-sub">Les tâches de suivi client arrivent dans la liste habituelle, à côté des rappels et des visites. Elles se ferment seules quand la situation se règle (par exemple quand le praticien commence sa formation).</p>
    <section class="sh-card" style="margin-top:18px">
      ${[["09:30", "Visite · Centre Medica (prospect)", null], ["11:00", "Appel · relance devis DV-2026-041", null], ...tasks.map((r) => ["—", `Suivi client · ${r.prat} — ${SUIVI[r.suivi][0].toLowerCase()} · ${r.machine} · ${r.compte}`, r.suivi])].map(([h, t, s]) => `<div class="sh-row"><div class="src" style="width:56px">${h}</div><div style="flex:1;min-width:0">${esc(t)}</div>${s ? suiviPill(s) : `<span class="pill">Agenda</span>`}<button class="btn small" data-do="Tâche faite">Fait</button></div>`).join("")}
    </section>
    <section class="sh-card" style="margin-top:16px"><div class="sh-lab">Espace superviseur · par commercial</div>
      <div class="mq-scroll"><table class="mq-table" style="margin-top:8px"><thead><tr><th>Commercial</th><th>Machines suivies</th><th>Onboardées</th><th>Formation commencée</th><th>Suivis en retard</th></tr></thead><tbody>
      ${["Yassine B.", "Salma K.", "Mehdi R."].map((c) => { const rs = ROWS.filter((r) => r.com === c); const pc = (f) => Math.round((rs.filter(f).length / rs.length) * 100); return `<tr><td><b>${c}</b></td><td>${rs.length}</td><td>${pbar(pc((r) => STEPS.indexOf(r.etape) >= 2))}</td><td>${pbar(pc((r) => STEPS.indexOf(r.etape) >= 3))}</td><td>${rs.filter((r) => r.suivi).length ? `<span class="pill warn">${rs.filter((r) => r.suivi).length}</span>` : `<span class="pill ok">0</span>`}</td></tr>`; }).join("")}
      </tbody></table></div></section>`;
}

function viewReglages() {
  const rules = [
    ["onboarding_a_planifier", "Installée sans onboarding depuis", 7, "Formateur"],
    ["formation_non_commencee", "Onboardé, formation en ligne non commencée depuis", 14, "Commercial du compte"],
    ["formation_a_l_arret", "Formation en cours sans activité depuis", 21, "Commercial du compte"],
    ["evaluation_echouee", "Échecs au quiz final", 2, "Formateur"],
    ["point_90_jours", "Point d'utilisation après certification", 90, "Commercial du compte"],
    ["praticien_inconnu", "Machine installée sans praticien avec e-mail", 0, "Commercial du compte"],
  ];
  return `<div class="sh-lab">Réglages · admin</div><h1 class="mq-h1">Suivi client</h1>
    <p class="mq-sub">Quand créer une tâche de suivi, et pour qui. Les valeurs ci-dessous sont celles proposées par défaut.</p>
    <section class="sh-card" style="margin-top:18px">
      <div class="mq-set" style="padding-top:0"><span class="sh-lab">Règle</span><span class="sh-lab">Seuil</span><span class="sh-lab">Tâche pour</span></div>
      ${rules.map(([k, l, v, who], i) => `<div class="mq-set"><label for="r${i}"><b>${SUIVI[k][0]}</b><div class="hint" style="margin:2px 0 0">${l}</div></label>
        ${v ? `<input id="r${i}" type="number" min="1" value="${v}" aria-label="Seuil ${SUIVI[k][0]}">` : `<span class="hint" id="r${i}" style="margin:0">Immédiat</span>`}
        <select aria-label="Responsable ${SUIVI[k][0]}"><option ${who.startsWith("Commercial") ? "selected" : ""}>Commercial du compte</option><option ${who === "Formateur" ? "selected" : ""}>Formateur</option><option>Superviseur</option></select></div>`).join("")}
      <div class="tools" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-do="Réglages enregistrés">Enregistrer</button></div>
    </section>`;
}

function render() {
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-selected", b.dataset.view === view));
  const el = document.getElementById("view");
  el.innerHTML = view === "parc" ? viewParc() : view === "fiche" ? viewFiche(window.__fiche) : view === "accueil" ? viewAccueil() : viewReglages();
}
let tt;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2600); }
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; render(); window.scrollTo(0, 0); return; }
  const f = e.target.closest("[data-filter]"); if (f) { filter = f.dataset.filter; render(); return; }
  const o = e.target.closest("[data-open]"); if (o) { window.__fiche = o.dataset.open; view = "fiche"; render(); window.scrollTo(0, 0); return; }
  const d = e.target.closest("[data-do]"); if (d) toast(`${d.dataset.do} — action simulée dans la maquette`);
});
const start = { parc: 1, fiche: 1, accueil: 1, reglages: 1 };
if (start[location.hash.slice(1)]) view = location.hash.slice(1);
render();
</script>
</body>
</html>

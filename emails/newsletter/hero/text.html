<!doctype html><html><head><meta charset="utf-8">
<!-- Rendu d'un texte de la newsletter aux polices de la marque (titres Archivo 118 %, étiquettes JetBrains Mono). -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
#t{display:inline-block;padding:2px 1px}
.display{font-family:'Archivo';font-stretch:118%;font-weight:600;text-transform:uppercase;letter-spacing:-.02em;line-height:1.02}
.mono{font-family:'JetBrains Mono';font-weight:400;text-transform:uppercase;letter-spacing:.2em;line-height:1.5}
.dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:.9em;vertical-align:.05em}
</style></head><body><div id="t"></div>
<script>
const q=JSON.parse(new URLSearchParams(location.search).get('j'));const t=document.getElementById('t');
t.className=q.kind;t.style.fontSize=q.size+'px';t.style.color=q.color;t.style.maxWidth=q.maxw+'px';t.style.textAlign=q.align||'left';
if(q.dot){const d=document.createElement('span');d.className='dot';d.style.background=q.dot;t.appendChild(d);}
t.appendChild(document.createTextNode(q.text));
</script></body></html>

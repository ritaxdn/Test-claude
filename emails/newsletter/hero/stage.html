<!doctype html><html><head><meta charset="utf-8">
<!-- Scène d'une machine (1040 × 1120) : fond nacré, halo de couleur, numéro, machine détourée. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1040px;height:1120px;background:#ECEEF3}
.card{position:absolute;inset:0;border-radius:64px;overflow:hidden;background:#F4F5F8;background-image:radial-gradient(circle at 50% 46%,var(--c) 0%,transparent 55%),radial-gradient(circle at 100% 0%,var(--c2),transparent 45%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(29,27,38,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(29,27,38,.045) 1px,transparent 1px);background-size:52px 52px}
.num{position:absolute;left:56px;top:40px;font-family:'Archivo';font-stretch:125%;font-weight:600;font-size:200px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(29,27,38,.18)}
.disc{position:absolute;left:50%;top:50%;width:640px;height:640px;transform:translate(-50%,-50%) rotate(var(--r,0deg));border-radius:50%;background:conic-gradient(from 200deg,#7FE3F0,#A797FF,#F29BD0,#FFC58F,#7FE3F0);opacity:.85;filter:blur(1px)}
.machine{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);max-width:820px;height:860px;object-fit:contain;filter:drop-shadow(0 34px 34px rgba(29,27,38,.25))}
.floor{position:absolute;left:50%;bottom:92px;width:440px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(29,27,38,.25),transparent 70%)}
.line{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#00BCD4,#7B61FF,#E91E8C,#FF5722,#FFC107)}
</style></head><body><div class="card"><div class="grid"></div><div class="num" id="n"></div><div class="disc"></div><div class="floor"></div><img class="machine" id="img"><div class="line"></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('n').textContent=q.get('n');
const s=document.documentElement.style;s.setProperty('--c',q.get('c'));s.setProperty('--c2',q.get('c2'));s.setProperty('--r',(q.get('r')||0)+'deg');
const im=document.getElementById('img');im.src=q.get('img');if(q.get('wide'))im.style.height='640px';</script>
</body></html>

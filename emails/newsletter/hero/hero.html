<!doctype html><html><head><meta charset="utf-8">
<!-- En-tête de la newsletter (1200 × 680) : titre Archivo irisé à gauche, machine détourée à droite. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:680px}
body{position:relative;overflow:hidden;background:#ECEEF3;
 background-image:radial-gradient(circle at 80% 30%,rgba(123,97,255,.20),transparent 38%),radial-gradient(circle at 4% 70%,rgba(0,188,212,.16),transparent 40%),radial-gradient(circle at 98% 100%,rgba(233,30,140,.16),transparent 42%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(29,27,38,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(29,27,38,.05) 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(180deg,transparent,#000 25%,#000 75%,transparent)}
.wrap{position:absolute;left:72px;width:660px;top:86px;z-index:3}
.label{font-family:'JetBrains Mono';font-size:21px;letter-spacing:.2em;text-transform:uppercase;color:#5D5B6B;display:flex;align-items:center;gap:14px}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#00BCD4,#7B61FF,#E91E8C)}
h1{margin-top:36px;font-family:'Archivo';font-stretch:118%;font-weight:560;text-transform:uppercase;letter-spacing:-.035em;line-height:.92;font-size:var(--fs,80px);color:#1D1B26}
h1 .iri{background:linear-gradient(100deg,#1D1B26 0%,#6B5CFF 30%,#D0469C 65%,#E38A3C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.blob{position:absolute;border-radius:50%;filter:blur(60px);z-index:0}
.b1{right:250px;top:60px;width:300px;height:260px;background:rgba(167,151,255,.35)}
.b2{right:40px;top:300px;width:280px;height:240px;background:rgba(127,227,240,.30)}
/* Verre dépoli (glass du site) : blanc translucide, flou, bord blanc, reflet en haut, ombre douce */
.glass{position:absolute;right:56px;top:48px;width:440px;height:520px;border-radius:44px;z-index:1;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.40));backdrop-filter:blur(22px) saturate(1.4);border:2px solid rgba(255,255,255,.95);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 48px 90px -40px rgba(29,27,38,.35)}
.machine{position:absolute;right:120px;bottom:134px;height:450px;z-index:2;filter:drop-shadow(0 30px 30px rgba(29,27,38,.28))}
.floor{position:absolute;right:150px;bottom:124px;z-index:2;width:260px;height:30px;border-radius:50%;background:radial-gradient(rgba(29,27,38,.28),transparent 70%);z-index:1}
.chip{position:absolute;right:84px;top:478px;z-index:4;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.9);border-radius:999px;padding:12px 22px;font-family:'JetBrains Mono';font-size:19px;letter-spacing:.14em;color:#1D1B26;text-transform:uppercase;box-shadow:0 14px 34px -18px rgba(29,27,38,.45)}
svg{position:absolute;left:0;bottom:66px;width:1200px;height:80px;z-index:1}
.foot{position:absolute;left:72px;bottom:34px;font-family:'JetBrains Mono';font-size:18px;letter-spacing:.24em;color:#5D5B6B;text-transform:uppercase}
</style></head><body>
<div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="glass"></div><div class="floor"></div>
<svg viewBox="0 0 1200 80" fill="none"><defs><linearGradient id="g" x1="0" x2="1200" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00BCD4"/><stop offset=".3" stop-color="#7B61FF"/><stop offset=".55" stop-color="#E91E8C"/><stop offset=".8" stop-color="#FF5722"/><stop offset="1" stop-color="#FFC107"/></linearGradient></defs>
<path d="M0 50 H420 L446 50 L466 14 L486 72 L504 34 L518 50 H1200" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
<img class="machine" id="img"><div class="chip" id="chip"></div>
<div class="wrap"><div class="label"><span class="dot"></span><span id="lab"></span></div><h1 id="t"></h1></div>
<div class="foot">Cellulift Academy · Newsletter</div>
<script>const q=new URLSearchParams(location.search);document.getElementById('lab').textContent=q.get('lab');
document.getElementById('t').innerHTML=q.get('a')+'<br><span class="iri">'+q.get('b')+'</span>';
const im=document.getElementById('img');im.src=q.get('img');if(q.get('wide'))im.style.height='340px';
im.onload=()=>{im.style.right=(56+220-im.getBoundingClientRect().width/2)+'px';};
document.getElementById('chip').textContent=q.get('chip');document.documentElement.style.setProperty('--fs',(q.get('fs')||80)+'px');</script>
</body></html>

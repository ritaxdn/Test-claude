<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CRM Cellulift</title>
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://igfgqfwkhyonptbtrywl.supabase.co">
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=Cormorant+Garamond:wght@400&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky glass header, KPI band, tabbed workspace (pipeline board / accounts / activity / team) */
/* Direction « Nacre & verre » (cellulift.ma) : fond nacré, panneaux de verre, signal arc-en-ciel. Archivo élargi / Instrument Sans / JetBrains Mono. */
:root{
  --bg:#ECEEF3; --bg-glow1:rgba(0,188,212,.08); --bg-glow2:rgba(123,97,255,.10); --bg-glow3:rgba(233,30,140,.07);
  --glass:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.46)); --glass-edge:rgba(255,255,255,.9);
  --glass-strong:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,255,255,.70)); --field:#F7F7FA;
  --line:rgba(29,27,38,.08); --line-strong:rgba(29,27,38,.15);
  --ink:#1D1B26; --ink-2:#5D5B6B; --muted:#6E6C7C; --accent:#7B61FF; --on-ink:#FFFFFF;
  --ok:#11845B; --ok-bg:rgba(17,132,91,.10); --warn:#9A5B00; --warn-bg:rgba(178,106,0,.10); --bad:#C2264B; --bad-bg:rgba(194,38,75,.10);
  --seg-a:#007F8F; --seg-c:#B0185E;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 60px -30px rgba(29,27,38,.25);
  --shadow-sm:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -16px rgba(29,27,38,.30);
  --rainbow:linear-gradient(90deg,#00BCD4,#7B61FF,#E91E8C,#FF5722,#FFC107);
  --f-display:"Archivo","Arial Narrow",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-mark:"Cormorant Garamond","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --bg-glow1:rgba(0,188,212,.10); --bg-glow2:rgba(123,97,255,.14); --bg-glow3:rgba(233,30,140,.08);
  --glass:linear-gradient(145deg,rgba(36,40,48,.78),rgba(23,26,31,.60)); --glass-edge:rgba(255,255,255,.08);
  --glass-strong:linear-gradient(145deg,rgba(44,48,58,.95),rgba(30,33,40,.88)); --field:#1B1E24;
  --line:rgba(236,235,231,.09); --line-strong:rgba(236,235,231,.18);
  --ink:#ECEBE7; --ink-2:#B4B6BC; --muted:#9B9EA4; --accent:#A797FF; --on-ink:#0F1114;
  --ok:#3FCB8E; --ok-bg:rgba(63,203,142,.12); --warn:#F0A63A; --warn-bg:rgba(240,166,58,.12); --bad:#FF6B8B; --bad-bg:rgba(255,107,139,.12);
  --seg-a:#5FD6E6; --seg-c:#F27BB8;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 60px -30px rgba(0,0,0,.6);
  --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset,0 10px 24px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1114; --bg-glow1:rgba(0,188,212,.10); --bg-glow2:rgba(123,97,255,.14); --bg-glow3:rgba(233,30,140,.08);
  --glass:linear-gradient(145deg,rgba(36,40,48,.78),rgba(23,26,31,.60)); --glass-edge:rgba(255,255,255,.08);
  --glass-strong:linear-gradient(145deg,rgba(44,48,58,.95),rgba(30,33,40,.88)); --field:#1B1E24;
  --line:rgba(236,235,231,.09); --line-strong:rgba(236,235,231,.18);
  --ink:#ECEBE7; --ink-2:#B4B6BC; --muted:#9B9EA4; --accent:#A797FF; --on-ink:#0F1114;
  --ok:#3FCB8E; --ok-bg:rgba(63,203,142,.12); --warn:#F0A63A; --warn-bg:rgba(240,166,58,.12); --bad:#FF6B8B; --bad-bg:rgba(255,107,139,.12);
  --seg-a:#5FD6E6; --seg-c:#F27BB8;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 60px -30px rgba(0,0,0,.6);
  --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset,0 10px 24px -16px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,tr.click{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:999px;text-decoration:none}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
@media (pointer:fine){html{overscroll-behavior:none}}
body{margin:0}
[hidden]{display:none!important}
body.auth header.top .tabs,body.auth header.top .status,body.auth .wrap>*{display:none}
.who{font-family:var(--f-mono);font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(60vw 40vw at 0% 0%,var(--bg-glow1),transparent 60%),radial-gradient(50vw 40vw at 100% 10%,var(--bg-glow2),transparent 60%),radial-gradient(60vw 40vw at 50% 100%,var(--bg-glow3),transparent 60%);background-attachment:fixed}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid var(--line)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rainbow);opacity:.6}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.wordmark{font-family:var(--f-mark);font-weight:400;margin:0;font-size:22px;letter-spacing:.22em;line-height:1;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.ecg{display:block;width:150px;height:14px}
.ecg path{fill:none;stroke:url(#rb);stroke-width:1.2;stroke-dasharray:320;stroke-dashoffset:320;animation:ecg 1.8s ease forwards .2s}
@keyframes ecg{to{stroke-dashoffset:0}}
.tagline{font-family:var(--f-mono);font-size:8px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.status{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{text-decoration:none;border:0;background:none;padding:9px 13px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s}
.tab[aria-current="page"]{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--glass-edge)}
.tab:hover:not([aria-current="page"]){background:var(--line);color:var(--ink)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--glass-strong);box-shadow:var(--shadow-sm);padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm),0 0 0 1px var(--line-strong)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.small{padding:5px 12px;font-size:12px;min-height:30px}
@media (pointer:coarse){.btn.small{min-height:40px;padding:8px 14px}.btn{min-height:44px}}
.btn.icon{width:38px;padding:0;font-size:16px}
.login{display:flex;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.login .modal{margin-top:12vh}
@media (max-width:1439px){.who{display:none}}
@media (max-width:639px){.status{width:100%;justify-content:flex-start}}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn[aria-busy="true"]::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-block:20px 8px}
.kpi{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:22px;padding:14px 16px;min-width:0}
.kpi .lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-stretch:118%;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:.06em}
.kpi .sub{font-size:12px;color:var(--muted)}

.sep{height:1px;background:var(--rainbow);opacity:.55;margin-block:14px}

main{padding-block:8px 48px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:12px 16px}
h2{font-family:var(--f-display);font-stretch:118%;font-weight:500;font-size:28px;letter-spacing:-.035em;text-transform:uppercase;margin:0;line-height:.95;text-wrap:balance;scroll-margin-top:120px}
@media (max-width:639px){h2{font-size:22px;font-stretch:108%}}
h3{font-family:var(--f-body);font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Pipeline board */
.board-scroll{overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;padding-inline:4px;min-width:max-content}
@media (min-width:1100px){.board{min-width:0}}
.col{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px;min-width:0}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.col-head .name{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.col-head .sum{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head .n{display:inline-block;min-width:20px;text-align:center;border-radius:999px;background:var(--line);padding:0 6px;margin-left:6px;color:var(--ink-2)}
.card{background:var(--glass-strong);border:1px solid var(--glass-edge);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.card .c{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .amt{font-family:var(--f-mono);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.prob{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.prob i{display:block;height:100%;background:var(--rainbow)}
.empty-col{color:var(--muted);font-size:13px;padding:12px 4px;text-align:center;border:1px dashed var(--line-strong);border-radius:10px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.pill.A{color:var(--seg-a);border-color:rgba(0,188,212,.4)} .pill.B{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)} .pill.C{color:var(--seg-c);border-color:rgba(233,30,140,.4)}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}

/* Panels & tables */
.panel{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:28px;padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
tr.click{cursor:pointer} tr.click:hover td,tr.click:focus-visible td{background:var(--line)}
tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.filters{display:flex;gap:8px;flex-wrap:wrap}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{background:var(--field);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;padding:9px 12px;width:100%;min-width:0;font-size:14px}
@media (pointer:coarse),(max-width:639px){input,select,textarea{font-size:16px}}
input:hover,select:hover,textarea:hover{border-color:var(--ink-2)}
.field-err{color:var(--bad);font-size:12px}
textarea{min-height:72px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.filters select,.filters input{width:auto;min-width:130px}

/* Activity feed */
.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-item .when{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.feed-item .what{font-size:13px;overflow-wrap:anywhere}
.feed-item .next{font-size:12px;color:var(--ink-2);margin-top:4px}

/* Overlay modal */
.overlay{position:fixed;inset:0;z-index:50;overscroll-behavior:contain;background:rgba(10,12,18,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--glass-strong);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);border-radius:28px;padding:22px;width:100%;max-width:640px;box-shadow:var(--shadow);margin-top:4vh;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.x{border:0;background:var(--line);color:var(--ink);width:36px;height:36px;flex:none;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}

/* Banners & toasts */
.banner{border-radius:20px;padding:14px 16px;margin-top:16px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-strong);background:var(--glass-strong)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.banner b{display:block;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.skeleton{background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:10px;height:64px}
@keyframes sk{to{background-position:-200% 0}}
.closed-list{display:flex;flex-direction:column;gap:8px}
.closed-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.closed-row:last-child{border-bottom:0}
.fam{border-top:1px solid var(--line);padding-block:4px}
.modal.devis-modal{max-width:980px}
.linkish{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.card .t.linkish{font-weight:600;font-size:14px;line-height:1.3;text-decoration:none}.card .t.linkish:hover{text-decoration:underline}
.check{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:38px;font-size:14px}.check input{width:auto}
.pill.lab{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:11px;color:var(--ink)}
.feed-item.prio{box-shadow:inset 3px 0 0 var(--bad);padding-left:10px}
.acts-inline{flex-wrap:wrap}
.hist{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist .when{font-family:var(--f-mono);font-size:11px;color:var(--muted)}.hist.del>div:last-child>div:first-child{color:var(--bad)}
.modal.opp-modal{max-width:900px}
.lab-mono{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opp-title{font-family:var(--f-display);font-stretch:118%;font-weight:500;font-size:24px;letter-spacing:-.03em;text-transform:uppercase;line-height:1;margin-top:4px;overflow-wrap:anywhere}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:18px 0}
.step{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;padding:10px 8px;border-radius:999px;border:1px solid var(--line-strong);background:var(--field);color:var(--ink-2);font-weight:500;cursor:pointer;min-height:42px;font-size:13px}
.step .dotn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);font-family:var(--f-mono);font-size:11px;flex:none}
.step.done{color:var(--ink)}.step.done .dotn{background:var(--ok-bg);color:var(--ok)}
.step.cur{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.step.cur .dotn{background:var(--rainbow);color:#fff}
.step[disabled]{cursor:default}.step:not([disabled]):hover{border-color:var(--ink-2)}
@media (max-width:600px){.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:14px 16px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--glass-edge)}
.opp-facts .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.quick{margin:14px 0}
.seg-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.seg-tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.seg-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
h4{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:12px 0 0}
.cmts{display:flex;flex-direction:column;gap:12px;margin-top:14px}

.cmt.reply{margin-top:8px;margin-left:18px;background:var(--field)}
.cmt-head{margin-bottom:4px}.cmt .acts-inline{margin-top:6px}
.reply-form{margin-top:8px;margin-left:18px}
.dv-lines td{padding:8px 6px}.dv-lines input,.dv-lines select{padding:7px 9px}.dv-lines input.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dv-lines td[data-total]{vertical-align:middle;white-space:nowrap}
.dv-bottom{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:760px){.dv-bottom{grid-template-columns:minmax(0,1fr)}}
.dv-tot{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0;padding:16px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--shadow-sm)}
.dv-tot dt{color:var(--ink-2)}.dv-tot dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dv-tot .ttc{font-weight:600;color:var(--ink);font-size:16px;padding-top:8px;border-top:1px solid var(--line-strong)}
.dv-sync{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;cursor:pointer;min-height:32px}.dv-sync input{width:auto}
select.dstat{width:auto;padding:5px 10px;border-radius:999px;font-size:12px}
select.dstat.ok{color:var(--ok);background:var(--ok-bg)}select.dstat.warn{color:var(--warn);background:var(--warn-bg)}select.dstat.bad{color:var(--bad);background:var(--bad-bg)}
.fam summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;padding:10px 2px;font-weight:600;list-style:none;min-height:40px}
.fam summary::-webkit-details-marker{display:none}
.fam summary::after{content:"＋";color:var(--muted);margin-left:8px}
.fam[open] summary::after{content:"－"}
.fam summary .hint{margin:0 0 0 auto;font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ecg path{stroke-dashoffset:0}}

<script>
(function(){
const ETAPES = ["Qualification","Proposition","Negociation","Fermeture"];
const ETAPE_LABEL = {Qualification:"Qualification",Proposition:"Proposition",Negociation:"Négociation",Fermeture:"Fermeture"};
const PROB_DEFAUT = {Qualification:20,Proposition:40,Negociation:65,Fermeture:85};
const SEGMENTS = {A_clinique:"A · Clinique / médico-esth.",B_cabinet:"B · Cabinet / santé",C_salon:"C · Salon / beauté"};
const SEG_HINT = "A centres médico-esthétiques · B médecins, kinés, pros de santé · C esthétique, coiffure, spa, parapharmacie";
const VILLES_BASE = ["Casablanca","Rabat","Marrakech","Tanger","Fès","Agadir","Oujda","Tétouan","Meknès"];
const STATUTS = {prospect:"Prospect",client:"Client",personnel:"Personnel"};
const PAGE = 100;
// Villes connues : celles de la base, les plus fréquentes d'abord.
function villes(){ const m=new Map(); VILLES_BASE.forEach(v=>m.set(v,0)); state.comptes.forEach(c=>{ if(c.ville) m.set(c.ville,(m.get(c.ville)||0)+1); }); return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"fr")).map(x=>x[0]); }
const TYPES_ACT = {appel:"Appel",visite:"Visite",rdv:"RDV",demo:"Démo",tache:"Tâche",evenement:"Événement",email:"Email",whatsapp:"WhatsApp",formation:"Formation",autre:"Autre"};
const ROLES = {commercial:"Commercial",superviseur:"Superviseur",admin:"Admin"};
const DEVIS_STATUTS = ["brouillon","envoye","accepte","refuse","signe"];

let currentUser = null;
let state = {equipe:[],comptes:[],contacts:[],produits:[],opportunites:[],activites:[],devis:[],devis_lignes:[]};
let loaded = false, tab = "pipeline", filt = {q:"",segment:"",ville:"",statut:"",com:""};

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mad = n => (n==null||isNaN(n))?"—":new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Number(n));
const madShort = n => { n=Number(n)||0; if(n>=1e6) return (n/1e6).toLocaleString("fr-FR",{maximumFractionDigits:1})+" M"; if(n>=1e4) return Math.round(n/1e3).toLocaleString("fr-FR")+" k"; return mad(n); };
const fmtDate = d => d? new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}) : "—";
const byId = (arr,id)=>arr.find(x=>x.id===id);
const strip = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const localISO = (d=new Date())=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };

/* ---- Value helpers (validated JS values for Supabase) ---- */
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const sTxt = v => (v==null||String(v).trim()==="")?null:String(v).trim();
const sNum = v => (v==null||v===""||isNaN(Number(v)))?null:Number(v);
const sInt = (v,min,max)=>{ if(v==null||v==="") return null; let n=Math.round(Number(v)); if(isNaN(n)) return null; return Math.min(max,Math.max(min,n)); };
const sUuid = v => (v&&UUID_RE.test(v))?v:null;
const sEnum = (v,allowed)=> allowed.includes(v)?v:null;
const sDate = v => (v&&/^\d{4}-\d{2}-\d{2}$/.test(v))?v:null;
const sBool = v => !!v;

/* ---- Supabase ---- */
const SUPABASE_URL = "https://igfgqfwkhyonptbtrywl.supabase.co";
const SUPABASE_KEY = "sb_publishable_ITGBRytbM0ve68y6U0TIiw_bTPWQ2xJ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null;
const ins = (table,obj)=>()=>sb.from(table).insert(obj);
const upd = (table,id,obj)=>()=>sb.from(table).update(obj).eq("id",id);

/* ---- Status / errors ---- */
function setStatus(kind,text){ $("#dot").className="dot "+kind; $("#status-text").textContent=text; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; const s=$("#toast-slot"); s.innerHTML=""; s.appendChild(t); setTimeout(()=>{ if(t.parentNode) t.remove(); },3200); }
function errorCopy(e){
  const msg = (e && (e.message||e.error_description)) || "";
  if(e && e.code==="42501") return ["Accès refusé","Votre compte n’a pas les droits pour cette action (réservée au superviseur ou à l’admin)."];
  if(/Failed to fetch|NetworkError/i.test(msg)) return ["Pas de connexion","Vérifiez votre connexion internet puis cliquez sur ↻."];
  if(/JWT|expired/i.test(msg)) return ["Session expirée","Déconnectez-vous puis reconnectez-vous."];
  return ["La base a refusé l’opération", msg.slice(0,300) || "Réessayez avec ↻."];
}
function showBanner(e,kind){
  const [t,d]=errorCopy(e);
  $("#banner-slot").innerHTML=`<div class="banner ${kind||"bad"}" role="alert"><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`;
}
function clearBanner(){ $("#banner-slot").innerHTML=""; }

/* ---- Load ---- */
let loading=false;
const idx={contactsBy:new Map(),pipeBy:new Map()};
async function load(){
  if(loading) return; loading=true;
  setStatus("busy","Synchronisation…");
  try{
    const q = async (t,order,asc,limit)=>{
      if(limit) return sb.from(t).select("*").order(order,{ascending:asc}).order("id").limit(limit);
      const all=[]; const step=1000;
      for(let from=0;;from+=step){
        const r=await sb.from(t).select("*").order(order,{ascending:asc}).order("id").range(from,from+step-1);
        if(r.error) return r; all.push(...(r.data||[])); if(!r.data||r.data.length<step) break;
      }
      return {data:all,error:null};
    };
    const res = await Promise.all([
      q("equipe","nom",true), q("comptes","nom",true), q("contacts","nom",true), q("produits","nom",true),
      q("opportunites","updated_at",false), q("activites","date_activite",false,300), q("devis","created_at",false), q("devis_lignes","position",true).then(r=>r.error?{data:[],error:null}:r)
    ]);
    const err = res.find(r=>r.error); if(err) throw err.error;
    const [equipe,comptes,contacts,produits,opportunites,activites,devis,devis_lignes] = res.map(r=>r.data||[]);
    state = {equipe,comptes,contacts,produits,opportunites,activites,devis,devis_lignes};
    idx.contactsBy=new Map(); contacts.forEach(c=>idx.contactsBy.set(c.compte_id,(idx.contactsBy.get(c.compte_id)||0)+1));
    idx.pipeBy=new Map(); opportunites.filter(o=>o.issue==="en_cours").forEach(o=>idx.pipeBy.set(o.compte_id,(idx.pipeBy.get(o.compte_id)||0)+(+o.montant_mad||0)));
    me = equipe.find(e=>e.user_id===currentUser.id) || null;
    if(!me){ showNoAccess(); return; }
    loaded = true; clearBanner();
    setStatus("ok","À jour · "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    setStatus("bad","Hors ligne"); showBanner(e);
  }finally{ loading=false; if(me) render(); }
}

async function write(op,okMsg){
  setStatus("busy","Enregistrement…");
  try{ const {error} = await op(); if(error) throw error; toast(okMsg||"Enregistré"); const r=reopenAfter; reopenAfter=null; closeModal(true); await load(); if(r) r(); return true; }
  catch(e){ setStatus("bad","Échec"); const [t,d]=errorCopy(e); toast(t+" — "+d.slice(0,120)); return false; }
}

/* ---- KPIs ---- */
function renderKpis(){
  const open = state.opportunites.filter(o=>o.issue==="en_cours");
  const won = state.opportunites.filter(o=>o.issue==="gagnee");
  const tot = open.reduce((s,o)=>s+(+o.montant_mad||0),0);
  const pond = open.reduce((s,o)=>s+(+o.montant_mad||0)*(+o.probabilite||0)/100,0);
  const wonAmt = won.reduce((s,o)=>s+(+o.montant_mad||0),0);
  const lost = state.opportunites.filter(o=>o.issue==="perdue").length;
  const rate = (won.length+lost)? Math.round(won.length*100/(won.length+lost)) : null;
  const wk = Date.now()-7*864e5;
  const act7 = state.activites.filter(a=>new Date(a.date_activite).getTime()>=wk).length;
  const today = localISO();
  const late = state.activites.filter(a=>a.date_prochaine_action && a.date_prochaine_action<today).length;
  const k = (lab,val,unit,sub)=>`<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}${unit?`<small>${unit}</small>`:""}</div><div class="sub">${sub}</div></div>`;
  $("#kpis").innerHTML = loaded ? [
    k("Pipeline en cours",madShort(tot),"MAD",`${open.length} opportunité${open.length>1?"s":""}`),
    k("Pipeline pondéré",madShort(pond),"MAD","montant × probabilité"),
    k("Gagné",madShort(wonAmt),"MAD",rate==null?"aucune affaire clôturée":`taux de transformation ${rate} %`),
    k("Activité 7 jours",act7,"",late?`${late} relance${late>1?"s":""} en retard`:"aucune relance en retard"),
    k("Comptes",new Intl.NumberFormat("fr-FR").format(state.comptes.length),"",`${state.comptes.filter(c=>c.statut==="client").length} clients · ${new Intl.NumberFormat("fr-FR").format(state.contacts.length)} contacts`)
  ].join("") : Array(5).fill('<div class="kpi"><div class="skeleton" style="height:58px"></div></div>').join("");
}

/* ---- Views ---- */
function render(){
  renderKpis();
  document.querySelectorAll(".tab").forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const v=$("#view");
  if(!loaded){ v.innerHTML=`<div class="board-scroll"><div class="board">${ETAPES.map(()=>'<div class="col"><div class="skeleton"></div><div class="skeleton"></div></div>').join("")}</div></div>`; return; }
  ({pipeline:viewPipeline,comptes:viewComptes,activites:viewActivites,devis:viewDevis,acquisition:viewAcquisition,superviseur:viewSuperviseur,equipe:viewEquipe})[tab](v);
}

function oppCard(o){
  const c = byId(state.comptes,o.compte_id), com = byId(state.equipe,o.commercial_id), p = byId(state.produits,o.produit_id);
  const idx = ETAPES.indexOf(o.etape);
  return `<article class="card">
    <button class="t linkish" data-act="open-opp" data-id="${o.id}">${esc(o.titre)}</button>
    <div class="c">${esc(c?c.nom:"Compte supprimé")}${c?` <span class="pill ${c.segment[0]}">${c.segment[0]}</span>`:""}</div>
    <div class="meta"><span class="amt">${mad(o.montant_mad)} MAD</span><span>· ${o.probabilite??"–"} %</span>${o.date_cloture_prevue?`<span>· ${fmtDate(o.date_cloture_prevue)}</span>`:""}</div>
    <div class="prob" aria-hidden="true"><i style="width:${Math.min(100,+o.probabilite||0)}%"></i></div>
    <div class="meta">${com?esc(com.nom):"Non assignée"}${p?" · "+esc(p.nom):""}</div>
    <div class="acts">
      ${idx>0?`<button class="btn small" data-act="move" data-id="${o.id}" data-to="${ETAPES[idx-1]}" title="Étape précédente">←</button>`:""}
      ${idx<3?`<button class="btn small" data-act="move" data-id="${o.id}" data-to="${ETAPES[idx+1]}">${ETAPE_LABEL[ETAPES[idx+1]]} →</button>`:""}
      ${idx===3?`<button class="btn small ok" data-act="won" data-id="${o.id}">Gagnée</button><button class="btn small bad" data-act="lost" data-id="${o.id}">Perdue</button>`:""}
      <button class="btn small" data-act="edit-opp" data-id="${o.id}">Modifier</button>
      <button class="btn small" data-act="log" data-opp="${o.id}">+ Activité</button>
      <button class="btn small" data-act="new-devis" data-opp="${o.id}">+ Devis</button>
    </div></article>`;
}

function viewPipeline(v){
  const open = state.opportunites.filter(o=>o.issue==="en_cours");
  const closed = state.opportunites.filter(o=>o.issue!=="en_cours").slice(0,12);
  const noCompte = !state.comptes.length;
  v.innerHTML = `
  <div class="section-head"><div><h2>Pipeline commercial</h2><p class="hint">Qualification → Proposition → Négociation → Fermeture</p></div>
    <div class="tools"><button class="btn" data-act="new-compte">+ Compte</button><button class="btn primary" data-act="new-opp" ${noCompte?"disabled title='Ajoutez d’abord un compte'":""}>+ Opportunité</button></div></div>
  ${noCompte?`<div class="panel empty"><h3>Le CRM est vide pour l’instant</h3><p>Commencez par ajouter une clinique, un cabinet ou un salon, puis créez sa première opportunité.</p><div class="form-actions" style="justify-content:center"><button class="btn primary" data-act="new-compte">Ajouter un premier compte</button></div></div>`:""}
  <div class="board-scroll"><div class="board">${ETAPES.map(e=>{
    const items=open.filter(o=>o.etape===e); const sum=items.reduce((s,o)=>s+(+o.montant_mad||0),0);
    return `<section class="col" aria-label="${ETAPE_LABEL[e]}"><div class="col-head"><span class="name">${ETAPE_LABEL[e]}<span class="n">${items.length}</span></span><span class="sum">${madShort(sum)} MAD</span></div>
      ${items.length?items.map(oppCard).join(""):`<div class="empty-col">Aucune opportunité</div>`}</section>`;}).join("")}
  </div></div>
  ${closed.length?`<div class="panel" style="margin-top:16px"><h3>Dernières affaires clôturées</h3><div class="closed-list" style="margin-top:8px">${closed.map(o=>{const c=byId(state.comptes,o.compte_id);return `<div class="closed-row"><div><b>${esc(o.titre)}</b> <span class="hint">· ${esc(c?c.nom:"")}</span>${o.raison_perte?`<div class="hint">Raison : ${esc(o.raison_perte)}</div>`:""}</div><div class="tools"><span class="amt" style="font-family:var(--f-mono);font-size:12px">${mad(o.montant_mad)} MAD</span><span class="pill ${o.issue==="gagnee"?"ok":"bad"}">${o.issue==="gagnee"?"Gagnée":"Perdue"}</span><button class="btn small" data-act="reopen" data-id="${o.id}">Rouvrir</button></div></div>`;}).join("")}</div></div>`:""}`;
}

let shown=PAGE;
function viewComptes(v){
  const q=strip(filt.q);
  const list=state.comptes.filter(c=>(!filt.segment||c.segment===filt.segment)&&(!filt.ville||c.ville===filt.ville)&&(!filt.statut||c.statut===filt.statut)&&(!filt.com||(filt.com==="none"?!c.commercial_id:c.commercial_id===filt.com))
    &&(!q||strip([c.nom,c.specialite,c.telephone,c.ville,c.notes].filter(Boolean).join(" ")).includes(q)||(c.telephone||"").replace(/\D/g,"").includes(q.replace(/\D/g,"")||"§")));
  const page=list.slice(0,shown);
  const nf=new Intl.NumberFormat("fr-FR");
  v.innerHTML=`<div class="section-head"><div><h2>Comptes</h2><p class="hint">${SEG_HINT}</p></div>
    <div class="tools">${me&&["admin","superviseur"].includes(me.role)?`<button class="btn" data-act="import">Importer (Excel)</button>`:""}<button class="btn primary" data-act="new-compte">+ Compte</button></div></div>
  <div class="panel">
    <div class="filters" style="margin-bottom:12px">
      <input id="f-q" type="search" placeholder="Nom, spécialité, téléphone…" value="${esc(filt.q)}" aria-label="Rechercher un compte" autocomplete="off" spellcheck="false">

let lastFocus=null, dirty=false, importBusy=false;
function closeModal(force){
  if(importBusy) return;
  if(dirty && !force){ const c=$("#mconfirm"); if(c){ c.hidden=false; c.querySelector("button").focus(); return; } }
  $("#modal-slot").innerHTML=""; dirty=false;
  if(reopenAfter){ const r=reopenAfter; reopenAfter=null; return r(); }
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); lastFocus=null;
}
function trapFocus(root){
  root.addEventListener("keydown",e=>{
    if(e.key!=="Tab") return;
    const f=[...root.querySelectorAll('button:not([disabled]),[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
    if(!f.length) return; const a=f[0], b=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); b.focus(); }
    else if(!e.shiftKey && document.activeElement===b){ e.preventDefault(); a.focus(); }
  });
}
function modal(title,body,onSubmit,submitLabel){
  lastFocus=document.activeElement; dirty=false;
  $("#modal-slot").innerHTML=`<div class="overlay" id="ov"><form class="modal" id="mform" novalidate role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="modal-head"><h3 id="mtitle">${esc(title)}</h3><button type="button" class="x" id="mx" aria-label="Fermer">×</button></div>${body}<div id="merr" class="field-err" aria-live="polite" style="margin-top:10px"></div><div id="mconfirm" class="banner warn" hidden><div style="flex:1"><b>Abandonner la saisie ?</b><span>Les informations non enregistrées seront perdues.</span><div class="tools" style="margin-top:10px"><button type="button" class="btn small" id="mkeep">Continuer la saisie</button><button type="button" class="btn small bad" id="mdrop">Abandonner</button></div></div></div><div class="form-actions"><button type="button" class="btn" id="mcancel">Annuler</button><button type="submit" class="btn primary" id="msubmit">${esc(submitLabel||"Enregistrer")}</button></div></form></div>`;
  const form=$("#mform"); trapFocus(form);
  form.addEventListener("input",()=>{dirty=true;}); form.addEventListener("change",()=>{dirty=true;});
  $("#mx").onclick=()=>closeModal(); $("#mcancel").onclick=()=>closeModal();
  $("#mkeep").onclick=()=>{ $("#mconfirm").hidden=true; const f=form.querySelector("input,select,textarea"); if(f) f.focus(); };
  $("#mdrop").onclick=()=>closeModal(true);
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal();});
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    form.querySelectorAll("[aria-invalid]").forEach(el=>el.removeAttribute("aria-invalid")); $("#merr").textContent="";
    const fd=Object.fromEntries(new FormData(form));
    const err=onSubmit.validate&&onSubmit.validate(fd);
    if(err){ const [name,msg]=Array.isArray(err)?err:[null,err]; $("#merr").textContent=msg; const el=name&&form.elements[name]; if(el){ el.setAttribute("aria-invalid","true"); el.setAttribute("aria-describedby","merr"); el.focus(); } return; }
    const b=$("#msubmit"); b.disabled=true; b.setAttribute("aria-busy","true");
    const ok=await onSubmit(fd);
    if(!ok&&$("#msubmit")){ b.disabled=false; b.removeAttribute("aria-busy"); }
  });
  const first=form.querySelector("input,select"); if(first && window.matchMedia("(pointer:fine)").matches) first.focus(); else $("#mx").focus();
}

/* ---- Event delegation ---- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t||t.disabled) return;
  const id=t.dataset.id, act=t.dataset.act;
  if(act==="new-compte") return formCompte();
  if(act==="more"){ shown+=PAGE; return viewComptes($("#view")); }
  if(act==="import") return openImport();
  if(act==="new-devis") return formDevis(null,{opp:t.dataset.opp,compte:t.dataset.compte});
  if(act==="edit-devis") return formDevis(byId(state.devis,id));
  if(act==="print-devis"){ const d=byId(state.devis,id); if(d) imprimerDevis(d); return; }
  if(act==="dismiss-banner"){ devisBanner=null; return render(); }
  if(act==="edit-compte") return formCompte(byId(state.comptes,id));
  if(act==="open-compte") return openCompte(byId(state.comptes,id));
  if(act==="new-contact") return formContact(id);
  if(act==="new-opp") return formOpp(null,t.dataset.compte);
  if(act==="edit-opp") return formOpp(byId(state.opportunites,id));
  if(act==="log") return formActivite(t.dataset.opp,t.dataset.compte,{type:t.dataset.type});
  if(act==="edit-act") return formActivite(null,null,{},byId(state.activites,id));
  if(act==="act-done"){ t.disabled=true; return write(upd("activites",id,{statut:"fait",fait_le:new Date().toISOString()}),"Marqué fait"); }
  if(act==="del-act") return confirmInline(t,"Supprimer cette activité ? La suppression reste visible dans l’historique.","del-act-yes",id);
  if(act==="del-act-yes"){ t.disabled=true; return write(()=>sb.from("activites").delete().eq("id",id),"Activité supprimée"); }
  if(act==="del-cmt") return confirmInline(t,"Supprimer ce commentaire ?","del-cmt-yes",id);
  if(act==="del-cmt-yes"){ t.disabled=true; const box=t.closest("#op-commentaires"); const {error}=await sb.from("commentaires").delete().eq("id",id); if(error) toast(errorCopy(error).join(" — ")); else toast("Commentaire supprimé"); if(box&&box._reload) box._reload(); return; }
  if(act==="open-opp") return openOpp(byId(state.opportunites,id));
  if(act==="transfer") return formTransfert(byId(state.comptes,id));
  if(act==="new-membre") return formMembre();
  if(act==="edit-membre") return formMembre(byId(state.equipe,id));
  if(act==="new-produit") return formProduit();
  if(act==="edit-produit") return formProduit(byId(state.produits,id));
  if(act==="lost") return formPerte(byId(state.opportunites,id));
  if(act==="move"){ t.disabled=true; const to=t.dataset.to; const o=byId(state.opportunites,id); const p=Math.max(+o.probabilite||0,PROB_DEFAUT[to]);
    return write(upd("opportunites",id,{etape:sEnum(to,ETAPES),probabilite:ETAPES.indexOf(to)>ETAPES.indexOf(o.etape)?p:PROB_DEFAUT[to]}),"Passée en "+ETAPE_LABEL[to]); }
  if(act==="won"){ t.disabled=true; devisBanner=null; return write(upd("opportunites",id,{issue:"gagnee",probabilite:100}),"Affaire gagnée"); }
  if(act==="reopen"){ t.disabled=true; return write(upd("opportunites",id,{issue:"en_cours",raison_perte:null}),"Affaire rouverte"); }
});

/* ---- Activités : labels, priorité, créateur / responsable, à faire ---- */
const LABELS_DEFAUT = ["🔄 Relance devis","📤 Envoi devis","🆕 Nouvelle installation","📍 RDV / Re-visite","🤝 Premier contact","🎓 Formation","🛠️ SAV / Maintenance"];
const TYPES_A_FAIRE = ["tache","evenement","rdv"];
function labels(){ const s=new Set(LABELS_DEFAUT); state.activites.forEach(a=>{ if(a.label) s.add(a.label); }); return [...s]; }
function sources(){ const m=new Map(); state.comptes.forEach(c=>{ if(c.source) m.set(c.source,(m.get(c.source)||0)+1); }); return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]); }
const nomMembre = id => { const e=byId(state.equipe,id); return e?e.nom:"—"; };
const toLocalInput = d => { const x=new Date(d); const z=new Date(x.getTime()-x.getTimezoneOffset()*6e4); return z.toISOString().slice(0,16); };
let reopenAfter=null;

function comptePicker(id, cId){
  const c=byId(state.comptes,cId);
  return `<input id="${id}" name="compte_label" list="dl-comptes-all" autocomplete="off" placeholder="Tapez le nom du client…" value="${c?esc(compteLabel(c)):""}" required><datalist id="dl-comptes-all">${state.comptes.map(x=>`<option value="${esc(compteLabel(x))}">`).join("")}</datalist>`;
}
const compteIdFromLabel = v => { const c=state.comptes.find(x=>compteLabel(x)===v); return c?c.id:""; };

function formActivite(oppId, compteId, preset, a){
  preset=preset||{}; a=a||null;
  const o=oppId?byId(state.opportunites,oppId):(a?byId(state.opportunites,a.opportunite_id):null);
  const cId=(a&&a.compte_id)||compteId||(o&&o.compte_id)||"";
  const type=(a&&a.type)||preset.type||"appel";
  const aFaire = a ? a.statut==="a_faire" : TYPES_A_FAIRE.includes(type);
  const when = a ? toLocalInput(a.date_activite) : aFaire ? toLocalInput(new Date(Date.now()+864e5).setHours(10,0,0,0)) : toLocalInput(Date.now());
  const titre = a ? "Modifier l’activité" : ({tache:"Nouvelle tâche",evenement:"Nouvel événement",appel:"Nouvel appel",rdv:"Nouveau RDV"}[type]||"Nouvelle activité");
  const h=`<div class="form-grid">
   ${fld("m-type","Type",`<select id="m-type" name="type">${opt(Object.entries(TYPES_ACT),type)}</select>`)}
   ${fld("m-label","Label",`<input id="m-label" name="label" list="dl-labels" autocomplete="off" placeholder="Ex. 🔄 Relance devis…" value="${esc((a&&a.label)||preset.label||"")}"><datalist id="dl-labels">${labels().map(l=>`<option value="${esc(l)}">`).join("")}</datalist>`)}
   ${fld("m-when","Date et heure",`<input id="m-when" name="date_activite" type="datetime-local" value="${when}">`)}
   ${fld("m-statut","Statut",`<select id="m-statut" name="statut">${opt([["fait","Fait"],["a_faire","À faire"]],aFaire?"a_faire":"fait")}</select>`)}
   ${fld("m-compte","Client",comptePicker("m-compte",cId),true)}
   ${fld("m-opp","Opportunité",`<select id="m-opp" name="opportunite_id">${opt(state.opportunites.filter(x=>x.compte_id===cId&&(x.issue==="en_cours"||x.id===(o&&o.id))).map(x=>[x.id,x.titre]),(o&&o.id)||"","—")}</select>`)}
   ${fld("m-com","Responsable",`<select id="m-com" name="commercial_id">${opt(equipeOpts(),(a&&a.commercial_id)||(me&&me.id),"Non assigné")}</select>`)}
   <div class="field" style="justify-content:flex-end"><label class="check"><input type="checkbox" id="m-prio" name="prioritaire" ${(a&&a.prioritaire)||preset.prioritaire?"checked":""}> Prioritaire</label></div>
   ${fld("m-res","Compte rendu / description",`<textarea id="m-res" name="resume" placeholder="Ce qui s’est dit, objections, intérêt…">${esc((a&&a.resume)||"")}</textarea>`,true)}

function feedItem(a, opts){
  opts=opts||{};
  const c=byId(state.comptes,a.compte_id), o=byId(state.opportunites,a.opportunite_id);
  const today=localISO(), now=Date.now();
  const late=a.date_prochaine_action && a.date_prochaine_action<today;
  const aFaire=a.statut==="a_faire", overdue=aFaire && new Date(a.date_activite).getTime()<now;
  const diff=a.createur_id && a.commercial_id && a.createur_id!==a.commercial_id;
  return `<div class="feed-item${a.prioritaire?" prio":""}" data-aid="${a.id}"><div class="when">${fmtDate(a.date_activite)}<br>${new Date(a.date_activite).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</div>
   <div><div class="what"><span class="pill">${TYPES_ACT[a.type]||a.type}</span>${a.label?` <span class="pill lab">${esc(a.label)}</span>`:""}${a.prioritaire?` <span class="pill bad">Prioritaire</span>`:""}${aFaire?` <span class="pill ${overdue?"bad":"warn"}">${overdue?"En retard":"À faire"}</span>`:""}
     ${opts.noCompte?"":` <b>${esc(c?c.nom:"—")}</b>`}${o&&!opts.noOpp?` · <button class="linkish" data-act="open-opp" data-id="${o.id}">${esc(o.titre)}</button>`:""}</div>
   <div class="hint">${diff?`Créée par ${esc(nomMembre(a.createur_id))} · pour ${esc(nomMembre(a.commercial_id))}`:esc(nomMembre(a.commercial_id||a.createur_id))}</div>

/* ---- Canal d'acquisition ---- */
let acqPeriode="30j", acqDu="", acqAu="";
function periode(){
  const now=new Date(), d0=x=>{const z=new Date(x);z.setHours(0,0,0,0);return z;};
  switch(acqPeriode){
    case "7j": return [d0(Date.now()-6*864e5), null];
    case "30j": return [d0(Date.now()-29*864e5), null];
    case "mois": return [new Date(now.getFullYear(),now.getMonth(),1), null];
    case "mois-1": return [new Date(now.getFullYear(),now.getMonth()-1,1), new Date(now.getFullYear(),now.getMonth(),1)];
    case "trim": return [new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1), null];
    case "annee": return [new Date(now.getFullYear(),0,1), null];
    case "perso": return [acqDu?new Date(acqDu+"T00:00"):null, acqAu?new Date(new Date(acqAu+"T00:00").getTime()+864e5):null];
    default: return [null,null];
  }
}
function viewAcquisition(v){
  const [du,au]=periode(), inP=d=>{ const t=new Date(d).getTime(); return (!du||t>=du.getTime())&&(!au||t<au.getTime()); };
  const srcOf=new Map(state.comptes.map(c=>[c.id,c.source||"Sans source"]));
  const rows={}; const R=s=>rows[s]=rows[s]||{s,contacts:0,clients:0,opps:0,gagnees:0,ca:0,pipe:0};
  state.comptes.forEach(c=>{ if(inP(c.created_at)){ const r=R(c.source||"Sans source"); r.contacts++; if(c.statut==="client") r.clients++; } });
  state.opportunites.forEach(o=>{ const s=srcOf.get(o.compte_id)||"Sans source"; if(inP(o.created_at)){ R(s).opps++; if(o.issue==="en_cours") R(s).pipe+=(+o.montant_mad||0); }
    if(o.issue==="gagnee"&&inP(o.updated_at)){ R(s).gagnees++; R(s).ca+=(+o.montant_mad||0); } });
  const list=Object.values(rows).sort((a,b)=>b.contacts-a.contacts||b.ca-a.ca);
  const tot=list.reduce((t,r)=>({contacts:t.contacts+r.contacts,opps:t.opps+r.opps,gagnees:t.gagnees+r.gagnees,ca:t.ca+r.ca}),{contacts:0,opps:0,gagnees:0,ca:0});
  const max=Math.max(1,...list.map(r=>r.contacts)), nf=new Intl.NumberFormat("fr-FR");
  const imp=state.comptes.filter(c=>c.import_ref).length;
  const P={"7j":"7 derniers jours","30j":"30 derniers jours",mois:"Ce mois-ci","mois-1":"Mois dernier",trim:"Ce trimestre",annee:"Cette année",tout:"Depuis le début",perso:"Dates personnalisées"};
  v.innerHTML=`<div class="section-head"><div><h2>Canal d’acquisition</h2><p class="hint">Nouveaux contacts, opportunités et chiffre d’affaires par source (salon, événement, canal)</p></div></div>
  <div class="filters" style="margin-bottom:12px"><select id="f-per" aria-label="Période">${Object.entries(P).map(([k,l])=>`<option value="${k}" ${acqPeriode===k?"selected":""}>${l}</option>`).join("")}</select>
   ${acqPeriode==="perso"?`<input id="f-du" type="date" aria-label="Du" value="${acqDu}"><input id="f-au" type="date" aria-label="Au" value="${acqAu}">`:""}</div>
  <div class="kpis" style="padding-top:0">
    <div class="kpi"><div class="lab">Nouveaux contacts</div><div class="val">${nf.format(tot.contacts)}</div><div class="sub">${(n=>n+" source"+(n>1?"s":"")+" active"+(n>1?"s":""))(list.filter(r=>r.contacts).length)}</div></div>
    <div class="kpi"><div class="lab">Opportunités créées</div><div class="val">${nf.format(tot.opps)}</div><div class="sub">${tot.contacts?Math.round(tot.opps*1000/tot.contacts)/10:0} % des nouveaux contacts</div></div>
    <div class="kpi"><div class="lab">Affaires gagnées</div><div class="val">${nf.format(tot.gagnees)}</div><div class="sub">sur la période</div></div>
    <div class="kpi"><div class="lab">CA gagné</div><div class="val">${madShort(tot.ca)}<small>MAD</small></div><div class="sub">HT, affaires gagnées sur la période</div></div>
  </div>
  <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Source</th><th style="min-width:120px"><span class="sr-only">Volume</span></th><th class="num">Contacts</th><th class="num">Dont clients</th><th class="num">Opportunités</th><th class="num">Conversion</th><th class="num">Gagnées</th><th class="num">CA gagné MAD</th><th class="num">Pipeline MAD</th></tr></thead><tbody>
  ${list.length?list.map(r=>`<tr><td><b>${esc(r.s)}</b></td><td><div class="prob" style="height:6px"><i style="width:${Math.round(r.contacts*100/max)}%"></i></div></td><td class="num">${nf.format(r.contacts)}</td><td class="num">${r.clients||"·"}</td><td class="num">${r.opps||"·"}</td><td class="num">${r.contacts?(Math.round(r.opps*1000/r.contacts)/10).toLocaleString("fr-FR")+" %":"·"}</td><td class="num">${r.gagnees||"·"}</td><td class="num">${r.ca?mad(r.ca):"·"}</td><td class="num">${r.pipe?mad(r.pipe):"·"}</td></tr>`).join(""):`<tr><td colspan="9"><p class="hint">Aucun contact créé sur cette période.</p></td></tr>`}
  </tbody></table></div>
  <p class="hint" style="margin-top:12px">Pour mesurer le ROI d’un salon : choisissez la période de l’événement, puis comparez le CA gagné de sa source à son coût. ${imp?`Les ${nf.format(imp)} contacts importés de l’ancien CRM portent la date de l’import (16 oct. 2026), pas leur date de création d’origine.`:""}</p></div>`;
  $("#f-per").addEventListener("change",e=>{acqPeriode=e.target.value;viewAcquisition(v);});
  if($("#f-du")){ $("#f-du").addEventListener("change",e=>{acqDu=e.target.value;viewAcquisition(v);}); $("#f-au").addEventListener("change",e=>{acqAu=e.target.value;viewAcquisition(v);}); }
}

async function loadHistorique(el, col, id, limit){
  el.innerHTML=`<div class="skeleton" style="height:40px"></div>`;
  let q=sb.from("historique").select("*").order("created_at",{ascending:false}).limit(limit||200);

async function loadCommentaires(el, oppId){
  const {data,error}=await sb.from("commentaires").select("*").eq("opportunite_id",oppId).order("created_at",{ascending:true});
  if(error){ el.innerHTML=`<p class="hint">Commentaires indisponibles : ${esc(errorCopy(error)[1])}</p>`; return; }

  const item=(c,reply)=>`<div class="cmt${reply?" reply":""}" data-cid="${c.id}"><div class="cmt-head"><b>${esc(nomMembre(c.auteur_id))}</b> <span class="hint">${new Date(c.created_at).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>
     <div style="white-space:pre-line">${esc(c.texte)}</div>
     <div class="tools acts-inline">${reply?"":`<button class="btn small" data-reply="${c.id}">Répondre</button>`}${canDel(c)?`<button class="btn small" data-act="del-cmt" data-id="${c.id}">Supprimer</button>`:""}</div>
     ${reply?"":`<div class="replies">${kids(c.id).map(k=>item(k,true)).join("")}</div><form class="reply-form" data-parent="${c.id}" hidden><textarea aria-label="Votre réponse" placeholder="Votre réponse…" required></textarea><div class="tools" style="margin-top:6px"><button class="btn small primary" type="submit">Répondre</button></div></form>`}</div>`;
  el.innerHTML=`<form id="cmt-form"><label for="cmt-new" class="sr-only">Nouveau commentaire</label><textarea id="cmt-new" placeholder="Écrire un commentaire pour l’équipe…" required></textarea><div class="tools" style="margin-top:6px;justify-content:flex-end"><button class="btn small primary" type="submit">Publier</button></div></form>
    <div class="cmts">${top.length?top.slice().reverse().map(c=>item(c,false)).join(""):`<p class="hint">Aucun commentaire. Lancez la discussion avec l’équipe.</p>`}</div>`;
  const post=async(texte,parent)=>{ texte=texte.trim(); if(!texte) return; const {error}=await sb.from("commentaires").insert({opportunite_id:oppId,parent_id:parent||null,texte}); if(error){ toast(errorCopy(error).join(" — ")); return; } loadCommentaires(el,oppId); };
  el.querySelector("#cmt-form").addEventListener("submit",e=>{ e.preventDefault(); const b=e.target.querySelector("button"); b.disabled=true; post(e.target.querySelector("textarea").value); });
  el.querySelectorAll("[data-reply]").forEach(b=>b.addEventListener("click",()=>{ const f=el.querySelector(`.reply-form[data-parent="${b.dataset.reply}"]`); f.hidden=!f.hidden; if(!f.hidden) f.querySelector("textarea").focus(); }));
  el.querySelectorAll(".reply-form").forEach(f=>f.addEventListener("submit",e=>{ e.preventDefault(); f.querySelector("button").disabled=true; post(f.querySelector("textarea").value,f.dataset.parent); }));
  el._reload=()=>loadCommentaires(el,oppId);
}

const SOCIETE = { nom:"CELLULIFT", activite:"Distribution d’équipements de médecine esthétique", adresse:"", telephone:"", email:"", site:"cellulift.ma", ice:"", rc:"", if_:"", patente:"", cnss:"", rib:"", banque:"" };

const r2 = n => Math.round((+n||0)*100)/100;
const mad2 = n => new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(r2(n));

function devisTotaux(lignes, remisePct, tvaPct){
  const brut = lignes.reduce((s,l)=>s+(+l.quantite||0)*(+l.prix_unitaire_mad||0),0);
  const sousTotal = lignes.reduce((s,l)=>s+(+l.quantite||0)*(+l.prix_unitaire_mad||0)*(1-(+l.remise_pct||0)/100),0);
  const remiseLignes = brut - sousTotal;
  const remiseGlobale = sousTotal*(+remisePct||0)/100;
  const ht = sousTotal - remiseGlobale;
  const tva = ht*(+tvaPct||0)/100;
  return { brut:r2(brut), remiseLignes:r2(remiseLignes), sousTotal:r2(sousTotal), remiseGlobale:r2(remiseGlobale), ht:r2(ht), tva:r2(tva), ttc:r2(ht+tva) };
}

// Montant en lettres (dirhams et centimes), règles françaises traditionnelles.
function enLettres(n){
  const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
  const D={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
  const moinsCent=n=>{
    if(n<17) return U[n];
    if(n<20) return "dix-"+U[n-10];
    const d=Math.floor(n/10), u=n%10;
    if(d<7) return D[d]+(u===0?"":u===1?" et un":"-"+U[u]);
    if(d===7) return "soixante"+(u===1?" et onze":"-"+moinsCent(10+u));
    if(d===8) return u===0?"quatre-vingts":"quatre-vingt-"+U[u];
    return "quatre-vingt-"+moinsCent(10+u);
  };
  const moinsMille=n=>{
    const c=Math.floor(n/100), r=n%100;
    if(!c) return moinsCent(r);
    const cent = c===1?"cent":U[c]+" cent"+(r===0?"s":"");
    return r?cent+" "+moinsCent(r):cent;
  };
  const entier=n=>{
    if(n===0) return "zéro";
    const parts=[]; const mds=Math.floor(n/1e9), mns=Math.floor(n%1e9/1e6), mil=Math.floor(n%1e6/1e3), rest=n%1e3;
    if(mds) parts.push(moinsMille(mds)+" milliard"+(mds>1?"s":""));
    if(mns) parts.push(moinsMille(mns)+" million"+(mns>1?"s":""));
    if(mil) parts.push(mil===1?"mille":moinsMille(mil).replace(/(cent|vingt)s$/,"$1")+" mille");
    if(rest) parts.push(moinsMille(rest));
    return parts.join(" ");
  };
  const total=Math.round((+n||0)*100), dh=Math.floor(total/100), cts=total%100;
  const e=entier(dh);
  let s=e+(/(million|milliard)s?$/.test(e)?" de":"")+" dirham"+(dh>1?"s":"");
  if(cts) s+=" et "+entier(cts)+" centime"+(cts>1?"s":"");
  return s.charAt(0).toUpperCase()+s.slice(1);
}

  const emis=new Date(d.created_at||Date.now()), valid=new Date(emis.getTime()+(+d.validite_jours||30)*864e5);
  const fd=x=>x.toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
  const anyRem=lignes.some(l=>+l.remise_pct>0);
  const legal=[SOCIETE.ice&&"ICE "+SOCIETE.ice, SOCIETE.rc&&"RC "+SOCIETE.rc, SOCIETE.if_&&"IF "+SOCIETE.if_, SOCIETE.patente&&"Patente "+SOCIETE.patente, SOCIETE.cnss&&"CNSS "+SOCIETE.cnss].filter(Boolean).join(" · ");
  const coord=[SOCIETE.adresse, SOCIETE.telephone, SOCIETE.email, SOCIETE.site].filter(Boolean).join(" · ");
  const html=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(devisNum(d))} — ${esc(c.nom||"Devis")}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=Cormorant+Garamond:wght@400&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
@page{size:A4;margin:16mm 14mm}
*{box-sizing:border-box}html{color-scheme:light}
body{margin:0;color:#1D1B26;background:#fff;font:10.5pt/1.5 "Instrument Sans",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{max-width:182mm;margin:0 auto;padding:24px 16px}
@media print{.page{padding:0}.noprint{display:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.mark{font-family:"Cormorant Garamond","Times New Roman",serif;font-size:24pt;letter-spacing:.22em;line-height:1;background:linear-gradient(90deg,#00BCD4,#7B61FF,#E91E8C,#FF5722,#FFC107);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font:7pt "JetBrains Mono",monospace;letter-spacing:.28em;color:#5D5B6B;text-transform:uppercase;margin-top:4px}
.doc{text-align:right}
.doc h1{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:118%;font-weight:500;text-transform:uppercase;letter-spacing:-.03em;font-size:26pt;line-height:.9;margin:0}
.lab{font:7.5pt "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#5D5B6B}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.sig{height:1px;background:linear-gradient(90deg,#00BCD4,#7B61FF,#E91E8C,#FF5722,#FFC107);margin:16px 0 18px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.box{border:1px solid rgba(29,27,38,.12);border-radius:14px;padding:12px 14px}
.box b{font-size:11.5pt}
table{width:100%;border-collapse:collapse}
th{font:7.5pt "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#5D5B6B;text-align:left;font-weight:400;padding:8px 6px;border-bottom:1px solid rgba(29,27,38,.25)}
td{padding:9px 6px;border-bottom:1px solid rgba(29,27,38,.08);vertical-align:top}
.num{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tr{break-inside:avoid}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 24px;margin:14px 0 0 auto;max-width:300px}
.sum dt{color:#5D5B6B}.sum dd{margin:0;text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.sum .ttc{font-weight:600;color:#1D1B26;font-size:12pt;padding-top:6px;border-top:1px solid rgba(29,27,38,.25)}
.lettres{margin-top:16px;padding:10px 14px;border-radius:12px;background:#ECEEF3}
.cond{margin-top:16px;white-space:pre-line}

.noprint{display:flex;gap:8px;justify-content:flex-end;margin-bottom:16px}
.noprint button{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid rgba(29,27,38,.2);background:#1D1B26;color:#fff;cursor:pointer}
</style></head><body><div class="page">
<div class="noprint"><button onclick="window.print()">Imprimer / Enregistrer en PDF</button></div>
<div class="top"><div><div class="mark" translate="no">CELLULIFT</div>
<svg width="160" height="18" viewBox="0 0 160 20" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00BCD4"/><stop offset=".25" stop-color="#7B61FF"/><stop offset=".5" stop-color="#E91E8C"/><stop offset=".75" stop-color="#FF5722"/><stop offset="1" stop-color="#FFC107"/></linearGradient></defs><path d="M0 10 H50 L58 10 L64 2 L72 18 L80 6 L86 10 H100 L106 10 L112 4 L118 16 L124 10 H160" fill="none" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="tag">Metamorphosis Technology</div></div>
<div class="doc"><h1>Devis</h1><div class="mono" style="margin-top:8px">${esc(devisNum(d))}</div><div style="margin-top:4px">Émis le ${fd(emis)}</div><div>Valable jusqu’au ${fd(valid)}</div></div></div>
<div class="sig"></div>
<div class="parties"><div class="box"><div class="lab">Émetteur</div><b translate="no">${esc(SOCIETE.nom)}</b><div>${esc(SOCIETE.activite)}</div>${coord?`<div>${esc(coord)}</div>`:""}${com?`<div style="margin-top:6px">Votre interlocuteur : ${esc(com.nom)}${com.email?" · "+esc(com.email):""}</div>`:""}</div>
<div class="box"><div class="lab">Client</div><b>${esc(c.nom||"")}</b>${c.specialite?`<div>${esc(c.specialite)}</div>`:""}${contact&&[contact.prenom,contact.nom].join(" ").trim()!==c.nom?`<div>À l’attention de ${esc([contact.prenom,contact.nom].filter(Boolean).join(" "))}</div>`:""}<div>${esc([c.adresse,c.ville].filter(Boolean).join(", "))}</div><div>${esc([c.telephone,c.email].filter(Boolean).join(" · "))}</div></div></div>
<table><thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">PU HT</th>${anyRem?`<th class="num">Remise</th>`:""}<th class="num">Total HT</th></tr></thead><tbody>
${lignes.map(l=>`<tr><td>${esc(l.designation)}</td><td class="num">${+l.quantite}</td><td class="num">${mad2(l.prix_unitaire_mad)}</td>${anyRem?`<td class="num">${+l.remise_pct?(+l.remise_pct)+" %":"—"}</td>`:""}<td class="num">${mad2((+l.quantite)*(+l.prix_unitaire_mad)*(1-(+l.remise_pct)/100))}</td></tr>`).join("")}
</tbody></table>
<dl class="sum">${t.remiseLignes?`<dt>Total brut HT</dt><dd>${mad2(t.brut)}</dd><dt>Remises</dt><dd>− ${mad2(t.remiseLignes)}</dd>`:""}<dt>Sous-total HT</dt><dd>${mad2(t.sousTotal)}</dd>${t.remiseGlobale?`<dt>Remise ${+d.remise_pct} %</dt><dd>− ${mad2(t.remiseGlobale)}</dd>`:""}<dt>Total HT</dt><dd>${mad2(t.ht)}</dd><dt>TVA ${+d.tva_pct} %</dt><dd>${mad2(t.tva)}</dd><dt class="ttc">Total TTC</dt><dd class="ttc">${mad2(t.ttc)} MAD</dd></dl>
<div class="lettres">Arrêté le présent devis à la somme de <b>${esc(enLettres(t.ttc))}</b> toutes taxes comprises.</div>
${d.conditions?`<div class="cond"><div class="lab">Conditions</div>${esc(d.conditions)}</div>`:""}
<div class="foot"><div></div><div><div class="lab">Bon pour accord — date, cachet et signature du client</div><div class="signbox"></div></div></div>
${legal||SOCIETE.rib?`<div class="legal">${esc(SOCIETE.nom)}${legal?" · "+esc(legal):""}${SOCIETE.rib?`<br>RIB ${esc(SOCIETE.rib)}${SOCIETE.banque?" · "+esc(SOCIETE.banque):""}`:""}</div>`:""}
</div><script>(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>window.print(),300));<\/script></body></html>`;
  w.document.open(); w.document.write(html); w.document.close();
}

/* ---- Import Excel (ancien CRM) ---- */
function loadScript(src){ return new Promise((ok,ko)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const el=document.createElement("script"); el.src=src; el.onload=ok; el.onerror=()=>ko(new Error("Impossible de charger "+src+". Vérifiez la connexion puis réessayez.")); document.head.appendChild(el); }); }
function openImport(){
  lastFocus=document.activeElement; dirty=false;
  $("#modal-slot").innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="itl" style="max-width:680px">
    <div class="modal-head"><h3 id="itl">Importer des contacts</h3><button type="button" class="x" id="mx" aria-label="Fermer">×</button></div>
    <p style="margin-top:0">Choisissez un ou plusieurs exports « contacts » de l’ancien CRM (.xlsx ou .csv). Rien n’est enregistré avant votre confirmation, et vous pouvez relancer l’import sans créer de doublons.</p>
    <div class="field"><label for="imp-files">Fichiers</label><input id="imp-files" type="file" accept=".xlsx,.xls,.csv" multiple></div>
    <div id="imp-out" aria-live="polite" style="margin-top:14px"></div>
    <div class="form-actions"><button type="button" class="btn" id="imp-cancel">Fermer</button><button type="button" class="btn primary" id="imp-go" disabled>Importer</button></div>
  </div></div>`;
  const out=$("#imp-out"), go=$("#imp-go"); let plan=null, busy=false;
  const close=()=>closeModal(true);
  $("#mx").onclick=close; $("#imp-cancel").onclick=close; $("#ov").addEventListener("click",e=>{ if(e.target.id==="ov") close(); }); trapFocus($("#ov .modal")); $("#imp-files").focus();
  const nf=new Intl.NumberFormat("fr-FR");
  $("#imp-files").addEventListener("change",async e=>{
    const files=[...e.target.files]; plan=null; go.disabled=true; if(!files.length){ out.innerHTML=""; return; }
    out.innerHTML=`<p class="hint">Lecture de ${files.length} fichier${files.length>1?"s":""}…</p>`;
    try{
      await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"); await loadScript("/crm/import.js");
      const rows=await CRMImport.readFiles(files,window.XLSX);
      if(!rows.length || !("Nom" in rows[0]) || !("Telephone" in rows[0] || "Téléphone" in rows[0])) throw new Error("Colonnes attendues introuvables (Nom, Prenom, Telephone…). Utilisez l’export « contacts » de l’ancien CRM.");
      plan=CRMImport.mapRows(rows); const st=plan.stats;
      const known=new Set(state.equipe.map(t=>(t.email||"").toLowerCase())); const newMembers=plan.creators.filter(c=>!known.has(c.email));
      const topV=Object.entries(st.byVille).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`${esc(k)} ${nf.format(v)}`).join(" · ");
      out.innerHTML=`<div class="panel" style="padding:16px">
        <p style="margin:0 0 8px"><b>${nf.format(st.unique)} comptes</b> à importer (${nf.format(st.contacts)} contacts), à partir de ${nf.format(st.read)} lignes. ${st.duplicates?`${nf.format(st.duplicates)} doublons fusionnés (même numéro de téléphone).`:""}</p>
        <div class="tools" style="margin-bottom:8px">${Object.entries(SEGMENTS).map(([k,l])=>`<span class="pill ${k[0]}">${l} · ${nf.format(st.bySegment[k]||0)}</span>`).join("")}</div>
        <p class="hint" style="margin:0 0 4px">${nf.format(st.byStatut.client||0)} clients · ${nf.format(st.byStatut.prospect||0)} prospects${st.byStatut.personnel?` · ${st.byStatut.personnel} personnel`:""}</p>
        <p class="hint" style="margin:0 0 4px">${topV}</p>
        <p class="hint" style="margin:0">${newMembers.length?`${newMembers.length} commerciaux de l’ancien CRM seront ajoutés à l’équipe <b>sans accès</b> et rattachés à leurs contacts.`:"Tous les commerciaux de l’export sont déjà dans l’équipe."}</p>
      </div>`;
      go.textContent=`Importer ${nf.format(st.unique)} comptes`; go.disabled=false; go.focus();
    }catch(err){ out.innerHTML=`<div class="banner bad"><div><b>Lecture impossible</b><span>${esc(err.message||String(err))}</span></div></div>`; }
  });
  go.addEventListener("click",async()=>{
    if(!plan||busy) return; busy=true; importBusy=true; go.disabled=true; go.setAttribute("aria-busy","true"); $("#imp-files").disabled=true;
    const bar=document.createElement("div"); bar.innerHTML=`<div class="prob" style="height:6px;margin-top:12px"><i id="imp-bar" style="width:0%"></i></div><p class="hint" id="imp-msg">Import en cours… Gardez cette fenêtre ouverte.</p>`; out.appendChild(bar);
    try{
      const res=await CRMImport.run(sb,plan,(d,t)=>{ $("#imp-bar").style.width=Math.round(d*100/t)+"%"; $("#imp-msg").textContent=`Import en cours… ${nf.format(d)} / ${nf.format(t)}`; });
      busy=false; importBusy=false; $("#imp-msg").textContent=`Terminé : ${nf.format(res.created)} comptes créés${res.already?`, ${nf.format(res.already)} déjà présents`:""}${res.newMembers?`, ${res.newMembers} commerciaux ajoutés`:""}.`;
      go.removeAttribute("aria-busy"); go.textContent="Importé"; toast("Import terminé"); await load();
    }catch(err){
      busy=false; importBusy=false; go.removeAttribute("aria-busy"); go.disabled=false; go.textContent="Reprendre l’import";
      const [t,d]=errorCopy(err); $("#imp-msg").textContent=`${t} — ${d} Ce qui est déjà importé est conservé ; « Reprendre l’import » complète sans doublons.`;
    }
  });
}

/* ---- Auth ---- */
function showLogin(msg){
  document.body.classList.add("auth");
  $("#auth-slot").innerHTML=`<div class="login"><form class="modal" id="login-form" novalidate style="max-width:420px" aria-labelledby="login-title">
    <div style="text-align:center;margin-bottom:18px"><h2 class="wordmark" id="login-title" translate="no" style="font-family:var(--f-mark);font-size:28px;font-weight:400;font-stretch:normal;letter-spacing:.22em;text-transform:none;line-height:1">CELLULIFT</h2><div class="tagline" style="margin-top:6px">CRM commercial · Accès équipe</div></div>
    <div class="form-grid" style="grid-template-columns:1fr">
      ${fld("l-mail","Email professionnel",`<input id="l-mail" name="email" type="email" autocomplete="username" spellcheck="false" required placeholder="prenom@cellulift.ma…">`)}
      ${fld("l-pw","Mot de passe",`<input id="l-pw" name="password" type="password" autocomplete="current-password" required minlength="8">`)}
    </div>
    <div id="l-err" class="hint" aria-live="polite" style="color:var(--bad);margin-top:10px">${esc(msg||"")}</div>
    <div class="form-actions" style="justify-content:space-between"><button type="button" class="btn" id="l-signup">Première connexion</button><button type="submit" class="btn primary" id="l-go">Se connecter</button></div>
    <p class="hint" style="margin-top:14px">Première connexion : saisissez l’email que votre superviseur a enregistré et choisissez un mot de passe (8 caractères minimum), puis cliquez sur « Première connexion ».</p>
  </form></div>`;
  const go=async(signup)=>{
    const email=$("#l-mail").value.trim().toLowerCase(), password=$("#l-pw").value;
    if(!email||password.length<8){ $("#l-err").textContent="Email et mot de passe de 8 caractères minimum requis."; return; }
    $("#l-go").disabled=$("#l-signup").disabled=true; $("#l-err").textContent="";
    let r = signup ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
    if(signup && !r.error && !r.data.session) r = await sb.auth.signInWithPassword({email,password});
    $("#l-go").disabled=$("#l-signup").disabled=false;
    if(r.error){
      const m=r.error.message||"";
      $("#l-err").textContent = /Invalid login/i.test(m)?"Email ou mot de passe incorrect. Première connexion ? Utilisez le bouton de gauche."
        : /already registered/i.test(m)?"Ce compte existe déjà : utilisez « Se connecter »."
        : /not confirmed/i.test(m)?"Cet email n’est pas enregistré dans l’équipe. Demandez à votre superviseur de vous ajouter."
        : m;
    }
  };
  $("#login-form").addEventListener("submit",e=>{e.preventDefault();go(false);});
  $("#l-signup").addEventListener("click",()=>go(true));
  $("#l-mail").focus();
}
function showNoAccess(){
  setStatus("bad","Accès refusé");
  $("#view").innerHTML=`<div class="panel empty"><h3>Compte non autorisé</h3><p>${esc(currentUser.email)} n’est pas enregistré dans l’équipe Cellulift, ou le compte est désactivé. Demandez à votre superviseur de vous ajouter.</p></div>`;
  $("#kpis").innerHTML="";
}
function enterApp(session){
  currentUser=session.user;
  document.body.classList.remove("auth"); $("#auth-slot").innerHTML="";
  $("#who").textContent=currentUser.email;
  render(); load();
}
$("#logout").addEventListener("click",async()=>{ await sb.auth.signOut(); });
let booted=false;
sb.auth.onAuthStateChange((event,session)=>{
  if(session && (!booted || event==="SIGNED_IN") && (!currentUser || currentUser.id!==session.user.id)){ booted=true; enterApp(session); }
  else if(!session){ booted=true; currentUser=null; me=null; loaded=false; showLogin(); }
});
})();
</script>

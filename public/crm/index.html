<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CRM Cellulift</title>
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://igfgqfwkhyonptbtrywl.supabase.co">
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=Cormorant+Garamond:wght@400&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky glass header, KPI band, tabbed workspace (pipeline board / accounts / activity / team) */
/* Direction « Nacre & verre » (cellulift.ma) : fond nacré, panneaux de verre, signal arc-en-ciel. Archivo élargi / Instrument Sans / JetBrains Mono. */
:root{
  --bg:#ECEEF3; --bg-glow1:rgba(0,188,212,.08); --bg-glow2:rgba(123,97,255,.10); --bg-glow3:rgba(233,30,140,.07);
  --glass:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.46)); --glass-edge:rgba(255,255,255,.9);
  --glass-strong:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,255,255,.70)); --field:#F7F7FA;
  --line:rgba(29,27,38,.08); --line-strong:rgba(29,27,38,.15);
  --ink:#1D1B26; --ink-2:#5D5B6B; --muted:#6E6C7C; --accent:#7B61FF; --on-ink:#FFFFFF;
  --ok:#11845B; --ok-bg:rgba(17,132,91,.10); --warn:#9A5B00; --warn-bg:rgba(178,106,0,.10); --bad:#C2264B; --bad-bg:rgba(194,38,75,.10);
  --seg-a:#007F8F; --seg-c:#B0185E;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 60px -30px rgba(29,27,38,.25);
  --shadow-sm:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -16px rgba(29,27,38,.30);
  --rainbow:linear-gradient(90deg,#00BCD4,#7B61FF,#E91E8C,#FF5722,#FFC107);
  --f-display:"Archivo","Arial Narrow",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-mark:"Cormorant Garamond","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --bg-glow1:rgba(0,188,212,.10); --bg-glow2:rgba(123,97,255,.14); --bg-glow3:rgba(233,30,140,.08);
  --glass:linear-gradient(145deg,rgba(36,40,48,.78),rgba(23,26,31,.60)); --glass-edge:rgba(255,255,255,.08);
  --glass-strong:linear-gradient(145deg,rgba(44,48,58,.95),rgba(30,33,40,.88)); --field:#1B1E24;
  --line:rgba(236,235,231,.09); --line-strong:rgba(236,235,231,.18);
  --ink:#ECEBE7; --ink-2:#B4B6BC; --muted:#9B9EA4; --accent:#A797FF; --on-ink:#0F1114;
  --ok:#3FCB8E; --ok-bg:rgba(63,203,142,.12); --warn:#F0A63A; --warn-bg:rgba(240,166,58,.12); --bad:#FF6B8B; --bad-bg:rgba(255,107,139,.12);
  --seg-a:#5FD6E6; --seg-c:#F27BB8;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 60px -30px rgba(0,0,0,.6);
  --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset,0 10px 24px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1114; --bg-glow1:rgba(0,188,212,.10); --bg-glow2:rgba(123,97,255,.14); --bg-glow3:rgba(233,30,140,.08);
  --glass:linear-gradient(145deg,rgba(36,40,48,.78),rgba(23,26,31,.60)); --glass-edge:rgba(255,255,255,.08);
  --glass-strong:linear-gradient(145deg,rgba(44,48,58,.95),rgba(30,33,40,.88)); --field:#1B1E24;
  --line:rgba(236,235,231,.09); --line-strong:rgba(236,235,231,.18);
  --ink:#ECEBE7; --ink-2:#B4B6BC; --muted:#9B9EA4; --accent:#A797FF; --on-ink:#0F1114;
  --ok:#3FCB8E; --ok-bg:rgba(63,203,142,.12); --warn:#F0A63A; --warn-bg:rgba(240,166,58,.12); --bad:#FF6B8B; --bad-bg:rgba(255,107,139,.12);
  --seg-a:#5FD6E6; --seg-c:#F27BB8;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 60px -30px rgba(0,0,0,.6);
  --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset,0 10px 24px -16px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,tr.click{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:999px;text-decoration:none}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
@media (pointer:fine){html{overscroll-behavior:none}}
body{margin:0}
[hidden]{display:none!important}
body.auth header.top .tabs,body.auth header.top .status,body.auth .wrap>*{display:none}
.who{font-family:var(--f-mono);font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(60vw 40vw at 0% 0%,var(--bg-glow1),transparent 60%),radial-gradient(50vw 40vw at 100% 10%,var(--bg-glow2),transparent 60%),radial-gradient(60vw 40vw at 50% 100%,var(--bg-glow3),transparent 60%);background-attachment:fixed}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid var(--line)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rainbow);opacity:.6}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.wordmark{font-family:var(--f-mark);font-weight:400;margin:0;font-size:22px;letter-spacing:.22em;line-height:1;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.ecg{display:block;width:150px;height:14px}
.ecg path{fill:none;stroke:url(#rb);stroke-width:1.2;stroke-dasharray:320;stroke-dashoffset:320;animation:ecg 1.8s ease forwards .2s}
@keyframes ecg{to{stroke-dashoffset:0}}
.tagline{font-family:var(--f-mono);font-size:8px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.status{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{text-decoration:none;border:0;background:none;padding:9px 13px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s}
.tab[aria-current="page"]{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--glass-edge)}
.tab:hover:not([aria-current="page"]){background:var(--line);color:var(--ink)}

/* Buttons */
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--glass-strong);box-shadow:var(--shadow-sm);padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm),0 0 0 1px var(--line-strong)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.small{padding:5px 12px;font-size:12px;min-height:30px}
@media (pointer:coarse){.btn.small{min-height:40px;padding:8px 14px}.btn{min-height:44px}}
.btn.icon{width:38px;padding:0;font-size:16px}
.login{display:flex;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.login .modal{margin-top:12vh}
@media (max-width:1439px){.who{display:none}}
@media (max-width:639px){.status{width:100%;justify-content:flex-start}}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn[aria-busy="true"]::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-block:20px 8px}
.kpi{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:22px;padding:14px 16px;min-width:0}
.kpi .lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-stretch:118%;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:.06em}
.kpi .sub{font-size:12px;color:var(--muted)}

.sep{height:1px;background:var(--rainbow);opacity:.55;margin-block:14px}

main{padding-block:8px 48px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:12px 16px}
h2{font-family:var(--f-display);font-stretch:118%;font-weight:500;font-size:28px;letter-spacing:-.035em;text-transform:uppercase;margin:0;line-height:.95;text-wrap:balance;scroll-margin-top:120px}
@media (max-width:639px){h2{font-size:22px;font-stretch:108%}}
h3{font-family:var(--f-body);font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Pipeline board */
.board-scroll{overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;padding-inline:4px;min-width:max-content}
@media (min-width:1100px){.board{min-width:0}}
.col{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px;min-width:0}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.col-head .name{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.col-head .sum{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head .n{display:inline-block;min-width:20px;text-align:center;border-radius:999px;background:var(--line);padding:0 6px;margin-left:6px;color:var(--ink-2)}
.card{background:var(--glass-strong);border:1px solid var(--glass-edge);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.card .c{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .amt{font-family:var(--f-mono);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.prob{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.prob i{display:block;height:100%;background:var(--rainbow)}
.empty-col{color:var(--muted);font-size:13px;padding:12px 4px;text-align:center;border:1px dashed var(--line-strong);border-radius:10px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.pill.A{color:var(--seg-a);border-color:rgba(0,188,212,.4)} .pill.B{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)} .pill.C{color:var(--seg-c);border-color:rgba(233,30,140,.4)}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}

/* Panels & tables */
.panel{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:28px;padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
tr.click{cursor:pointer} tr.click:hover td,tr.click:focus-visible td{background:var(--line)}
tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.filters{display:flex;gap:8px;flex-wrap:wrap}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{background:var(--field);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;padding:9px 12px;width:100%;min-width:0;font-size:14px}
@media (pointer:coarse),(max-width:639px){input,select,textarea{font-size:16px}}
input:hover,select:hover,textarea:hover{border-color:var(--ink-2)}
.field-err{color:var(--bad);font-size:12px}
textarea{min-height:72px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.filters select,.filters input{width:auto;min-width:130px}

/* Activity feed */
.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-item .when{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.feed-item .what{font-size:13px;overflow-wrap:anywhere}
.feed-item .next{font-size:12px;color:var(--ink-2);margin-top:4px}

/* Overlay modal */
.overlay{position:fixed;inset:0;z-index:50;overscroll-behavior:contain;background:rgba(10,12,18,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--glass-strong);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-edge);border-radius:28px;padding:22px;width:100%;max-width:640px;box-shadow:var(--shadow);margin-top:4vh;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.x{border:0;background:var(--line);color:var(--ink);width:36px;height:36px;flex:none;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}

/* Banners & toasts */
.banner{border-radius:20px;padding:14px 16px;margin-top:16px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-strong);background:var(--glass-strong)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.banner b{display:block;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.skeleton{background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:10px;height:64px}
@keyframes sk{to{background-position:-200% 0}}
.closed-list{display:flex;flex-direction:column;gap:8px}
.closed-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.closed-row:last-child{border-bottom:0}
.fam{border-top:1px solid var(--line);padding-block:4px}
.modal.devis-modal{max-width:980px}
.linkish{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.card .t.linkish{font-weight:600;font-size:14px;line-height:1.3;text-decoration:none}.card .t.linkish:hover{text-decoration:underline}
.check{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:38px;font-size:14px}.check input{width:auto}
.pill.lab{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:11px;color:var(--ink)}
.feed-item.prio{box-shadow:inset 3px 0 0 var(--bad);padding-left:10px}
.acts-inline{flex-wrap:wrap}
.hist{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist .when{font-family:var(--f-mono);font-size:11px;color:var(--muted)}.hist.del>div:last-child>div:first-child{color:var(--bad)}
.modal.opp-modal{max-width:900px}
.lab-mono{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opp-title{font-family:var(--f-display);font-stretch:118%;font-weight:500;font-size:24px;letter-spacing:-.03em;text-transform:uppercase;line-height:1;margin-top:4px;overflow-wrap:anywhere}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:18px 0}
.step{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;padding:10px 8px;border-radius:999px;border:1px solid var(--line-strong);background:var(--field);color:var(--ink-2);font-weight:500;cursor:pointer;min-height:42px;font-size:13px}
.step .dotn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);font-family:var(--f-mono);font-size:11px;flex:none}

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mad = n => (n==null||isNaN(n))?"—":new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Number(n));
const madShort = n => { n=Number(n)||0; if(n>=1e6) return (n/1e6).toLocaleString("fr-FR",{maximumFractionDigits:1})+" M"; if(n>=1e4) return Math.round(n/1e3).toLocaleString("fr-FR")+" k"; return mad(n); };

/* ---- Value helpers (validated JS values for Supabase) ---- */

/* ---- Supabase ---- */
const SUPABASE_URL = "https://igfgqfwkhyonptbtrywl.supabase.co";

/* ---- Status / errors ---- */
function setStatus(kind,text){ $("#dot").className="dot "+kind; $("#status-text").textContent=text; const m=$("#more-status"); if(m) m.textContent=text; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; const s=$("#toast-slot"); s.innerHTML=""; s.appendChild(t); setTimeout(()=>{ if(t.parentNode) t.remove(); },3200); }
function errorCopy(e){
  const msg = (e && (e.message||e.error_description)) || "";
  if(e && e.code==="42501") return ["Accès refusé","Votre compte n’a pas les droits pour cette action (réservée au superviseur ou à l’admin)."];
  if(/Failed to fetch|NetworkError/i.test(msg)) return ["Pas de connexion","Vérifiez votre connexion internet puis cliquez sur ↻."];
  if(/JWT|expired/i.test(msg)) return ["Session expirée","Déconnectez-vous puis reconnectez-vous."];
  return ["La base a refusé l’opération", msg.slice(0,300) || "Réessayez avec ↻."];
}
function showBanner(e,kind){
  const [t,d]=errorCopy(e);
  $("#banner-slot").innerHTML=`<div class="banner ${kind||"bad"}" role="alert"><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`;
}
function clearBanner(){ $("#banner-slot").innerHTML=""; }

/* ---- Load ---- */
let loading=false;
const idx={contactsBy:new Map(),pipeBy:new Map()};
async function load(){
  if(loading) return; loading=true;
  setStatus("busy","Synchronisation…");
  try{
    const q = async (t,order,asc,limit)=>{
      if(limit) return sb.from(t).select("*").order(order,{ascending:asc}).order("id").limit(limit);
      const all=[]; const step=1000;
      for(let from=0;;from+=step){
        const r=await sb.from(t).select("*").order(order,{ascending:asc}).order("id").range(from,from+step-1);
        if(r.error) return r; all.push(...(r.data||[])); if(!r.data||r.data.length<step) break;
      }
      return {data:all,error:null};
    };
    const res = await Promise.all([
      q("equipe","nom",true), q("comptes","nom",true), q("contacts","nom",true), q("produits","nom",true),
      q("opportunites","updated_at",false), qActivites(), q("devis","created_at",false), q("devis_lignes","position",true).then(r=>r.error?{data:[],error:null}:r),
      q("paiements","date_echeance",true).then(r=>r.error?{data:[],error:null}:r),
      sb.from("reglages").select("*").then(r=>r.error?{data:[],error:null}:r)
    ]);
    const err = res.find(r=>r.error); if(err) throw err.error;
    const [equipe,comptes,contacts,produits,opportunites,activites,devis,devis_lignes,paiements,reglagesRows] = res.map(r=>r.data||[]);
    const reglages={}; reglagesRows.forEach(x=>reglages[x.cle]=x.valeur);
    state = {equipe,comptes,contacts,produits,opportunites,activites,devis,devis_lignes,paiements,reglages};
    idx.contactsBy=new Map(); contacts.forEach(c=>idx.contactsBy.set(c.compte_id,(idx.contactsBy.get(c.compte_id)||0)+1));
    idx.pipeBy=new Map(); opportunites.filter(o=>o.issue==="en_cours").forEach(o=>idx.pipeBy.set(o.compte_id,(idx.pipeBy.get(o.compte_id)||0)+(+o.montant_mad||0)));
    me = equipe.find(e=>e.user_id===currentUser.id) || null;
    if(!me){ showNoAccess(); return; }
    document.body.classList.toggle("pilote", estPilote());
    loadNotifs();
    loaded = true; clearBanner();
    setStatus("ok","À jour · "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    setStatus("bad","Hors ligne"); showBanner(e);
  }finally{ loading=false; if(me) render(); }
}

// Activités : les 120 derniers jours + toutes les tâches à faire (même anciennes ou lointaines)
async function qActivites(){
  const depuis=new Date(Date.now()-120*864e5).toISOString(), all=new Map(), step=1000;
  for(const mk of [f=>f.gte("date_activite",depuis), f=>f.eq("statut","a_faire")]){
    for(let from=0;;from+=step){
      const r=await mk(sb.from("activites").select("*")).order("date_activite",{ascending:false}).order("id").range(from,from+step-1);
      if(r.error) return r; (r.data||[]).forEach(a=>all.set(a.id,a)); if(!r.data||r.data.length<step) break;
    }
  }
  return {data:[...all.values()].sort((a,b)=>String(b.date_activite).localeCompare(String(a.date_activite))),error:null};
}

async function write(op,okMsg){
  setStatus("busy","Enregistrement…");
  try{ const {error} = await op(); if(error) throw error; toast(okMsg||"Enregistré"); const r=reopenAfter; reopenAfter=null; closeModal(true); await load(); if(r) r(); return true; }
  catch(e){ setStatus("bad","Échec"); const [t,d]=errorCopy(e); toast(t+" — "+d.slice(0,120)); return false; }
}

/* ---- KPIs ---- */
function renderKpis(){
  const open = state.opportunites.filter(o=>o.issue==="en_cours");
  const won = state.opportunites.filter(o=>o.issue==="gagnee");
  const tot = open.reduce((s,o)=>s+(+o.montant_mad||0),0);
  const pond = open.reduce((s,o)=>s+(+o.montant_mad||0)*(+o.probabilite||0)/100,0);
  const wonAmt = won.reduce((s,o)=>s+(+o.montant_mad||0),0);
  const lost = state.opportunites.filter(o=>o.issue==="perdue").length;
  const rate = (won.length+lost)? Math.round(won.length*100/(won.length+lost)) : null;
  const wk = Date.now()-7*864e5;
  const act7 = state.activites.filter(a=>new Date(a.date_activite).getTime()>=wk).length;
  const today = localISO();
  const late = state.activites.filter(a=>a.date_prochaine_action && a.date_prochaine_action<today).length;
  const k = (lab,val,unit,sub)=>`<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}${unit?`<small>${unit}</small>`:""}</div><div class="sub">${sub}</div></div>`;
  $("#kpis").innerHTML = loaded ? [
    k("Pipeline en cours",madShort(tot),"MAD",`${open.length} opportunité${open.length>1?"s":""}`),
    k("Pipeline pondéré",madShort(pond),"MAD","montant × probabilité"),
    k("Gagné",madShort(wonAmt),"MAD",rate==null?"aucune affaire clôturée":`taux de transformation ${rate} %`),
    k("Activité 7 jours",act7,"",late?`${late} relance${late>1?"s":""} en retard`:"aucune relance en retard"),
    k("Comptes",new Intl.NumberFormat("fr-FR").format(state.comptes.length),"",`${state.comptes.filter(c=>c.statut==="client").length} clients · ${new Intl.NumberFormat("fr-FR").format(state.contacts.length)} contacts`)
  ].join("") : Array(5).fill('<div class="kpi"><div class="skeleton" style="height:58px"></div></div>').join("");
}

function render(){
  if(me && PILOTE_TABS.includes(tab) && !estPilote()) tab="aujourdhui";

}

/* Affaires qui traînent : seuil de risque en jours par étape */
const SEUILS_DEFAUT={Qualification:30,Proposition:14,Negociation:21,Fermeture:10};
const seuils=()=>Object.assign({},SEUILS_DEFAUT,state.reglages.seuils_risque||{});
function risque(o){
  if(!o||o.issue!=="en_cours") return null;
  const j=Math.max(0,Math.floor((Date.now()-new Date(o.etape_depuis||o.updated_at||o.created_at).getTime())/864e5)), s=+seuils()[o.etape]||30;
  return {j,s,niveau:j>s?"bloquee":j>=Math.ceil(s*0.75)?"risque":null};
}
const risquePill=o=>{ const r=risque(o); if(!r||!r.niveau) return ""; return `<span class="pill ${r.niveau==="bloquee"?"bad":"warn"}" title="${r.j} jours en ${ETAPE_LABEL[o.etape]} · seuil ${r.s} jours">${r.niveau==="bloquee"?"Bloquée":"À risque"} · ${r.j} j</span>`; };
function formSeuils(){
  const s=seuils();
  const h=`<p style="margin-top:0">Une affaire est signalée <b>à risque</b> aux trois quarts du seuil, puis <b>bloquée</b> quand elle reste plus longtemps que le seuil dans la même étape. Le compteur repart à zéro à chaque changement d’étape.</p>
   <div class="form-grid">${ETAPES.map(e=>fld("m-s-"+e,ETAPE_LABEL[e]+" (jours)",`<input id="m-s-${e}" name="${e}" type="number" inputmode="numeric" min="1" max="365" value="${s[e]}">`)).join("")}</div>`;
  const submit=async f=>{ const v={}; ETAPES.forEach(e=>v[e]=sInt(f[e],1,365)||SEUILS_DEFAUT[e]); return write(()=>sb.from("reglages").upsert({cle:"seuils_risque",valeur:v,updated_at:new Date().toISOString()}),"Seuils mis à jour"); };
  modal("Seuils de risque du pipeline",h,submit,"Enregistrer");
}

function oppCard(o){
  const c = byId(state.comptes,o.compte_id), com = byId(state.equipe,o.commercial_id), p = byId(state.produits,o.produit_id);
  const idx = ETAPES.indexOf(o.etape);
  return `<article class="card">
    <button class="t linkish" data-act="open-opp" data-id="${o.id}">${esc(o.titre)}</button>
    <div class="c">${esc(c?c.nom:"Compte supprimé")}${c?` <span class="pill ${c.segment[0]}">${c.segment[0]}</span>`:""}</div>
    ${risquePill(o)?`<div class="meta">${risquePill(o)}</div>`:""}

    <div class="meta">${com?esc(com.nom):"Non assignée"}${p?" · "+esc(p.nom):""}</div>
    <div class="acts">
      ${idx>0?`<button class="btn small" data-act="move" data-id="${o.id}" data-to="${ETAPES[idx-1]}" title="Étape précédente">←</button>`:""}
      ${idx<3?`<button class="btn small" data-act="move" data-id="${o.id}" data-to="${ETAPES[idx+1]}">${ETAPE_LABEL[ETAPES[idx+1]]} →</button>`:""}
      ${idx===3?`<button class="btn small ok" data-act="won" data-id="${o.id}">Gagnée</button><button class="btn small bad" data-act="lost" data-id="${o.id}">Perdue</button>`:""}
      <button class="btn small" data-act="edit-opp" data-id="${o.id}">Modifier</button>
      <button class="btn small" data-act="log" data-opp="${o.id}">+ Activité</button>
      <button class="btn small" data-act="new-devis" data-opp="${o.id}">+ Devis</button>
    </div></article>`;
}

let pipeFilt={com:"",q:"",risque:""}, colShown={}, pipeStage=null;
const estMobile=()=>window.matchMedia("(max-width:720px)").matches;
function viewPipeline(v){
  const q=strip(pipeFilt.q);
  const match=o=>(!pipeFilt.com||(pipeFilt.com==="moi"?(me&&o.commercial_id===me.id):pipeFilt.com==="none"?!o.commercial_id:o.commercial_id===pipeFilt.com))
    &&(!q||strip([o.titre,o.description,(byId(state.comptes,o.compte_id)||{}).nom].filter(Boolean).join(" ")).includes(q))
    &&(!pipeFilt.risque||(r=>r&&(pipeFilt.risque==="bloquee"?r.niveau==="bloquee":!!r.niveau))(risque(o)));
  const rk=o=>{ const r=risque(o); return r&&r.niveau==="bloquee"?2:r&&r.niveau?1:0; };
  const open = state.opportunites.filter(o=>o.issue==="en_cours"&&match(o)).sort((a,b)=>pipeFilt.risque?(rk(b)-rk(a))||((+b.montant_mad||0)-(+a.montant_mad||0)):String(b.updated_at||"").localeCompare(String(a.updated_at||"")));
  const closed = state.opportunites.filter(o=>o.issue!=="en_cours").slice(0,12);
  const noCompte = !state.comptes.length;

let supShowroom="";
function alertesEquipe(){
  const A=[], now=Date.now();
  const derniere=new Map(); state.activites.forEach(a=>{ if(a.statut==="a_faire") return; const id=a.commercial_id||a.createur_id; const t=new Date(a.date_activite).getTime(); if(t<=now&&(!derniere.has(id)||t>derniere.get(id))) derniere.set(id,t); });
  state.equipe.filter(e=>e.actif&&e.role==="commercial"&&(!supShowroom||e.showroom===supShowroom)).forEach(e=>{ const t=derniere.get(e.id); const j=t?Math.floor((now-t)/864e5):null;
    if(j==null||j>=3) A.push({bad:j==null||j>=5,t:`${e.nom} : aucune activité ${j==null?"enregistrée":"depuis "+j+" jours"}`,s:t?"dernière le "+fmtDate(t):"",ord:j==null?999:j}); });
  const okSr=id=>!supShowroom||((byId(state.equipe,id)||{}).showroom===supShowroom);
  state.devis.filter(d=>d.statut==="envoye"&&(+d.montant_mad||0)>=100000&&okSr(d.commercial_id)).forEach(d=>{
    const depuis=new Date(d.date_envoi||d.updated_at||d.created_at).getTime();
    const relance=state.activites.some(a=>a.statut!=="a_faire"&&new Date(a.date_activite).getTime()>depuis&&((d.opportunite_id&&a.opportunite_id===d.opportunite_id)||a.compte_id===d.compte_id));
    const j=Math.floor((now-depuis)/864e5);
    if(!relance&&j>=10){ const c=byId(state.comptes,d.compte_id); A.push({bad:true,t:`Devis ${devisNum(d)} de ${madShort(d.montant_mad)} MAD sans relance depuis ${j} jours`,s:[c&&c.nom,nomMembre(d.commercial_id)].filter(Boolean).join(" · "),ord:500+j,act:`data-act="edit-devis" data-id="${d.id}"`}); }
  });
  ["Fermeture","Negociation","Proposition"].forEach((et,i)=>{ const bl=state.opportunites.filter(o=>o.etape===et&&okSr(o.commercial_id)&&(risque(o)||{}).niveau==="bloquee");
    if(bl.length) A.push({bad:et!=="Proposition",t:`${bl.length} affaire${bl.length>1?"s":""} bloquée${bl.length>1?"s":""} en ${ETAPE_LABEL[et]} (plus de ${seuils()[et]} j)`,s:`${madShort(bl.reduce((s,o)=>s+(+o.montant_mad||0),0))} MAD en jeu`,ord:300-i,act:`data-act="pipe-bloquees" data-etape="${et}"`}); });
  const imp=state.paiements.filter(p=>p.statut==="impaye"&&okSr(p.commercial_id)), retard=state.paiements.filter(p=>["a_recevoir","recu"].includes(p.statut)&&p.date_echeance<localISO()&&okSr(p.commercial_id));
  if(imp.length) A.push({bad:true,t:`${imp.length} paiement${imp.length>1?"s":""} impayé${imp.length>1?"s":""}`,s:`${mad(imp.reduce((s,p)=>s+(+p.montant_mad||0),0))} MAD`,ord:700,act:`data-act="goto-paiements" data-f="impaye"`});
  if(retard.length) A.push({bad:false,t:`${retard.length} chèque${retard.length>1?"s":""} ou virement${retard.length>1?"s":""} en retard d’encaissement`,s:`${mad(retard.reduce((s,p)=>s+(+p.montant_mad||0),0))} MAD`,ord:400,act:`data-act="goto-paiements" data-f="retard"`});
  const perdues=state.opportunites.filter(o=>o.issue==="perdue"&&okSr(o.commercial_id)&&(now-new Date(o.updated_at).getTime())<7*864e5);
  if(perdues.length){ const rs={}; perdues.forEach(o=>{ const r=(o.raison_perte||"Non précisée").split(" — ")[0]; rs[r]=(rs[r]||0)+1; }); const top=Object.entries(rs).sort((a,b)=>b[1]-a[1])[0];
    A.push({bad:false,t:`${perdues.length} affaire${perdues.length>1?"s":""} perdue${perdues.length>1?"s":""} cette semaine`,s:"raison principale : "+top[0].toLowerCase(),ord:50}); }
  return A.sort((a,b)=>(b.bad-a.bad)||b.ord-a.ord);
}
function viewSuperviseur(v){

  <div class="panel"><h3>À surveiller</h3>${alertes.length?alertes.slice(0,10).map(a=>`<div class="alert-row"><span class="sq${a.bad?" bad":""}" aria-hidden="true"></span><div style="min-width:0">${a.act?`<button class="linkish" ${a.act}><b>${esc(a.t)}</b></button>`:`<b>${esc(a.t)}</b>`}${a.s?`<div class="hint" style="margin:0">${esc(a.s)}</div>`:""}</div></div>`).join(""):`<p class="hint">Rien d’anormal pour l’instant.</p>`}</div>
  <div class="panel" style="margin-top:16px"><h3>Par commercial</h3><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Commercial</th>${ETAPES.map(s=>`<th class="num">${ETAPE_LABEL[s].slice(0,5)}.</th>`).join("")}<th class="num">Pipeline MAD</th><th class="num">Pondéré MAD</th><th class="num">Gagné MAD</th><th class="num">Comptes</th><th class="num">Activités 7 j</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.e.nom)}</b><div class="hint" style="margin:0">${[r.e.showroom?SHOWROOMS[r.e.showroom]:"",r.e.role?ROLES[r.e.role]+(r.e.actif?"":" · sans accès"):""].filter(Boolean).join(" · ")}</div></td>${ETAPES.map(s=>`<td class="num">${r.by[s]||"·"}</td>`).join("")}<td class="num">${mad(r.tot)}</td><td class="num">${mad(r.pond)}</td><td class="num">${mad(r.won)}</td><td class="num">${r.comptes}</td><td class="num">${r.act?r.act:(r.e.actif?`<span class="pill bad">0</span>`:"·")}</td></tr>`).join("")}
  </tbody></table></div>${!state.equipe.some(e=>e.showroom)?`<p class="hint" style="margin-top:10px">Indique le showroom de chaque commercial dans Réglages ⚙ pour filtrer par showroom.</p>`:""}</div>

let lastFocus=null, dirty=false, importBusy=false;
function closeModal(force){
  if(importBusy) return;
  if(dirty && !force){ const c=$("#mconfirm"); if(c){ c.hidden=false; c.querySelector("button").focus(); return; } }
  $("#modal-slot").innerHTML=""; dirty=false;

function trapFocus(root){
  root.addEventListener("keydown",e=>{
    if(e.key!=="Tab") return;
    const f=[...root.querySelectorAll('button:not([disabled]),[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
    if(!f.length) return; const a=f[0], b=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); b.focus(); }
    else if(!e.shiftKey && document.activeElement===b){ e.preventDefault(); a.focus(); }
  });

function confirmInline(btn, question, yesAct, id){
  const box=btn.closest(".acts-inline")||btn.parentElement;
  const prev=box.innerHTML;
  box.innerHTML=`<span class="hint" style="margin:0">${esc(question)}</span><button class="btn small bad" data-act="${yesAct}" data-id="${id}">Oui, supprimer</button><button class="btn small" data-cancel>Annuler</button>`;
  box.querySelector("[data-cancel]").addEventListener("click",ev=>{ ev.stopPropagation(); box.innerHTML=prev; },{once:true});
  box.querySelector(`[data-act="${yesAct}"]`).focus();
}

/* ---- Canal d'acquisition ---- */
let acqPeriode="30j", acqDu="", acqAu="";
function periode(k, du0, au0){
  if(k===undefined){ k=acqPeriode; du0=acqDu; au0=acqAu; }
  const now=new Date(), d0=x=>{const z=new Date(x);z.setHours(0,0,0,0);return z;};
  switch(k){
    case "7j": return [d0(Date.now()-6*864e5), null];
    case "30j": return [d0(Date.now()-29*864e5), null];
    case "mois": return [new Date(now.getFullYear(),now.getMonth(),1), null];
    case "mois-1": return [new Date(now.getFullYear(),now.getMonth()-1,1), new Date(now.getFullYear(),now.getMonth(),1)];
    case "trim": return [new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1), null];
    case "annee": return [new Date(now.getFullYear(),0,1), null];
    case "perso": return [du0?new Date(du0+"T00:00"):null, au0?new Date(new Date(au0+"T00:00").getTime()+864e5):null];
    default: return [null,null];
  }
}
function viewAcquisition(v){

  state.comptes.forEach(c=>{ if(inP(c.created_at)){ const r=R(c.source||"Sans source"); r.contacts++; if(c.statut==="client") r.clients++; } });
  state.opportunites.forEach(o=>{ const s=srcOf.get(o.compte_id)||"Sans source"; if(inP(o.created_at)){ R(s).opps++; if(o.issue==="en_cours") R(s).pipe+=(+o.montant_mad||0); }
    if(o.issue==="gagnee"&&inP(o.updated_at)){ R(s).gagnees++; R(s).ca+=(+o.montant_mad||0); } });
  const list=Object.values(rows).sort((a,b)=>b.contacts-a.contacts||b.ca-a.ca);
  const tot=list.reduce((t,r)=>({contacts:t.contacts+r.contacts,opps:t.opps+r.opps,gagnees:t.gagnees+r.gagnees,ca:t.ca+r.ca}),{contacts:0,opps:0,gagnees:0,ca:0});

  v.innerHTML=`<div class="section-head"><div><h2>Canal d’acquisition</h2><p class="hint">Nouveaux contacts, opportunités et chiffre d’affaires par source (salon, événement, canal)</p></div></div>
  <div class="filters" style="margin-bottom:12px"><select id="f-per" aria-label="Période">${Object.entries(P).map(([k,l])=>`<option value="${k}" ${acqPeriode===k?"selected":""}>${l}</option>`).join("")}</select>
   ${acqPeriode==="perso"?`<input id="f-du" type="date" aria-label="Du" value="${acqDu}"><input id="f-au" type="date" aria-label="Au" value="${acqAu}">`:""}</div>
  <div class="kpis" style="padding-top:0">
    <div class="kpi"><div class="lab">Nouveaux contacts</div><div class="val">${nf.format(tot.contacts)}</div><div class="sub">${(n=>n+" source"+(n>1?"s":"")+" active"+(n>1?"s":""))(list.filter(r=>r.contacts).length)}</div></div>
    <div class="kpi"><div class="lab">Opportunités créées</div><div class="val">${nf.format(tot.opps)}</div><div class="sub">${tot.contacts?Math.round(tot.opps*1000/tot.contacts)/10:0} % des nouveaux contacts</div></div>

  </div>

}

let agStart=null, agQui=null, agDay=null;

const lundiDe=d=>{ const z=startOfDay(d); z.setDate(z.getDate()-((z.getDay()+6)%7)); return z; };
const hm=d=>new Date(d).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

function enhanceCombos(root){
  root.querySelectorAll("input[list]").forEach(inp=>{
    const dl=document.getElementById(inp.getAttribute("list")); if(!dl) return;
    const vals=[...dl.options].map(o=>o.value); if(!vals.length) return;
    const keys=vals.map(v=>strip(v));
    inp.removeAttribute("list"); inp.setAttribute("role","combobox"); inp.setAttribute("aria-autocomplete","list"); inp.setAttribute("aria-expanded","false");
    const box=document.createElement("div"); box.className="combo"; inp.parentNode.insertBefore(box,inp); box.appendChild(inp);
    const lid=inp.id+"-lb"; const list=document.createElement("div"); list.className="combo-list"; list.id=lid; list.setAttribute("role","listbox"); list.hidden=true; box.appendChild(list); inp.setAttribute("aria-controls",lid);
    let items=[], sel=-1;
    const show=()=>{ const q=strip(inp.value).split(/\s+/).filter(Boolean); items=[];
      for(let i=0;i<vals.length&&items.length<40;i++){ if(q.every(w=>keys[i].includes(w))||(/\d{4,}/.test(inp.value)&&keys[i].replace(/\D/g,"").includes(inp.value.replace(/\D/g,"")))) items.push(vals[i]); }
      if(items.length===1&&items[0]===inp.value){ hide(); return; }
      sel=-1; list.innerHTML=items.length?items.map((v,i)=>{ const [a,...r]=v.split(" — "); return `<button type="button" role="option" id="${lid}-${i}" aria-selected="false" data-i="${i}"><b>${esc(a)}</b>${r.length?`<small>${esc(r.join(" · "))}</small>`:""}</button>`; }).join(""):`<div class="empty hint">Aucun client ne correspond. Créez-le d’abord dans Clients.</div>`;
      list.hidden=false; inp.setAttribute("aria-expanded","true"); };
    const hide=()=>{ list.hidden=true; inp.setAttribute("aria-expanded","false"); inp.removeAttribute("aria-activedescendant"); };
    const pick=i=>{ inp.value=items[i]; hide(); inp.dispatchEvent(new Event("input",{bubbles:true})); inp.dispatchEvent(new Event("change",{bubbles:true})); };
    const mark=()=>{ list.querySelectorAll("[role=option]").forEach((b,i)=>b.setAttribute("aria-selected",String(i===sel))); if(sel>=0){ inp.setAttribute("aria-activedescendant",lid+"-"+sel); const b=list.querySelector(`[data-i="${sel}"]`); if(b) b.scrollIntoView({block:"nearest"}); } };
    inp.addEventListener("input",e=>{ if(e.isTrusted) show(); });
    inp.addEventListener("focus",()=>{ if(!inp.readOnly) show(); });
    inp.addEventListener("blur",()=>setTimeout(hide,150));
    inp.addEventListener("keydown",e=>{ if(list.hidden) return;
      if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(items.length-1,sel+1); mark(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(0,sel-1); mark(); }
      else if(e.key==="Enter"&&items.length){ e.preventDefault(); pick(sel<0?0:sel); }
      else if(e.key==="Escape"){ e.stopPropagation(); hide(); } });
    list.addEventListener("mousedown",e=>e.preventDefault());
    list.addEventListener("click",e=>{ const b=e.target.closest("[data-i]"); if(b) pick(+b.dataset.i); });
  });
}

let rep={met:"ca",dim:"commercial",per:"trim",du:"",au:"",showroom:"",com:""}, repCache={};
const REP_MET={ca:"CA signé (MAD)",pipeline:"Pipeline en cours (MAD)",opps:"Opportunités créées",devis_n:"Devis envoyés",devis_mt:"Montant des devis envoyés (MAD)",visites:"Visites et démos",appels:"Appels et messages",contacts:"Nouveaux contacts",taux:"Taux de transformation"};
const REP_DIM={commercial:"Commercial",showroom:"Showroom",source:"Source / salon",machine:"Machine",segment:"Segment",ville:"Ville",mois:"Mois"};
const REP_MAD=["ca","pipeline","devis_mt"];
async function actsPeriode(du,au){
  const key=(du?du.toISOString():"")+"|"+(au?au.toISOString():"");
  const limite=Date.now()-118*864e5;
  if(du&&du.getTime()>=limite) return state.activites;
  if(repCache[key]) return repCache[key];
  const all=[]; for(let from=0;;from+=1000){
    let q=sb.from("activites").select("id,type,statut,commercial_id,createur_id,compte_id,opportunite_id,date_activite").neq("statut","a_faire");
    if(du) q=q.gte("date_activite",du.toISOString()); if(au) q=q.lt("date_activite",au.toISOString());
    const r=await q.order("date_activite").order("id").range(from,from+999); if(r.error) throw r.error;
    all.push(...r.data); if(r.data.length<1000) break; }
  return repCache[key]=all;
}
async function repData(){
  const [du,au]=periode(rep.per,rep.du,rep.au), inP=d=>{ if(!d) return false; const t=new Date(d).getTime(); return (!du||t>=du.getTime())&&(!au||t<au.getTime()); };
  const oppOf=id=>byId(state.opportunites,id);
  const R=[]; // {date, v, ok?, commercial_id, compte_id, produit_id, lib}
  const m=rep.met;
  if(m==="ca") state.opportunites.filter(o=>o.issue==="gagnee"&&inP(o.updated_at)).forEach(o=>R.push({date:o.updated_at,v:+o.montant_mad||0,commercial_id:o.commercial_id,compte_id:o.compte_id,produit_id:o.produit_id,lib:o.titre}));
  if(m==="pipeline") state.opportunites.filter(o=>o.issue==="en_cours").forEach(o=>R.push({date:o.created_at,v:+o.montant_mad||0,commercial_id:o.commercial_id,compte_id:o.compte_id,produit_id:o.produit_id,lib:o.titre}));
  if(m==="opps") state.opportunites.filter(o=>inP(o.created_at)).forEach(o=>R.push({date:o.created_at,v:1,commercial_id:o.commercial_id,compte_id:o.compte_id,produit_id:o.produit_id,lib:o.titre}));
  if(m==="devis_n"||m==="devis_mt") state.devis.filter(d=>d.statut!=="brouillon"&&inP(d.date_envoi||d.created_at)).forEach(d=>{ const o=oppOf(d.opportunite_id); R.push({date:d.date_envoi||d.created_at,v:m==="devis_n"?1:(+d.montant_mad||0),commercial_id:d.commercial_id,compte_id:d.compte_id,produit_id:o&&o.produit_id,lib:devisNum(d)}); });
  if(m==="contacts") state.comptes.filter(c=>inP(c.created_at)).forEach(c=>R.push({date:c.created_at,v:1,commercial_id:c.commercial_id,compte_id:c.id,lib:c.nom}));
  if(m==="taux") state.opportunites.filter(o=>o.issue!=="en_cours"&&inP(o.updated_at)).forEach(o=>R.push({date:o.updated_at,v:o.issue==="gagnee"?1:0,commercial_id:o.commercial_id,compte_id:o.compte_id,produit_id:o.produit_id,lib:o.titre}));
  if(m==="visites"||m==="appels"){ const types=m==="visites"?["visite","demo","rdv","formation"]:["appel","whatsapp","email"];
    (await actsPeriode(du,au)).filter(a=>a.statut!=="a_faire"&&types.includes(a.type)&&inP(a.date_activite)).forEach(a=>{ const o=oppOf(a.opportunite_id); R.push({date:a.date_activite,v:1,commercial_id:a.commercial_id||a.createur_id,compte_id:a.compte_id,produit_id:o&&o.produit_id,lib:TYPES_ACT[a.type]}); }); }
  const showroomOf=id=>{ const e=byId(state.equipe,id); return e&&e.showroom||""; };
  return R.filter(r=>(!rep.com||r.commercial_id===rep.com)&&(!rep.showroom||showroomOf(r.commercial_id)===rep.showroom));
}
function repCle(r){
  const c=byId(state.comptes,r.compte_id);
  switch(rep.dim){
    case "commercial": return r.commercial_id?nomMembre(r.commercial_id):"Non assigné";
    case "showroom": { const e=byId(state.equipe,r.commercial_id); return e&&e.showroom?SHOWROOMS[e.showroom]:"Showroom non renseigné"; }
    case "source": return c&&c.source||"Sans source";
    case "machine": { const p=byId(state.produits,r.produit_id); return p?p.nom:"Sans machine"; }
    case "segment": return c?SEGMENTS[c.segment]:"—";
    case "ville": return c&&c.ville||"Ville non renseignée";
    case "mois": { const d=new Date(r.date); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  }
}
let repLast=null;
async function viewReporting(v){
  const P={"7j":"7 derniers jours","30j":"30 derniers jours",mois:"Ce mois-ci","mois-1":"Mois dernier",trim:"Ce trimestre",annee:"Cette année",tout:"Depuis le début",perso:"Dates personnalisées"};

  const coms={}; state.equipe.forEach(e=>{ if(state.opportunites.some(o=>o.commercial_id===e.id)||e.actif) coms[e.id]=e.nom; });
  v.innerHTML=`<div class="section-head"><div><h2>Reporting</h2><p class="hint">Choisis quoi mesurer et comment le découper. Tout est calculé sur les données du CRM et s’exporte en Excel.</p></div>
    <div class="tools"><button class="btn" data-act="rep-csv">CSV</button><button class="btn primary" data-act="rep-xlsx">Exporter Excel</button></div></div>
  <div class="panel"><div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    ${sel("r-met","Je veux voir",REP_MET,rep.met)}${sel("r-dim","Découpé par",REP_DIM,rep.dim)}${rep.met==="pipeline"?`<div class="field"><label>Période</label><p class="hint" style="margin:8px 0 0">Affaires en cours aujourd’hui</p></div>`:sel("r-per","Période",P,rep.per)}
    ${sel("r-sr","Showroom",SHOWROOMS,rep.showroom,"Tous les showrooms")}${sel("r-com","Commercial",coms,rep.com,"Toute l’équipe")}
    ${rep.per==="perso"&&rep.met!=="pipeline"?`<div class="field"><label for="r-du">Du</label><input id="r-du" type="date" value="${rep.du}"></div><div class="field"><label for="r-au">Au</label><input id="r-au" type="date" value="${rep.au}"></div>`:""}</div></div>
  <div class="panel" style="margin-top:16px" id="rep-out" aria-live="polite"><div class="skeleton"></div></div>`;
  const re=()=>viewReporting(v);
  [["#r-met","met"],["#r-dim","dim"],["#r-per","per"],["#r-sr","showroom"],["#r-com","com"],["#r-du","du"],["#r-au","au"]].forEach(([s,k])=>{ const el=$(s); if(el) el.addEventListener("change",e=>{ rep[k]=e.target.value; re(); }); });
  let R; try{ R=await repData(); }catch(e){ $("#rep-out").innerHTML=`<p class="hint">${esc(errorCopy(e)[1])}</p>`; return; }
  if(tab!=="reporting"||!document.contains($("#rep-out"))) return;
  const groups=new Map(); R.forEach(r=>{ const k=repCle(r); const g=groups.get(k)||{k,v:0,n:0}; g.v+=r.v; g.n++; groups.set(k,g); });
  let rows=[...groups.values()];
  const taux=rep.met==="taux";
  rows.forEach(g=>{ g.val=taux?(g.n?Math.round(g.v*1000/g.n)/10:0):g.v; });
  rows.sort(rep.dim==="mois"?(a,b)=>a.k.localeCompare(b.k):(a,b)=>b.val-a.val||b.n-a.n);
  const tot=R.reduce((s,r)=>s+r.v,0), totVal=taux?(R.length?Math.round(tot*1000/R.length)/10:0):tot;

async function exportRep(kind){
  if(!repLast) return;
  const nom=("cellulift-"+repLast.titre).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").toLowerCase().slice(0,80);
  const dl=(blob,ext)=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nom+"."+ext; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); };
  if(kind==="csv"){ const rows=repLast.rows, cols=Object.keys(rows[0]||{});
    const csv=[cols.join(";"),...rows.map(r=>cols.map(c=>`"${String(r[c]??"").replace(/"/g,'""')}"`).join(";"))].join("\r\n");
    return dl(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}),"csv"); }
  try{ await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"); }catch(e){ toast(e.message); return exportRep("csv"); }
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(repLast.rows),"Synthèse");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(repLast.detail),"Détail");

const r2 = n => Math.round((+n||0)*100)/100;

function devisTotaux(lignes, remisePct, tvaPct){
  const brut = lignes.reduce((s,l)=>s+(+l.quantite||0)*(+l.prix_unitaire_mad||0),0);
  const sousTotal = lignes.reduce((s,l)=>s+(+l.quantite||0)*(+l.prix_unitaire_mad||0)*(1-(+l.remise_pct||0)/100),0);
  const remiseLignes = brut - sousTotal;
  const remiseGlobale = sousTotal*(+remisePct||0)/100;
  const ht = sousTotal - remiseGlobale;
  const tva = ht*(+tvaPct||0)/100;
  return { brut:r2(brut), remiseLignes:r2(remiseLignes), sousTotal:r2(sousTotal), remiseGlobale:r2(remiseGlobale), ht:r2(ht), tva:r2(tva), ttc:r2(ht+tva) };
}

// Montant en lettres (dirhams et centimes), règles françaises traditionnelles.
function enLettres(n){
  const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
  const D={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
  const moinsCent=n=>{
    if(n<17) return U[n];
    if(n<20) return "dix-"+U[n-10];
    const d=Math.floor(n/10), u=n%10;
    if(d<7) return D[d]+(u===0?"":u===1?" et un":"-"+U[u]);
    if(d===7) return "soixante"+(u===1?" et onze":"-"+moinsCent(10+u));
    if(d===8) return u===0?"quatre-vingts":"quatre-vingt-"+U[u];
    return "quatre-vingt-"+moinsCent(10+u);
  };
  const moinsMille=n=>{
    const c=Math.floor(n/100), r=n%100;
    if(!c) return moinsCent(r);
    const cent = c===1?"cent":U[c]+" cent"+(r===0?"s":"");
    return r?cent+" "+moinsCent(r):cent;
  };
  const entier=n=>{
    if(n===0) return "zéro";
    const parts=[]; const mds=Math.floor(n/1e9), mns=Math.floor(n%1e9/1e6), mil=Math.floor(n%1e6/1e3), rest=n%1e3;
    if(mds) parts.push(moinsMille(mds)+" milliard"+(mds>1?"s":""));
    if(mns) parts.push(moinsMille(mns)+" million"+(mns>1?"s":""));
    if(mil) parts.push(mil===1?"mille":moinsMille(mil).replace(/(cent|vingt)s$/,"$1")+" mille");
    if(rest) parts.push(moinsMille(rest));
    return parts.join(" ");
  };
  const total=Math.round((+n||0)*100), dh=Math.floor(total/100), cts=total%100;
  const e=entier(dh);
  let s=e+(/(million|milliard)s?$/.test(e)?" de":"")+" dirham"+(dh>1?"s":"");
  if(cts) s+=" et "+entier(cts)+" centime"+(cts>1?"s":"");
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function ligneProduit(p){ return p ? {produit_id:p.id, designation:p.nom+(p.reference?" ("+p.reference+")":""), quantite:1, prix_unitaire_mad:+p.prix_catalogue_mad||0, remise_pct:0} : {produit_id:"",designation:"",quantite:1,prix_unitaire_mad:0,remise_pct:0}; }

async function setDevisStatut(id, statut){
  const d=byId(state.devis,id); if(!d||!DEVIS_STATUTS.includes(statut)) return;
  const patch={statut}; if(statut==="envoye" && !d.date_envoi) patch.date_envoi=localISO();

  if(ok && (statut==="signe"||statut==="accepte")){
    const o=byId(state.opportunites,d.opportunite_id);
    if(o && o.issue==="en_cours") devisBanner = {opp:o.id, devis:id};
    render();
  }
}

/* ---- Échéancier de paiement (chèques, virements, effets) ---- */
const PAY_MODES={cheque:"Chèque",virement:"Virement",effet:"Effet",especes:"Espèces"};
const PAY_STATUTS={a_recevoir:"À recevoir",recu:"Reçu",depose:"Déposé en banque",encaisse:"Encaissé",impaye:"Impayé",reporte:"Reporté"};
const PAY_PILL={a_recevoir:"",recu:"warn",depose:"warn",encaisse:"ok",impaye:"bad",reporte:""};
// Échéancier mensuel : total réparti sur n versements, 1er versement (acompte) éventuellement différent,
// arrondi absorbé par le dernier pour que la somme tombe au centime près.
function planPaiement(total, n, debut, acompte){
  const T=Math.round((+total||0)*100); n=Math.max(1,Math.min(60,parseInt(n,10)||1));
  const A=acompte===""||acompte==null||isNaN(+acompte)?null:Math.round(+acompte*100);
  const d0=debut?new Date(debut+"T12:00"):new Date();
  const dateN=i=>{ const y=d0.getFullYear(), m=d0.getMonth()+i, jour=d0.getDate(); const fin=new Date(y,m+1,0).getDate(); return localISO(new Date(y,m,Math.min(jour,fin),12)); };
  let c=[];
  if(n===1) c=[T];
  else if(A!=null){ const reste=T-A, base=Math.floor(reste/(n-1)); c=[A,...Array(n-1).fill(base)]; c[n-1]+=reste-base*(n-1); }
  else { const base=Math.floor(T/n); c=Array(n).fill(base); c[n-1]+=T-base*n; }
  return c.map((x,i)=>({rang:i+1,nb:n,montant:x/100,date:dateN(i)}));
}
function planErreur(total,n,acompte){
  if(!(+total>0)) return "Le total doit être supérieur à 0.";
  if(acompte!==""&&acompte!=null&&(+acompte<0||+acompte>+total)) return "Le premier versement doit être compris entre 0 et le total.";
  if(+n>1&&acompte!==""&&acompte!=null&&+acompte===+total) return "Avec un premier versement égal au total, mettez 1 versement.";
  return null;
}
const planHtml=(plan,mode)=>`<table class="pay-prev"><thead><tr><th>N°</th><th>Échéance</th><th class="num">Montant (MAD)</th></tr></thead><tbody>${plan.map(p=>`<tr><td>${PAY_MODES[mode]||"Versement"} ${p.rang}/${p.nb}</td><td>${new Date(p.date+"T12:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"})}</td><td class="num">${mad2(p.montant)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="num"><b>${mad2(plan.reduce((s,p)=>s+p.montant,0))}</b></td></tr></tfoot></table>`;
const devisTTC=d=>devisTotaux(lignesDe(d.id),d.remise_pct,d.tva_pct).ttc;

function formEcheancier(preset){
  preset=preset||{}; const dv=preset.devis?byId(state.devis,preset.devis):null;
  const cId=(dv&&dv.compte_id)||preset.compte||"";
  const total0=dv?devisTTC(dv):"", n0=(dv&&dv.paiement_nb)||3, ac0=dv&&dv.paiement_acompte_mad!=null?dv.paiement_acompte_mad:"", deb0=(dv&&dv.paiement_debut)||localISO(), mode0=(dv&&dv.paiement_mode)||"cheque";
  const deja=dv?state.paiements.filter(p=>p.devis_id===dv.id):[];
  const h=`${deja.length?`<div class="banner warn" style="margin-bottom:12px"><div><b>Ce devis a déjà un échéancier de ${deja.length} versement${deja.length>1?"s":""}</b><span>Un nouvel échéancier s’ajoute au précédent. Modifiez plutôt les versements existants dans Paiements si besoin.</span></div></div>`:""}
  <div class="form-grid">
   ${fld("m-compte","Client",comptePicker("m-compte",cId),true)}
   ${fld("m-devis","Devis lié",`<select id="m-devis" name="devis_id"></select>`)}
   ${fld("m-mode","Mode",`<select id="m-mode" name="mode">${opt(Object.entries(PAY_MODES),mode0)}</select>`)}
   ${fld("m-total","Total à encaisser (MAD TTC)",`<input id="m-total" name="total" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(total0)}" required>`)}
   ${fld("m-nb","Nombre de versements",`<input id="m-nb" name="nb" type="number" inputmode="numeric" min="1" max="60" value="${esc(n0)}">`)}
   ${fld("m-ac","1er versement (acompte, facultatif)",`<input id="m-ac" name="acompte" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Égal aux autres" value="${esc(ac0)}">`)}
   ${fld("m-deb","Date du 1er versement",`<input id="m-deb" name="debut" type="date" value="${esc(deb0)}">`)}
   ${fld("m-banque","Banque (facultatif)",`<input id="m-banque" name="banque" autocomplete="off" placeholder="Ex. Attijariwafa…">`)}
   ${fld("m-tit","Tireur / titulaire (facultatif)",`<input id="m-tit" name="titulaire" autocomplete="off">`)}
  </div>
  <p class="hint">Un versement par mois à la même date. L’arrondi est reporté sur le dernier versement pour que le total tombe au centime près. Les n° de chèque se saisissent ensuite dans Paiements.</p>
  <div id="m-plan" aria-live="polite" style="margin-top:8px"></div>`;
  const lire=()=>({total:$("#m-total").value,n:$("#m-nb").value,ac:$("#m-ac").value,deb:$("#m-deb").value,mode:$("#m-mode").value});
  const submit=async f=>{
    const compteId=compteIdFromLabel(f.compte_label), d=byId(state.devis,f.devis_id);
    const plan=planPaiement(f.total,f.nb,f.debut,f.acompte), groupe=crypto.randomUUID?crypto.randomUUID():undefined;
    const rows=plan.map(p=>({compte_id:compteId,devis_id:d?d.id:null,opportunite_id:d?d.opportunite_id:null,commercial_id:(d&&d.commercial_id)||(byId(state.comptes,compteId)||{}).commercial_id||(me&&me.id)||null,
      groupe,mode:sEnum(f.mode,Object.keys(PAY_MODES))||"cheque",rang:p.rang,nb:p.nb,montant_mad:p.montant,date_echeance:p.date,banque:sTxt(f.banque),titulaire:sTxt(f.titulaire)}));
    return write(()=>sb.from("paiements").insert(rows),`Échéancier créé : ${rows.length} versement${rows.length>1?"s":""}`);
  };
  submit.validate=f=>!compteIdFromLabel(f.compte_label)?["compte_label","Choisissez le client dans la liste."]:(e=>e?["total",e]:null)(planErreur(f.total,f.nb,f.acompte));
  modal("Nouvel échéancier",h,submit,"Créer l’échéancier");
  const fillDevis=()=>{ const id=compteIdFromLabel($("#m-compte").value); const ds=state.devis.filter(x=>x.compte_id===id);
    $("#m-devis").innerHTML=`<option value="">Aucun</option>`+ds.map(x=>`<option value="${x.id}" ${dv&&x.id===dv.id?"selected":""}>${esc(devisNum(x))} · ${mad(devisTTC(x))} MAD TTC</option>`).join(""); };
  const prev=()=>{ const v=lire(), e=planErreur(v.total,v.n,v.ac); $("#m-plan").innerHTML=e?`<p class="hint">${esc(e)}</p>`:planHtml(planPaiement(v.total,v.n,v.deb,v.ac),v.mode); };
  fillDevis(); prev();
  $("#m-compte").addEventListener("change",()=>{ fillDevis(); });
  $("#m-devis").addEventListener("change",e=>{ const x=byId(state.devis,e.target.value); if(x){ $("#m-total").value=devisTTC(x); if(x.paiement_nb) $("#m-nb").value=x.paiement_nb; if(x.paiement_acompte_mad!=null) $("#m-ac").value=x.paiement_acompte_mad; if(x.paiement_debut) $("#m-deb").value=x.paiement_debut; } prev(); });
  ["#m-total","#m-nb","#m-ac","#m-deb","#m-mode"].forEach(s=>$(s).addEventListener("input",prev));
}

function formPaiement(p){
  const c=byId(state.comptes,p.compte_id);
  const h=`<p style="margin-top:0"><b>${esc(c?c.nom:"")}</b> · ${PAY_MODES[p.mode]} ${p.rang}/${p.nb}${p.devis_id?` · devis ${esc(devisNum(byId(state.devis,p.devis_id)||{}))}`:""}</p><div class="form-grid">
   ${fld("m-mode","Mode",`<select id="m-mode" name="mode">${opt(Object.entries(PAY_MODES),p.mode)}</select>`)}
   ${fld("m-stat","Statut",`<select id="m-stat" name="statut">${opt(Object.entries(PAY_STATUTS),p.statut)}</select>`)}
   ${fld("m-mt","Montant (MAD)",`<input id="m-mt" name="montant" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(p.montant_mad)}">`)}
   ${fld("m-date","Échéance",`<input id="m-date" name="date" type="date" value="${esc(p.date_echeance)}">`)}
   ${fld("m-num","N° de chèque / référence",`<input id="m-num" name="numero" autocomplete="off" value="${esc(p.numero||"")}">`)}
   ${fld("m-banque","Banque",`<input id="m-banque" name="banque" autocomplete="off" value="${esc(p.banque||"")}">`)}
   ${fld("m-tit","Tireur / titulaire",`<input id="m-tit" name="titulaire" autocomplete="off" value="${esc(p.titulaire||"")}">`)}
   ${fld("m-enc","Encaissé le",`<input id="m-enc" name="encaisse_le" type="date" value="${esc(p.encaisse_le||"")}">`)}
   ${fld("m-notes","Notes",`<textarea id="m-notes" name="notes">${esc(p.notes||"")}</textarea>`,true)}</div>
   ${p.nb>1?`<p class="hint">Changer le montant d’un versement ne recalcule pas les autres : vérifiez que le total de l’échéancier reste juste.</p>`:""}`;
  const submit=async f=>{ const statut=sEnum(f.statut,Object.keys(PAY_STATUTS))||p.statut;
    return write(upd("paiements",p.id,{mode:sEnum(f.mode,Object.keys(PAY_MODES))||p.mode,statut,montant_mad:sNum(f.montant)??p.montant_mad,date_echeance:sDate(f.date)||p.date_echeance,
      numero:sTxt(f.numero),banque:sTxt(f.banque),titulaire:sTxt(f.titulaire),notes:sTxt(f.notes),encaisse_le:statut==="encaisse"?(sDate(f.encaisse_le)||localISO()):sDate(f.encaisse_le)}),"Paiement mis à jour"); };
  modal(`${PAY_MODES[p.mode]} ${p.rang}/${p.nb} · ${mad2(p.montant_mad)} MAD`,h,submit,"Enregistrer");
}

let payFilt={statut:"",q:"",com:"",mois:""};
function viewPaiements(v){
  const today=localISO(), q=strip(payFilt.q), mineOnly=!estPilote();
  const base=state.paiements.filter(p=>!mineOnly||!me||p.commercial_id===me.id||p.createur_id===me.id);
  const enRetard=p=>["a_recevoir","recu"].includes(p.statut)&&p.date_echeance<today;
  const list=base.filter(p=>{ const c=byId(state.comptes,p.compte_id);
    if(payFilt.statut==="retard"?!enRetard(p):payFilt.statut==="ouverts"?["encaisse"].includes(p.statut):payFilt.statut&&p.statut!==payFilt.statut) return false;
    if(payFilt.com&&p.commercial_id!==payFilt.com) return false;
    if(payFilt.mois&&String(p.date_echeance).slice(0,7)!==payFilt.mois) return false;
    return !q||strip([c&&c.nom,p.numero,p.banque,p.titulaire].filter(Boolean).join(" ")).includes(q); });
  const somme=a=>a.reduce((s,p)=>s+(+p.montant_mad||0),0);
  const mois=today.slice(0,7);
  const aEnc=base.filter(p=>!["encaisse","impaye"].includes(p.statut));
  const ceMois=aEnc.filter(p=>String(p.date_echeance).slice(0,7)===mois), retard=base.filter(enRetard), imp=base.filter(p=>p.statut==="impaye"), encM=base.filter(p=>p.statut==="encaisse"&&String(p.encaisse_le||"").slice(0,7)===mois);
  const moisOpts=[...new Set(base.map(p=>String(p.date_echeance).slice(0,7)))].sort();
  const k=(lab,val,sub,f)=>`<button class="kpi" data-act="pay-f" data-f="${f}" style="text-align:left;cursor:pointer;font:inherit;color:inherit" aria-pressed="${!!f&&payFilt.statut===f}"><div class="lab">${lab}</div><div class="val">${madShort(val)}<small>MAD</small></div><div class="sub">${sub}</div></button>`;
  v.innerHTML=`<div class="section-head"><div><h2>Paiements</h2><p class="hint">Chèques, virements et effets : échéancier et encaissement${mineOnly?" de vos clients":""}</p></div>
    <div class="tools"><button class="btn" data-act="pay-xlsx" ${list.length?"":"disabled"}>Exporter Excel</button><button class="btn primary" data-act="new-echeancier" ${state.comptes.length?"":"disabled"}>+ Échéancier</button></div></div>
  <div class="kpis" style="padding-top:0">
    ${k("À encaisser ce mois",somme(ceMois),`${ceMois.length} versement${ceMois.length>1?"s":""}`,"")}
    ${k("En retard",somme(retard),`${retard.length} échéance${retard.length>1?"s":""} dépassée${retard.length>1?"s":""}`,"retard")}
    ${k("Impayés",somme(imp),`${imp.length} rejet${imp.length>1?"s":""}`,"impaye")}
    ${k("Encaissé ce mois",somme(encM),`${encM.length} versement${encM.length>1?"s":""}`,"encaisse")}
  </div>
  <div class="panel">
    <div class="filters" style="margin-bottom:12px">
      <input id="pf-q" type="search" placeholder="Client, n° de chèque, banque…" value="${esc(payFilt.q)}" aria-label="Rechercher" autocomplete="off" spellcheck="false">
      <select id="pf-stat" aria-label="Statut"><option value="">Tous les statuts</option><option value="retard" ${payFilt.statut==="retard"?"selected":""}>En retard</option>${Object.entries(PAY_STATUTS).map(([s,l])=>`<option value="${s}" ${payFilt.statut===s?"selected":""}>${l}</option>`).join("")}</select>
      <select id="pf-mois" aria-label="Mois d’échéance"><option value="">Tous les mois</option>${moisOpts.map(m=>`<option value="${m}" ${payFilt.mois===m?"selected":""}>${new Date(m+"-01T12:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</option>`).join("")}</select>
      ${estPilote()?`<select id="pf-com" aria-label="Commercial"><option value="">Tous les commerciaux</option>${state.equipe.filter(e=>base.some(p=>p.commercial_id===e.id)).map(e=>`<option value="${e.id}" ${payFilt.com===e.id?"selected":""}>${esc(e.nom)}</option>`).join("")}</select>`:""}
    </div>
    <p class="hint" aria-live="polite" style="margin:0 0 8px">${list.length} versement${list.length>1?"s":""} · ${mad2(somme(list))} MAD</p>
    ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Échéance</th><th>Client</th><th>Versement</th><th>N° / banque</th><th class="num">Montant MAD</th><th>Statut</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
    ${list.map(p=>{ const c=byId(state.comptes,p.compte_id), d=byId(state.devis,p.devis_id), late=enRetard(p);
      return `<tr><td style="white-space:nowrap">${new Date(p.date_echeance+"T12:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"})}${late?` <span class="pill bad">retard</span>`:""}</td>
        <td>${c?`<button class="linkish" data-act="open-compte" data-id="${c.id}"><b>${esc(c.nom)}</b></button>`:"—"}<div class="hint" style="margin:0">${esc([d&&devisNum(d),estPilote()&&p.commercial_id?nomMembre(p.commercial_id):""].filter(Boolean).join(" · "))}</div></td>
        <td style="white-space:nowrap">${PAY_MODES[p.mode]} ${p.rang}/${p.nb}</td><td>${esc([p.numero,p.banque].filter(Boolean).join(" · ")||"—")}</td>
        <td class="num">${mad2(p.montant_mad)}</td>
        <td><select data-pstat="${p.id}" class="dstat ${PAY_PILL[p.statut]||""}" aria-label="Statut du versement ${p.rang}/${p.nb}">${Object.entries(PAY_STATUTS).map(([s,l])=>`<option value="${s}" ${p.statut===s?"selected":""}>${l}</option>`).join("")}</select></td>
        <td><button class="btn small" data-act="edit-paiement" data-id="${p.id}">Détails</button></td></tr>`; }).join("")}

    try{
      const prog=(d,t)=>{ $("#imp-bar").style.width=Math.round(d*100/t)+"%"; $("#imp-msg").textContent=`Import en cours… ${nf.format(d)} / ${nf.format(t)}`; };
      if(plan.kind==="export"){
        const res=await CRMImport.runExportCommercial(sb,plan,prog);
        busy=false; importBusy=false; $("#imp-msg").textContent=`Terminé : ${nf.format(res.contacts)} contacts, ${nf.format(res.opps)} opportunités, ${nf.format(res.acts)} activités et ${res.devis} devis ajoutés${res.devisSansClient?` (${res.devisSansClient} devis sans client retrouvé)`:""}.`;
      } else if(plan.kind==="opportunites"){
        const res=await CRMImport.runOpportunites(sb,plan,prog);
        busy=false; importBusy=false; $("#imp-msg").textContent=`Terminé : ${nf.format(res.opps)} opportunités créées${res.oppsDeja?`, ${nf.format(res.oppsDeja)} déjà présentes`:""}, ${nf.format(res.comptes)} nouveaux comptes, ${res.devis} devis${res.membres?`, ${res.membres} commerciaux ajoutés`:""}.`;
      } else {
      const res=await CRMImport.run(sb,plan,prog);
      busy=false; importBusy=false; $("#imp-msg").textContent=`Terminé : ${nf.format(res.created)} comptes créés${res.already?`, ${nf.format(res.already)} déjà présents`:""}${res.newMembers?`, ${res.newMembers} commerciaux ajoutés`:""}.`;
      }
      go.removeAttribute("aria-busy"); go.textContent="Importé"; toast("Import terminé"); await load();
    }catch(err){
      busy=false; importBusy=false; go.removeAttribute("aria-busy"); go.disabled=false; go.textContent="Reprendre l’import";
      const [t,d]=errorCopy(err); $("#imp-msg").textContent=`${t} — ${d} Ce qui est déjà importé est conservé ; « Reprendre l’import » complète sans doublons.`;
    }
  });
}

/* ---- Auth ---- */
function showLogin(msg){
  document.body.classList.add("auth");
  $("#auth-slot").innerHTML=`<div class="login"><form class="modal" id="login-form" novalidate style="max-width:420px" aria-labelledby="login-title">
    <div style="text-align:center;margin-bottom:18px"><h2 class="wordmark" id="login-title" translate="no" style="font-family:var(--f-mark);font-size:28px;font-weight:400;font-stretch:normal;letter-spacing:.22em;text-transform:none;line-height:1">CELLULIFT</h2><div class="tagline" style="margin-top:6px">CRM commercial · Accès équipe</div></div>
    <div class="form-grid" style="grid-template-columns:1fr">
      ${fld("l-mail","Email professionnel",`<input id="l-mail" name="email" type="email" autocomplete="username" spellcheck="false" required placeholder="prenom@cellulift.ma…">`)}
      ${fld("l-pw","Mot de passe",`<input id="l-pw" name="password" type="password" autocomplete="current-password" required minlength="8">`)}
    </div>
    <div id="l-err" class="hint" aria-live="polite" style="color:var(--bad);margin-top:10px">${esc(msg||"")}</div>
    <div class="form-actions" style="justify-content:space-between"><button type="button" class="btn" id="l-signup">Première connexion</button><button type="submit" class="btn primary" id="l-go">Se connecter</button></div>
    <p class="hint" style="margin-top:14px">Première connexion : saisissez l’email que votre superviseur a enregistré et choisissez un mot de passe (8 caractères minimum), puis cliquez sur « Première connexion ».</p>
  </form></div>`;
  const go=async(signup)=>{
    const email=$("#l-mail").value.trim().toLowerCase(), password=$("#l-pw").value;
    if(!email||password.length<8){ $("#l-err").textContent="Email et mot de passe de 8 caractères minimum requis."; return; }
    $("#l-go").disabled=$("#l-signup").disabled=true; $("#l-err").textContent="";
    let r = signup ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
    if(signup && !r.error && !r.data.session) r = await sb.auth.signInWithPassword({email,password});
    $("#l-go").disabled=$("#l-signup").disabled=false;
    if(r.error){
      const m=r.error.message||"";
      $("#l-err").textContent = /Invalid login/i.test(m)?"Email ou mot de passe incorrect. Première connexion ? Utilisez le bouton de gauche."
        : /already registered/i.test(m)?"Ce compte existe déjà : utilisez « Se connecter »."
        : /not confirmed/i.test(m)?"Cet email n’est pas enregistré dans l’équipe. Demandez à votre superviseur de vous ajouter."
        : m;
    }
  };
  $("#login-form").addEventListener("submit",e=>{e.preventDefault();go(false);});
  $("#l-signup").addEventListener("click",()=>go(true));
  $("#l-mail").focus();
}
function showNoAccess(){
  setStatus("bad","Accès refusé");
  $("#view").innerHTML=`<div class="panel empty"><h3>Compte non autorisé</h3><p>${esc(currentUser.email)} n’est pas enregistré dans l’équipe Cellulift, ou le compte est désactivé. Demandez à votre superviseur de vous ajouter.</p></div>`;
  $("#kpis").innerHTML="";
}
function enterApp(session){
  currentUser=session.user;
  document.body.classList.remove("auth"); $("#auth-slot").innerHTML="";
  $("#who").textContent=currentUser.email;
  render(); load();
}
$("#logout").addEventListener("click",async()=>{ await sb.auth.signOut(); });
let booted=false;
sb.auth.onAuthStateChange((event,session)=>{
  if(session && (!booted || event==="SIGNED_IN") && (!currentUser || currentUser.id!==session.user.id)){ booted=true; enterApp(session); }
  else if(!session){ booted=true; currentUser=null; me=null; loaded=false; showLogin(); }
});
})();
</script>
</body>
</html>

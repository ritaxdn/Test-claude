<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adjugé Live</title>
<style>
/* Layout : une appli de ventes en direct façon live shopping. Un fil de lives, puis une salle :
   la scène verticale au centre (visite filmée + carte du lot), les lots à gauche, le chat à droite.
   Autour : studio de l'agent, suivi « Mes victoires », dossier du bien et calculateur en feuilles. */
:root {
  --bg: #e9ecf7;
  --blob-1: #6f83ff;
  --blob-2: #ffc46b;
  --blob-3: #ff8f7a;
  --blob-4: #6fd6c5;
  --surface: rgb(255 255 255 / .55);
  --surface-strong: rgb(255 255 255 / .86);
  --glass-border: rgb(255 255 255 / .75);
  --ink: #141a3a;
  --muted: #4e5578;
  --line: rgb(20 26 58 / .12);
  --accent: #2c3fd1;
  --accent-ink: #ffffff;
  --accent-soft: rgb(44 63 209 / .12);
  --live: #ff3b5c;
  --saffron: #ffc46b;
  --good: #1f9d6b;
  --good-soft: rgb(31 157 107 / .14);
  --danger: #c0392b;
  --on-media: #ffffff;
  --media-glass: rgb(16 20 48 / .45);
  --shadow: 0 8px 32px rgb(31 38 100 / .12);
  --blur: 18px;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f26; --blob-1: #3346d6; --blob-2: #b8741a; --blob-3: #a2384a; --blob-4: #1d8a7c;
    --surface: rgb(255 255 255 / .07); --surface-strong: rgb(22 27 58 / .92); --glass-border: rgb(255 255 255 / .16);
    --ink: #eef0ff; --muted: #a9afd4; --line: rgb(255 255 255 / .12);
    --accent: #9aa8ff; --accent-ink: #0b0f26; --accent-soft: rgb(154 168 255 / .16);
    --good: #4fd39b; --good-soft: rgb(79 211 155 / .14); --danger: #ff8f80;
    --shadow: 0 8px 32px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f26; --blob-1: #3346d6; --blob-2: #b8741a; --blob-3: #a2384a; --blob-4: #1d8a7c;
  --surface: rgb(255 255 255 / .07); --surface-strong: rgb(22 27 58 / .92); --glass-border: rgb(255 255 255 / .16);
  --ink: #eef0ff; --muted: #a9afd4; --line: rgb(255 255 255 / .12);
  --accent: #9aa8ff; --accent-ink: #0b0f26; --accent-soft: rgb(154 168 255 / .16);
  --good: #4fd39b; --good-soft: rgb(79 211 155 / .14); --danger: #ff8f80;
  --shadow: 0 8px 32px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: -10vmax; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38vmax 38vmax at 12% 8%, var(--blob-1), transparent 70%),
    radial-gradient(34vmax 34vmax at 92% 18%, var(--blob-2), transparent 70%),
    radial-gradient(40vmax 40vmax at 78% 92%, var(--blob-3), transparent 70%),
    radial-gradient(30vmax 30vmax at 8% 82%, var(--blob-4), transparent 70%);
  opacity: .75; filter: blur(30px); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] .big { letter-spacing: 0; }
h1 { font-size: clamp(1.8rem, 1.3rem + 2vw, 2.6rem); }
h2 { font-size: 1.3rem; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
[dir="rtl"] .label { letter-spacing: 0; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 20px; }
[dir="rtl"] .flip { transform: scaleX(-1); }

.glass { background: var(--surface); -webkit-backdrop-filter: blur(var(--blur)) saturate(160%); backdrop-filter: blur(var(--blur)) saturate(160%); border: 1px solid var(--glass-border); }
.media-glass { background: var(--media-glass); -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%); border: 1px solid rgb(255 255 255 / .18); color: var(--on-media); }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; border-width: 0 0 1px; }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 1.35rem; letter-spacing: -.02em; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px rgb(255 59 92 / .2); }
.brand small { font-weight: 400; font-size: .8rem; color: var(--muted); letter-spacing: 0; }
nav.main { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
nav.main a { text-decoration: none; padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 700; font-size: .92rem; white-space: nowrap; }
nav.main a:hover { color: var(--ink); background: var(--accent-soft); }
nav.main a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tools { display: flex; gap: 8px; align-items: center; }
.who { font-size: .85rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.who b { color: var(--ink); }
.kyc-ok { color: var(--good); font-weight: 700; font-size: .78rem; }
.round { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-weight: 700; font-size: .85rem; }
.badge-count { position: absolute; top: -4px; inset-inline-end: -4px; min-width: 18px; height: 18px; padding-inline: 4px; border-radius: 999px; background: var(--live); color: #fff; font-size: .68rem; display: grid; place-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .12s, background .2s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); border-color: var(--glass-border); color: var(--ink); }
.btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-small { padding: 6px 12px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }

main { padding-block: 28px 56px; }
main.room-mode { padding-block: 16px; }
.page { display: grid; gap: 28px; }
.page-head p { color: var(--muted); max-width: 60ch; margin-top: 8px; }

/* Formulaires */
.field { display: grid; gap: 6px; font-weight: 700; font-size: .86rem; min-width: 0; }
.field input, .field select, .field textarea, .inp { width: 100%; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--surface); padding: 10px 12px; font-weight: 400; min-width: 0; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); background: var(--surface-strong); }
.field .err, .err { color: var(--danger); font-size: .8rem; font-weight: 700; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.card { border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: .84rem; }
.check input { margin-top: 3px; }

/* Badges */
.live-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--live); color: #fff; font-weight: 700; font-size: .72rem; letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; }
.live-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
.viewers { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgb(0 0 0 / .4); color: var(--on-media); }
.tag { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.tag.mine { background: var(--saffron); color: #2a1a00; }
@keyframes pulse { 50% { opacity: .3; } }

/* Fil des lives */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.lives { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.show { position: relative; display: block; aspect-ratio: 9 / 14; max-width: 100%; border-radius: var(--radius); overflow: hidden; text-decoration: none; color: var(--on-media); box-shadow: var(--shadow); transition: transform .2s; }
.show:hover { transform: translateY(-3px); }
.show > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.show .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / .35), transparent 30%, transparent 45%, rgb(9 12 32 / .88)); }
.show .tl { position: absolute; top: 12px; inset-inline: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.show .info { position: absolute; inset-inline: 14px; bottom: 14px; display: grid; gap: 8px; }
.show .info h3 { font-size: 1.1rem; }
.host { display: flex; align-items: center; gap: 8px; font-size: .82rem; min-width: 0; }
.host b { display: block; }
.avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; color: #fff; border: 2px solid rgb(255 255 255 / .8); }
.show .now { font-size: .8rem; padding: 8px 10px; border-radius: 10px; }
.show .now b { display: block; font-size: .95rem; }
.upcoming { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.up { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: var(--radius); align-items: center; }
.thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; }
.thumb > svg { width: 100%; height: 100%; display: block; }
.up .body { display: grid; gap: 6px; min-width: 0; }
.up .when { color: var(--accent); font-weight: 700; font-size: .82rem; }
.up .row { display: flex; justify-content: flex-end; }
.remind[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; list-style: none; padding: 0; margin: 0; }
.how li { padding: 18px; border-radius: var(--radius); display: grid; gap: 6px; align-content: start; }
.empty { padding: 32px; border-radius: var(--radius); text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }

/* Salle */
.room { position: relative; display: grid; grid-template-columns: 270px minmax(0, 440px) 330px; justify-content: center; gap: 18px; height: min(860px, calc(100dvh - 110px)); min-height: 580px; }
.panel { border-radius: var(--radius); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.lots { list-style: none; margin: 0; padding: 8px; overflow: auto; display: grid; gap: 6px; align-content: start; }
.lots li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 12px; align-items: center; }
.lots li.current { background: var(--accent-soft); }
.mini { aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
.mini > svg { width: 100%; height: 100%; display: block; }
.lots strong { display: block; font-size: .86rem; line-height: 1.25; }
.lots small { font-size: .76rem; color: var(--muted); font-weight: 700; }
.lots small.sold { color: var(--good); }
.lots small.on { color: var(--live); }
.close-sheet { display: none; }

.stage { position: relative; border-radius: 24px; overflow: hidden; background: #10142e; color: var(--on-media); box-shadow: var(--shadow); isolation: isolate; }
.scene { position: absolute; inset: 0; z-index: -2; }
.scene > svg { width: 100%; height: 100%; display: block; animation: kenburns 9s ease-in-out infinite alternate; transform-origin: var(--ox, 50%) var(--oy, 60%); }
.scene.swap > svg { animation: fadein .7s ease-out, kenburns 9s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1.02); } to { transform: scale(1.14) translate(-2%, -1%); } }
@keyframes fadein { from { opacity: 0; filter: blur(6px); } }
.stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgb(0 0 0 / .45), transparent 22%, transparent 40%, rgb(9 12 32 / .92) 78%); pointer-events: none; }
.stage-top { position: absolute; top: 12px; inset-inline: 12px; display: flex; gap: 8px; align-items: center; }
.stage-top .host { flex: 1; padding: 4px 10px 4px 4px; border-radius: 999px; }
[dir="rtl"] .stage-top .host { padding: 4px 4px 4px 10px; }
.stage-top .host span span { font-size: .72rem; opacity: .8; }
.follow { margin-inline-start: auto; padding: 5px 10px; border-radius: 999px; border: 0; background: var(--on-media); color: #10142e; font-weight: 700; font-size: .75rem; cursor: pointer; }
.follow[aria-pressed="true"] { background: rgb(255 255 255 / .25); color: var(--on-media); }
.iconbtn { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }
.stage-meta { position: absolute; top: 60px; inset-inline: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tour { padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; cursor: pointer; }
.lots-toggle { display: none; }
.hostbar { position: absolute; top: 96px; inset-inline: 12px; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border-radius: 14px; align-items: center; z-index: 4; }
.hostbar b { font-size: .78rem; margin-inline-end: auto; }
.hostbar button { padding: 7px 12px; border-radius: 10px; border: 0; font-weight: 700; font-size: .8rem; cursor: pointer; background: var(--saffron); color: #2a1a00; }
.hostbar button.sec { background: rgb(255 255 255 / .18); color: var(--on-media); }
.hearts { position: absolute; inset-inline-end: 18px; bottom: 240px; width: 60px; height: 260px; pointer-events: none; }
.heart { position: absolute; bottom: 0; inset-inline-start: 18px; width: 26px; height: 26px; animation: floatup 2.6s ease-out forwards; }
@keyframes floatup { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx, 0px), -240px) scale(1.1); opacity: 0; } }

.lotcard { position: absolute; inset-inline: 12px; bottom: 12px; border-radius: 20px; padding: 14px; display: grid; gap: 10px; }
.lotcard .row1 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.lotcard h2 { font-size: 1.1rem; }
.lotcard .where { font-size: .8rem; opacity: .8; margin-top: 3px; }
.ring { position: relative; width: 56px; height: 56px; }
.ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: rgb(255 255 255 / .2); }
.ring .bar { stroke: var(--saffron); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .3s; }
.ring.hot .bar { stroke: var(--live); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .95rem; }
.pricebar { display: flex; justify-content: space-between; align-items: end; gap: 10px; }
.pricebar .big { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; line-height: 1; transition: color .3s, transform .3s; display: inline-block; }
.pricebar .big.bump { color: var(--saffron); transform: scale(1.06); }
.pricebar small { display: block; font-size: .75rem; opacity: .8; margin-bottom: 4px; }
.pricebar .topb { text-align: end; font-size: .82rem; display: grid; gap: 3px; justify-items: end; }
.pricebar .topb b { font-size: .95rem; }
.reserve { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgb(255 255 255 / .14); }
.reserve.ok { background: var(--good); color: #fff; }
.autochip { justify-self: start; font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgb(255 196 107 / .25); color: var(--saffron); }
.slide { position: relative; height: 56px; border-radius: 999px; background: rgb(255 255 255 / .16); border: 1px solid rgb(255 255 255 / .25); overflow: hidden; user-select: none; touch-action: none; }
.slide .fill { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; background: linear-gradient(90deg, var(--saffron), #ff9a4d); opacity: .9; }
.slide .txt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: .95rem; padding-inline: 56px 12px; text-align: center; line-height: 1.15; }
.slide .knob { position: absolute; top: 4px; inset-inline-start: 4px; width: 48px; height: 46px; border-radius: 999px; border: 0; background: var(--saffron); color: #2a1a00; display: grid; place-items: center; cursor: grab; box-shadow: 0 4px 14px rgb(0 0 0 / .3); }
.slide.disabled { opacity: .7; }
.slide.disabled .knob { cursor: not-allowed; background: rgb(255 255 255 / .4); }
.slide.lead { background: rgb(31 157 107 / .5); border-color: rgb(79 211 155 / .6); }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.actions button { padding: 8px 6px; border-radius: 12px; border: 1px solid rgb(255 255 255 / .22); background: rgb(255 255 255 / .1); color: var(--on-media); font-weight: 700; font-size: .78rem; cursor: pointer; line-height: 1.2; }
.actions button:hover { background: rgb(255 255 255 / .18); }
.actions button[aria-pressed="true"] { background: rgb(255 196 107 / .3); border-color: var(--saffron); }
.custom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.custom input { border-radius: 12px; border: 1px solid rgb(255 255 255 / .3); background: rgb(255 255 255 / .12); color: var(--on-media); padding: 10px 12px; min-width: 0; }
.custom input::placeholder { color: rgb(255 255 255 / .6); }
.custom-err { font-size: .78rem; color: #ffd0c8; }
.phase-note { font-size: .85rem; padding: 10px 12px; border-radius: 12px; background: rgb(255 255 255 / .12); }
.bidders { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .84rem; }
.bidders li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 10px; background: rgb(255 255 255 / .08); }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: rgb(9 12 32 / .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 3; }
.overlay .box { display: grid; gap: 10px; justify-items: center; max-width: 320px; }
.stamp { font-size: 2.6rem; font-weight: 700; padding: 6px 18px; border: 4px solid var(--saffron); color: var(--saffron); border-radius: 12px; transform: rotate(-4deg); animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1); }
.stamp.no { border-color: rgb(255 255 255 / .6); color: rgb(255 255 255 / .85); font-size: 1.8rem; }
.stamp.win { border-color: var(--good); color: #7ff0bd; }
@keyframes stamp { from { transform: rotate(-4deg) scale(2); opacity: 0; } }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -10px; width: 8px; height: 14px; border-radius: 2px; animation: fall 2.4s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

.chat { border-radius: var(--radius); }
.msgs { list-style: none; margin: 0; padding: 10px 14px; overflow: auto; display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
.msgs li { line-height: 1.35; overflow-wrap: anywhere; animation: msgin .25s ease-out; }
.msgs li b { margin-inline-end: 5px; }
.msgs li.sys { font-size: .8rem; color: var(--muted); }
.msgs li.bid { font-weight: 700; color: var(--accent); }
.msgs li.from-host b::after { content: attr(data-host); margin-inline-start: 6px; font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--live); color: #fff; vertical-align: 2px; }
.msgs li.me b { color: var(--accent); }
@keyframes msgin { from { opacity: 0; transform: translateY(6px); } }
.chat form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chat input { border-radius: 999px; border: 1px solid var(--glass-border); background: var(--surface); padding: 9px 14px; min-width: 0; }
.chat input:focus { outline: none; border-color: var(--accent); }

/* Feuilles modales */
.sheet-back { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgb(11 15 38 / .4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sheet { width: min(460px, 100%); max-height: calc(100dvh - 32px); overflow: auto; border-radius: 22px; padding: 22px; display: grid; gap: 14px; background: var(--surface-strong); align-content: start; }
.sheet.wide { width: min(720px, 100%); }
.sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.tabs button { padding: 7px 12px; border-radius: 999px; border: 1px solid transparent; background: none; font-weight: 700; font-size: .86rem; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.facts div { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--glass-border); display: grid; gap: 2px; }
.facts span { font-size: .75rem; color: var(--muted); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.gallery figure { margin: 0; display: grid; gap: 4px; font-size: .8rem; font-weight: 700; text-align: center; }
.gallery .ph { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; }
.gallery .ph > svg { width: 100%; height: 100%; display: block; }
.plan { width: 100%; max-width: 100%; height: auto; color: var(--ink); }
.docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.docs li { border-radius: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--glass-border); display: grid; gap: 8px; }
.docs .dh { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ok-pill { font-size: .72rem; font-weight: 700; color: var(--good); background: var(--good-soft); padding: 3px 8px; border-radius: 999px; }
.docview { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: .86rem; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); }
.docview dt { color: var(--muted); }
.docview dd { margin: 0; font-weight: 700; }
.calc { display: grid; gap: 14px; }
.costs { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; margin: 0; font-size: .9rem; }
.costs dd { margin: 0; text-align: end; font-weight: 700; }
.costs .total { padding-top: 8px; border-top: 1px solid var(--line); font-size: 1.05rem; }
.loan { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--glass-border); }
.loan input[type="range"] { width: 100%; accent-color: var(--accent); }
.monthly { font-size: 1.8rem; font-weight: 700; }

/* Notifications */
.notifs { position: fixed; z-index: 35; top: calc(env(safe-area-inset-top, 0px) + 66px); inset-inline-end: 16px; width: min(360px, calc(100% - 32px)); max-height: 70dvh; overflow: auto; border-radius: 18px; padding: 12px; display: grid; gap: 8px; background: var(--surface-strong); box-shadow: var(--shadow); }
.notifs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.notifs li { padding: 10px 12px; border-radius: 12px; font-size: .86rem; display: grid; gap: 2px; }
.notifs li.unread { background: var(--accent-soft); }
.notifs li small { color: var(--muted); font-size: .74rem; }

/* Mes victoires */
.wins { display: grid; gap: 16px; }
.win { border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; }
.win .thumb { aspect-ratio: 3 / 4; }
.win-body { display: grid; gap: 12px; min-width: 0; align-content: start; }
.win-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding-bottom: 12px; position: relative; }
.steps li::before { content: ""; position: absolute; inset-inline-start: 12px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; border: 2px solid var(--line); background: var(--surface); }
.steps li.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.steps li.now .dot { border-color: var(--accent); color: var(--accent); }
.steps li.done::before { background: var(--good); }
.steps b { display: block; font-size: .92rem; }
.steps p { font-size: .84rem; color: var(--muted); }
.steps .btn { margin-top: 8px; }

/* Studio */
.studio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.mylives { display: grid; gap: 10px; }
.mylive { border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.mylive .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.lotlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lotlist li { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--glass-border); }
.lotlist small { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: .88rem; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
footer { border-top: 1px solid var(--glass-border); padding-block: 20px; color: var(--muted); font-size: .8rem; }

@media (max-width: 1100px) {
  .room { grid-template-columns: minmax(0, 440px) 320px; }
  .room > .lots-panel { display: none; }
  .room > .lots-panel.open { display: grid; position: fixed; z-index: 30; inset-inline: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-height: 70dvh; background: var(--surface-strong); box-shadow: var(--shadow); }
  .lots-panel .close-sheet { display: inline-flex; }
  .lots-toggle { display: inline-flex; }
}

}
@media (max-width: 760px) {

  .room > .chat .panel-head { display: none; }
  .room > .chat .msgs { padding: 0 4px; color: var(--on-media); font-size: .84rem; text-shadow: 0 1px 3px rgb(0 0 0 / .7); mask-image: linear-gradient(transparent, #000 30%); -webkit-mask-image: linear-gradient(transparent, #000 30%); pointer-events: auto; }
  .room > .chat .msgs li.sys { color: rgb(255 255 255 / .75); }
  .room > .chat .msgs li.bid, .room > .chat .msgs li.me b { color: var(--saffron); }
  .room > .chat form { border: 0; padding: 6px 0 0; pointer-events: auto; }
  .room > .chat input { background: rgb(0 0 0 / .35); border-color: rgb(255 255 255 / .25); color: var(--on-media); }
  .room > .chat input::placeholder { color: rgb(255 255 255 / .65); }
  .room > .chat .btn { display: none; }
  .lotcard { padding: 12px; gap: 8px; inset-inline: 8px; bottom: 8px; }
  .lotcard h2 { font-size: 1rem; }
  .lotcard .where { display: none; }
  .ring, .ring svg { width: 48px; height: 48px; }
  .pricebar .big { font-size: 1.4rem; }
  .slide { height: 52px; }
  .slide .knob { height: 42px; width: 46px; }
  .win { grid-template-columns: 72px minmax(0, 1fr); gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Plan schématique ---------- */
function planSVG(lot) {
  const S = lot.surface, room = (x, y, w, h, label, share) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--accent-soft)" stroke="currentColor" stroke-width="2"/><text x="${x + w / 2}" y="${y + h / 2 - 2}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${esc(label)}</text>${share ? `<text x="${x + w / 2}" y="${y + h / 2 + 14}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">≈ ${Math.round(S * share)} m²</text>` : ""}`;
  let g = "";
  if (lot.type === "terrain") {
    const side = Math.round(Math.sqrt(S));
    g = `<polygon points="40,30 300,20 320,200 30,210" fill="var(--accent-soft)" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><text x="170" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${esc(t("pTerrain"))} · ${numFmt.format(S)} m²</text><text x="170" y="16" text-anchor="middle" font-size="11" fill="currentColor">≈ ${side} m</text><text x="12" y="120" font-size="11" fill="currentColor" transform="rotate(-90 12 120)">≈ ${side} m</text>`;
  } else if (lot.type === "local") {
    g = room(10, 10, 230, 210, t("pPlateau"), 0.75) + room(240, 10, 90, 130, t("pReserve"), 0.17) + room(240, 140, 90, 80, t("pWc"), 0.08);
  } else if (lot.type === "riad") {
    const beds = Math.max(1, lot.bedrooms);
    g = room(10, 10, 200, 60, t("pSalon"), 0.18) + room(210, 10, 120, 60, t("pCuisine"), 0.08) + room(10, 70, 100, 100, `${t("pChambre")} 1`, 0.1) + room(230, 70, 100, 100, t("pSdb"), 0.06) + room(110, 70, 120, 100, t("pPatio"), 0.2);
    const rest = beds - 1, w = rest ? 320 / rest : 320;
    for (let i = 0; i < rest; i++) g += room(10 + i * w, 170, w, 50, `${t("pChambre")} ${i + 2}`, 0.38 / Math.max(1, rest));
  } else {
    const beds = Math.max(1, lot.bedrooms), cols = beds <= 2 ? 1 : 2, rows = Math.ceil(beds / cols), cw = 170 / cols, ch = 210 / rows;
    g = room(10, 10, 150, 130, t("pSalon"), 0.3) + room(10, 140, 80, 80, t("pCuisine"), 0.1) + room(90, 140, 70, 80, t("pSdb"), 0.08);
    for (let i = 0; i < beds; i++) g += room(160 + (i % cols) * cw, 10 + Math.floor(i / cols) * ch, cw, ch, `${t("pChambre")} ${i + 1}`, 0.52 / beds);
  }
  return `<svg class="plan" viewBox="0 0 340 230" role="img" aria-label="${esc(t("tPlan"))}">${g}</svg>`;
}

function onboard(then) {

    </form>`);

    if (!/^[a-z0-9._]{3,24}$/i.test(handle)) return fail("errHandle");

    if (!$("ob-dep").checked) return fail("errDep");
    const btn = $("ob-go"); btn.disabled = true; btn.textContent = t("obVerifying");

/* ====================================================================

const INTRO = 12 * SEC, BIDDING = 30 * SEC, RESET = 10 * SEC, RESULT = 6 * SEC;
let R = null;
const lot = () => R.show.lots[R.idx];
const top = () => R.bids[R.bids.length - 1];
const minBid = () => top() ? top().amount + lot().inc : lot().start;
const reserveMet = () => !!top() && top().amount >= lot().reserve;

function viewRoom(app, id, host, keep) {
  const show = allShows().find((s) => s.id === id && s.live);
  if (!show || (host && !prefs.myShows.includes(show))) {
    app.innerHTML = `<div class="empty glass"><h2>${esc(t("notLive"))}</h2><p>${esc(t("notLiveP"))}</p><a class="btn btn-primary" href="#lives">${esc(t("seeLives"))}</a></div>`; return;
  }

  const reuse = keep && R && R.show.id === id && R.host === host;
  const oldMsgs = reuse ? $("msgs")?.innerHTML : "";
  if (!reuse) { leaveRoom(); R = { show, host, idx: 0, phase: "intro", phaseEnd: 0, bids: [], results: [], tour: 0, viewers: show.viewers, timers: [], warned: false, rivalMax: 0, auto: null, custom: false }; }
  buildRoomShell(app);
  if (reuse) { $("msgs").innerHTML = oldMsgs; showScene(); renderLots(); renderCard(); renderOverlay(); return; }
  chat("", t("welcome", { n: show.host.name }), "sys");
  for (let i = 0; i < 3; i++) chat(`@${pick(HANDLES)}`, pick(CHAT_POOL[lang]));
  startLot();
  R.timers.push(setInterval(tick, 250));
  R.timers.push(setInterval(ambient, 2600));
  window.addEventListener("resize", placeChat);
}

function later(fn, ms) { if (!R) return; const tm = setTimeout(() => R && fn(), ms); R.timers.push(tm); }
function leaveRoom() { if (!R) return; R.timers.forEach((x) => { clearInterval(x); clearTimeout(x); }); R = null; window.removeEventListener("resize", placeChat); }

function startLot() {
  const l = lot();
  Object.assign(R, { phase: "intro", phaseEnd: R.host ? Infinity : Date.now() + INTRO, bids: [], tour: 0, warned: false, custom: false, auto: null, autoWait: false });
  R.rivalMax = Math.round(l.reserve * rand(0.96, 1.12) / l.inc) * l.inc;
  showScene(); renderLots(); renderCard(); renderOverlay();
  chat("", t("lotAnnounce", { i: R.idx + 1, n: R.show.lots.length, t: lt(l, "title") }), "sys");
  (lt(l, "pitch") || []).forEach((line, i) => later(() => chat(R.show.host.name, line, "from-host"), 600 + i * 3400));
}
function openBidding() {
  R.phase = "bidding"; R.phaseEnd = Date.now() + BIDDING;
  chat(R.show.host.name, t("openMsg", { p: dh(lot().start), s: dh(lot().inc) }), "from-host");
  renderCard();
}
function closeLot() {
  const l = lot(), tp = top(), sold = reserveMet();
  R.phase = "result"; R.phaseEnd = R.host ? Infinity : Date.now() + RESULT;
  R.results[R.idx] = { sold, amount: tp?.amount, by: tp?.by };

    const dl = b.closest("li").querySelector("dl"); dl.hidden = !dl.hidden; b.textContent = t(dl.hidden ? "view" : "hide");
  }));
}
function costHTML(l, price) {
  return `<div class="calc">
    <label class="field">${esc(t("cPrice"))}<input class="num" id="c-price" inputmode="numeric" value="${price}" dir="ltr"></label>
    ${R && R.show.lots.includes(l) ? `<button class="linkbtn" type="button" id="c-cur" style="justify-self:start">${esc(t("cUseCurrent"))}</button>` : ""}
    <dl class="costs num" id="c-costs"></dl>
    <div class="loan"><b>${esc(t("cLoan"))}</b>
      <label class="field"><span id="c-down-l"></span><input type="range" id="c-down" min="10" max="100" step="5" value="30"></label>
      <label class="field"><span id="c-years-l"></span><input type="range" id="c-years" min="5" max="25" step="1" value="20"></label>
      <label class="field">${esc(t("cRate"))}<input class="num" id="c-rate" inputmode="decimal" value="4,5" dir="ltr"></label>
      <dl class="costs num" id="c-loan"></dl>
    </div>
    <p class="muted" style="font-size:.78rem">${esc(t("cNote"))}</p></div>`;
}
function wireCost(body, l) {
  const upd = () => {
    const p = Math.max(0, parseAmount(body.querySelector("#c-price").value) || 0);
    const c = costEstimate(p), down = +body.querySelector("#c-down").value, years = +body.querySelector("#c-years").value;
    const rate = Math.max(0, parseFloat(body.querySelector("#c-rate").value.replace(",", ".")) || 0);
    const loan = loanEstimate(p, down, years, rate);
    body.querySelector("#c-costs").innerHTML = [["cReg", c.reg], ["cCons", c.cons], ["cNot", c.notary], ["cMisc", c.misc]].map(([k, v]) => `<dt>${esc(t(k))}</dt><dd>${dh(v)}</dd>`).join("") + `<dt class="total"><b>${esc(t("cTotal"))}</b></dt><dd class="total">${dh(c.total)}</dd>`;
    body.querySelector("#c-down-l").textContent = t("cDown", { x: down });
    body.querySelector("#c-years-l").textContent = t("cYears", { x: years });
    body.querySelector("#c-loan").innerHTML = `<dt>${esc(t("cBorrow"))}</dt><dd>${dh(loan.borrow)}</dd><dt>${esc(t("cCash"))}</dt><dd>${dh(loan.cash)}</dd><dt class="total"><b>${esc(t("cMonthly"))}</b></dt><dd class="total monthly">${dh(loan.monthly)}</dd>`;
  };
  body.querySelectorAll("input").forEach((i) => i.addEventListener("input", upd));
  body.querySelector("#c-cur")?.addEventListener("click", () => { body.querySelector("#c-price").value = top()?.amount ?? l.start; upd(); });
  upd();
}

/* ====================================================================
   Mes victoires : suivi jusqu'à la remise des clés
   ==================================================================== */
function viewWins(app) {
  const steps = (w) => [0, 1, 2, 3, 4].map((i) => {
    const state = i < w.step ? "done" : i === w.step ? "now" : "";
    const desc = t(`s${i}d`, { p: dh(Math.round(w.lot.start * 0.1)), d: dateFmt(w.at + 30 * DAY, { weekday: "long", day: "numeric", month: "long" }) });
    return `<li class="${state}"><span class="dot">${i < w.step ? "✓" : i + 1}</span><div><b>${esc(t(`s${i}`))}</b><p>${esc(desc)}</p>${i === w.step ? `<button class="btn btn-primary btn-small" type="button" data-step="${w.id}">${esc(t(`s${i}a`))}</button>` : ""}</div></li>`;
  }).join("");
  app.innerHTML = `<div class="page">
    <div class="page-head"><h1>${esc(t("wTitle"))}</h1><p>${esc(t("wLede"))}</p></div>
    ${prefs.wins.length ? `<div class="wins">${prefs.wins.map((w) => `
      <article class="win glass"><div class="thumb">${sceneSVG("facade", w.lot)}</div>
        <div class="win-body">
          <div class="win-top"><div><h2 style="font-size:1.15rem">${esc(lt(w.lot, "title"))}</h2><p class="muted" style="font-size:.86rem">${esc(place(w.lot.city))} · ${esc(resolve(w.showTitle))} ${w.demo ? `<span class="tag">${esc(t("demoFlag"))}</span>` : ""}</p></div>
            <div style="text-align:end"><b class="num" style="font-size:1.2rem">${esc(t("wPrice", { p: dh(w.amount) }))}</b><p class="muted num" style="font-size:.82rem">${esc(t("wTotal", { p: dh(costEstimate(w.amount).total) }))}</p></div></div>
          ${w.step >= 5 ? `<p class="ok-pill" style="justify-self:start;font-size:.9rem">🔑 ${esc(t("doneAll"))}</p>` : ""}
          <ol class="steps">${steps(w)}</ol>
          <button class="linkbtn" type="button" data-dossier="${w.id}" style="justify-self:start">${esc(t("wDossier"))}</button>
        </div></article>`).join("")}</div>`
    : `<div class="empty glass"><p>${esc(t("wEmpty"))}</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><a class="btn btn-primary" href="#lives">${esc(t("wGoLive"))}</a><button class="btn btn-ghost" type="button" id="demo-win">${esc(t("wDemo"))}</button></div></div>`}
  </div>`;
  $("demo-win")?.addEventListener("click", () => {
    const l = SHOWS[1].lots[0];
    prefs.wins.unshift({ id: `demo-${Date.now()}`, lot: { ...l }, showTitle: [SHOWS[1].title, SHOWS[1].title_ar], amount: 3160000, at: Date.now() - 2 * DAY, step: 1, demo: true }); save("wins");
    viewWins(app);
  });
  app.querySelectorAll("[data-dossier]").forEach((b) => b.addEventListener("click", () => { const w = prefs.wins.find((x) => x.id === b.dataset.dossier); openDossier(w.lot, "cost", w.amount); }));
  app.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
    const w = prefs.wins.find((x) => x.id === b.dataset.step);
    const advance = () => { w.step++; save("wins"); toast(t("stepDone")); viewWins(app); };
    if (w.step === 0) { b.disabled = true; b.textContent = t("s0wait"); setTimeout(advance, 1200); }
    else if (w.step === 1 && !prefs.user?.kyc?.verified) onboard(advance);
    else advance();
  }));
}

/* ====================================================================
   Studio de l'agent
   ==================================================================== */
let draftId = null;
function viewStudio(app) {
  const draft = prefs.myShows.find((s) => s.id === draftId && !s.live);
  app.innerHTML = `<div class="page">
    <div class="page-head"><p class="label" style="color:var(--accent)">${esc(t("hostMode"))}</p><h1>${esc(t("sTitle"))}</h1><p>${esc(t("sLede"))}</p></div>
    <div class="studio">
      <section class="card glass"><h2>${esc(t("sMyLives"))}</h2>
        ${prefs.myShows.length ? `<div class="mylives">${prefs.myShows.map((s) => `
          <div class="mylive glass"><div class="row"><b>${esc(s.title)}</b><span class="tag ${s.live ? "mine" : ""}">${esc(t(s.live ? "sLiveNow" : "sDraft"))}</span></div>
            <span class="muted" style="font-size:.84rem">${esc(t("lotsCount", { n: s.lots.length }))} · ${esc(s.city)}</span>
            <div class="row" style="justify-content:flex-start">
              ${s.live ? `<a class="btn btn-primary btn-small" href="#host-${s.id}">${esc(t("sResume"))}</a><a class="btn btn-ghost btn-small" href="#live-${s.id}">${esc(t("sViewer"))}</a>` : `<button class="btn btn-ghost btn-small" type="button" data-edit="${s.id}">${esc(t("sLots"))}</button>`}
              <button class="btn btn-danger btn-small" type="button" data-del="${s.id}">${esc(t("sDelete"))}</button>
            </div></div>`).join("")}</div>` : `<p class="muted">${esc(t("sNone"))}</p>`}
      </section>
      <section class="card glass" id="editor">${draft ? lotsEditorHTML(draft) : newShowHTML()}</section>
    </div></div>`;
  app.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => { draftId = b.dataset.edit; viewStudio(app); }));
  app.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.armed) { prefs.myShows = prefs.myShows.filter((s) => s.id !== b.dataset.del); save("myShows"); if (draftId === b.dataset.del) draftId = null; toast(t("sDeleted")); viewStudio(app); }
    else { b.dataset.armed = "1"; b.textContent = t("sConfirmDel"); }
  }));
  if (draft) wireLotsEditor(app, draft); else wireNewShow(app);
}
function newShowHTML() {
  return `<h2>${esc(t("sNew"))}</h2><form id="new-show" class="page" style="gap:12px" novalidate>
    <label class="field" data-f="title">${esc(t("sShowTitle"))}<input id="ns-title" maxlength="60"></label>
    <div class="cols">
      <label class="field" data-f="city">${esc(t("sCities"))}<input id="ns-city" maxlength="60" placeholder="Rabat · Salé"></label>
      <label class="field">${esc(t("sCat"))}<select id="ns-cat">${CATS.filter(Boolean).map((k) => `<option value="${k}">${esc(t("cat" + k))}</option>`).join("")}</select></label>
    </div>
    <div class="cols">
      <label class="field" data-f="name">${esc(t("sHostName"))}<input id="ns-name" maxlength="40"></label>
      <label class="field" data-f="agency">${esc(t("sAgency"))}<input id="ns-agency" maxlength="40"></label>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" type="submit">${esc(t("sCreate"))}</button><button class="btn btn-ghost" type="button" id="ns-ex">${esc(t("sExample"))}</button></div></form>`;
}
function fieldErrors(form, errs) {
  form.querySelectorAll(".field .err").forEach((e) => e.remove());
  Object.entries(errs).forEach(([k, msg]) => form.querySelector(`[data-f="${k}"]`)?.insertAdjacentHTML("beforeend", `<span class="err">${esc(msg)}</span>`));
  const first = Object.keys(errs)[0]; if (first) form.querySelector(`[data-f="${first}"] input, [data-f="${first}"] textarea`)?.focus();
  return !Object.keys(errs).length;
}
function wireNewShow(app) {
  const f = $("new-show");
  $("ns-ex").addEventListener("click", () => { $("ns-title").value = "Appartements neufs à Rabat"; $("ns-city").value = "Rabat · Agdal"; $("ns-cat").value = "appartement"; $("ns-name").value = "Ghita Lahlou"; $("ns-agency").value = "Agdal Immo"; });
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = (id) => $(id).value.trim(), errs = {};
    if (v("ns-title").length < 4) errs.title = t("errRequired");
    if (!v("ns-city")) errs.city = t("errRequired");
    if (v("ns-name").length < 2) errs.name = t("errRequired");
    if (!v("ns-agency")) errs.agency = t("errRequired");
    if (!fieldErrors(f, errs)) return;
    const s = { id: `mon-live-${Math.random().toString(36).slice(2, 7)}`, title: v("ns-title"), city: v("ns-city"), tags: [v("ns-cat")], live: false, viewers: Math.round(rand(150, 400)),
      host: { name: v("ns-name"), handle: me() || "agent.demo", agency: v("ns-agency"), hue: Math.floor(rand(0, 360)) }, lots: [] };
    prefs.myShows.unshift(s); save("myShows"); draftId = s.id; toast(t("sCreated")); viewStudio(app);
  });
}
function lotsEditorHTML(s) {
  const opt = Object.entries(t("types")).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  const fld = (f, id, label, attrs = "") => `<label class="field" data-f="${f}">${esc(t(label))}<input id="${id}" ${attrs}></label>`;
  return `<div class="row" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2>${esc(s.title)}</h2><button class="btn btn-primary" type="button" id="launch" ${s.lots.length ? "" : "disabled"}>${esc(t("sLaunch"))}</button></div>
    ${s.lots.length ? `<ul class="lotlist">${s.lots.map((l) => `<li><div class="mini">${sceneSVG("facade", l)}</div><div><b>${esc(l.title)}</b><br><small class="num">${esc(t("types")[l.type])} · ${esc(l.city)} · ${esc(t("startP"))} ${dh(l.start)}</small></div><button class="btn btn-ghost btn-small" type="button" data-rm="${l.id}">${esc(t("sRemoveLot"))}</button></li>`).join("")}</ul>` : `<p class="muted">${esc(t("sNoLots"))}</p>`}
    <form id="add-lot" class="page" style="gap:12px;border-top:1px solid var(--line);padding-top:14px" novalidate>
      <h3>${esc(t("sAddTitle"))}</h3>
      ${fld("title", "al-title", "lTitle", 'maxlength="70"')}
      <div class="cols"><label class="field">${esc(t("lType"))}<select id="al-type">${opt}</select></label>${fld("city", "al-city", "lCity", 'maxlength="40"')}${fld("district", "al-district", "lDistrict", 'maxlength="40"')}</div>
      <div class="cols">${fld("surface", "al-surface", "lSurface", 'inputmode="numeric"')}${fld("rooms", "al-rooms", "lRooms", 'inputmode="numeric"')}${fld("beds", "al-beds", "lBeds", 'inputmode="numeric"')}</div>
      <div class="cols">${fld("start", "al-start", "lStart", 'inputmode="numeric"')}${fld("reserve", "al-reserve", "lReserve", 'inputmode="numeric"')}${fld("inc", "al-inc", "lInc", 'inputmode="numeric" value="10000"')}</div>
      ${fld("tf", "al-tf", "lTF", 'maxlength="20" dir="ltr" placeholder="TF 12345/R"')}
      <label class="field" data-f="pitch">${esc(t("lPitch"))}<textarea id="al-pitch" rows="3"></textarea></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" type="submit">${esc(t("sAddLot"))}</button><button class="btn btn-ghost" type="button" id="al-ex">${esc(t("sExample"))}</button></div>
    </form>`;
}
function wireLotsEditor(app, s) {
  const f = $("add-lot");
  $("al-ex").addEventListener("click", () => {
    Object.entries({ title: "Appartement neuf avec terrasse", type: "appartement", city: "Rabat", district: "Agdal", surface: 120, rooms: 5, beds: 3, start: 1600000, reserve: 1750000, inc: 10000, tf: "TF 88412/R",
      pitch: "Appartement neuf de 120 m² au cœur de l'Agdal.\nTerrasse de 25 m², double salon, trois chambres.\nTitre foncier individuel, livraison immédiate." }).forEach(([k, v]) => ($(`al-${k}`).value = v));
  });
  app.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { s.lots = s.lots.filter((l) => l.id !== b.dataset.rm); save("myShows"); viewStudio(app); }));
  $("launch").addEventListener("click", () => { s.live = true; save("myShows"); notify("nLaunched", { t: s.title }); toast(t("sLaunched")); location.hash = `host-${s.id}`; });
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = (k) => $(`al-${k}`).value.trim(), n = (k) => parseAmount(v(k)), errs = {}, type = v("type");
    if (v("title").length < 4) errs.title = t("errRequired");
    if (!v("city")) errs.city = t("errRequired");
    for (const k of ["surface", "start", "inc"]) if (!(Number.isInteger(n(k)) && n(k) > 0)) errs[k] = t("errInt");
    if (type !== "terrain" && !(Number.isInteger(n("rooms")) && n("rooms") > 0)) errs.rooms = t("errInt");
    if (v("beds") && !Number.isInteger(n("beds"))) errs.beds = t("errInt");
    if (!errs.start && n("start") < 10000) errs.start = t("errMin", { p: dh(10000) });
    const reserve = v("reserve") ? n("reserve") : n("start");
    if (!(Number.isInteger(reserve) && reserve >= n("start"))) errs.reserve = t("errReserve");
    if (!errs.inc && n("inc") < 1000) errs.inc = t("errMin", { p: dh(1000) });
    if (!fieldErrors(f, errs)) return;
    s.lots.push({ id: `lot-${Math.random().toString(36).slice(2, 8)}`, title: v("title"), type, city: v("city"), district: v("district") || "—", surface: n("surface"),
      rooms: type === "terrain" ? 0 : n("rooms"), bedrooms: n("beds") || 0, hue: Math.floor(rand(0, 360)), start: n("start"), reserve, inc: n("inc"), tf: v("tf") || "—",
      year: "—", floor: "—", charges: 0, zone: type === "terrain" ? "villa" : type === "local" ? "com" : "hab", state: "good", tour: TOURS[type],
      pitch: v("pitch").split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 5) });
    if (!s.tags.includes(type)) s.tags.push(type);
    save("myShows"); toast(t("sLotAdded")); viewStudio(app);
  });
}

/* ====================================================================
   Navigation
   ==================================================================== */
function route({ keepRoom = false } = {}) {
  const app = $("app"), h = location.hash.slice(1) || "lives";
  const roomMatch = h.match(/^(live|host)-(.+)$/);
  if (!(keepRoom && roomMatch)) leaveRoom();
  app.classList.remove("room-mode");
  $("footer").hidden = !!roomMatch;
  let nav = "lives";
  if (roomMatch) viewRoom(app, roomMatch[2], roomMatch[1] === "host", keepRoom);
  else if (h === "studio") { nav = "studio"; viewStudio(app); }
  else if (h === "victoires") { nav = "victoires"; viewWins(app); }
  else viewFeed(app);
  document.querySelectorAll("[data-nav]").forEach((a) => { if (a.dataset.nav === nav && !roomMatch) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (!keepRoom) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { closeModal(); route(); });
applyLang();
route();
})();
</script>

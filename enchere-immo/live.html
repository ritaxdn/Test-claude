<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ATLR9oi8lH5uiEWoDez5No+olwuEe/MYvj+Os4LHFBc='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Adjugé Live</title>
<style>
/* Layout : une appli de ventes en direct façon live shopping. Un fil de lives, puis une salle :
   la scène verticale au centre (visite filmée + carte du lot), les lots à gauche, le chat à droite.
   Autour : studio de l'agent, suivi « Mes victoires », dossier du bien et calculateur en feuilles. */
/* Style « désert » : sable, taupe et ciel pâle, verre dépoli très doux, accent jaune beurre, pilules anthracite. */
:root {
  --bg: #cdc8c3;
  --blob-1: #dfe4e8;   /* ciel pâle */
  --blob-2: #ecdcc4;   /* sable clair */
  --blob-3: #c9b293;   /* dune */
  --blob-4: #f4efe8;   /* lumière */
  --surface: rgb(244 242 239 / .58);
  --surface-strong: rgb(242 240 237 / .92);
  --card: rgb(238 236 233 / .88);
  --chip: rgb(43 41 38 / .06);
  --glass-border: rgb(255 255 255 / .6);
  --ink: #2a2826;
  --muted: #57524c;
  --line: rgb(42 40 38 / .12);
  --accent: #34312d;
  --accent-ink: #ffffff;
  --accent-soft: rgb(52 49 45 / .08);
  --butter: #f2e38c;
  --butter-ink: #b8971c;
  --saffron: var(--butter);
  --live: #d9484f;
  --good: #4b8b63;
  --good-soft: rgb(75 139 99 / .14);
  --danger: #b4423a;
  --on-media: #ffffff;
  --media-glass: rgb(38 34 30 / .38);
  --dock: rgb(46 42 38 / .74);
  --shadow: 0 18px 50px rgb(60 50 40 / .16);
  --blur: 22px;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --radius: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1a18; --blob-1: #2b3036; --blob-2: #3f3326; --blob-3: #33291f; --blob-4: #26221e;
    --surface: rgb(255 255 255 / .06); --surface-strong: rgb(38 35 32 / .94); --card: rgb(36 33 30 / .88); --chip: rgb(255 255 255 / .08); --glass-border: rgb(255 255 255 / .12);
    --ink: #f1ede6; --muted: #b3aca2; --line: rgb(255 255 255 / .12);
    --accent: #efe9df; --accent-ink: #1c1a18; --accent-soft: rgb(239 233 223 / .12);
    --butter: #efdc7c; --butter-ink: #efdc7c; --good: #7cc496; --good-soft: rgb(124 196 150 / .14); --danger: #f08b80;
    --media-glass: rgb(20 18 16 / .45); --dock: rgb(24 22 20 / .82);
    --shadow: 0 18px 50px rgb(0 0 0 / .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1a18; --blob-1: #2b3036; --blob-2: #3f3326; --blob-3: #33291f; --blob-4: #26221e;
  --surface: rgb(255 255 255 / .06); --surface-strong: rgb(38 35 32 / .94); --card: rgb(36 33 30 / .88); --chip: rgb(255 255 255 / .08); --glass-border: rgb(255 255 255 / .12);
  --ink: #f1ede6; --muted: #b3aca2; --line: rgb(255 255 255 / .12);
  --accent: #efe9df; --accent-ink: #1c1a18; --accent-soft: rgb(239 233 223 / .12);
  --butter: #efdc7c; --butter-ink: #efdc7c; --good: #7cc496; --good-soft: rgb(124 196 150 / .14); --danger: #f08b80;
  --media-glass: rgb(20 18 16 / .45); --dock: rgb(24 22 20 / .82);
  --shadow: 0 18px 50px rgb(0 0 0 / .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: -10vmax; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38vmax 38vmax at 12% 8%, var(--blob-1), transparent 70%),
    radial-gradient(34vmax 34vmax at 92% 18%, var(--blob-2), transparent 70%),
    radial-gradient(40vmax 40vmax at 78% 92%, var(--blob-3), transparent 70%),
    radial-gradient(30vmax 30vmax at 8% 82%, var(--blob-4), transparent 70%);
  opacity: .95; filter: blur(40px); }
h1, h2, h3 { margin: 0; font-weight: 400; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] .big { letter-spacing: 0; }
h1 { font-size: clamp(2rem, 1.4rem + 2.4vw, 3rem); }
h2 { font-size: 1.3rem; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
[dir="rtl"] .label { letter-spacing: 0; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 20px; }
[dir="rtl"] .flip { transform: scaleX(-1); }

.glass { background: var(--surface); -webkit-backdrop-filter: blur(var(--blur)) saturate(160%); backdrop-filter: blur(var(--blur)) saturate(160%); border: 1px solid var(--glass-border); }
.media-glass { background: var(--media-glass); -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%); border: 1px solid rgb(255 255 255 / .18); color: var(--on-media); }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; border-width: 0 0 1px; }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 400; font-size: 1.35rem; letter-spacing: -.02em; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px rgb(255 59 92 / .2); }
.brand small { font-weight: 400; font-size: .8rem; color: var(--muted); letter-spacing: 0; }
nav.main { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
nav.main a { text-decoration: none; padding: 7px 14px; border-radius: 999px; color: var(--muted); font-weight: 400; font-size: .92rem; white-space: nowrap; }
nav.main a:hover { color: var(--ink); background: var(--accent-soft); }
nav.main a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tools { display: flex; gap: 8px; align-items: center; }
.who { font-size: .85rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.who b { color: var(--ink); }
.kyc-ok { color: var(--good); font-weight: 700; font-size: .78rem; }
.round { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-weight: 700; font-size: .85rem; }
.badge-count { position: absolute; top: -4px; inset-inline-end: -4px; min-width: 18px; height: 18px; padding-inline: 4px; border-radius: 999px; background: var(--live); color: #fff; font-size: .68rem; display: grid; place-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 11px 20px; font-weight: 400; cursor: pointer; text-decoration: none; transition: transform .12s, background .2s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); border-color: var(--glass-border); color: var(--ink); }
.btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-small { padding: 6px 12px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }

main { padding-block: 28px 56px; }
main.room-mode { padding-block: 16px; }
.page { display: grid; gap: 28px; }
.page-head p { color: var(--muted); max-width: 60ch; margin-top: 8px; }

/* Formulaires */
.field { display: grid; gap: 6px; font-weight: 700; font-size: .86rem; min-width: 0; }
.field input, .field select, .field textarea, .inp { width: 100%; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--surface); padding: 10px 12px; font-weight: 400; min-width: 0; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); background: var(--surface-strong); }
.field .err, .err { color: var(--danger); font-size: .8rem; font-weight: 700; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.card { border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: .84rem; }
.check input { margin-top: 3px; }

/* Badges */
.live-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--live); color: #fff; font-weight: 700; font-size: .72rem; letter-spacing: .08em; padding: 4px 8px; border-radius: 6px; }
.live-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
.viewers { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgb(0 0 0 / .4); color: var(--on-media); }
.tag { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.tag.mine { background: var(--saffron); color: #2a1a00; }
@keyframes pulse { 50% { opacity: .3; } }

/* Fil des lives */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 16px; border-radius: 999px; font-weight: 400; font-size: .88rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.lives { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.show { position: relative; display: block; aspect-ratio: 9 / 14; max-width: 100%; border-radius: var(--radius); overflow: hidden; text-decoration: none; color: var(--on-media); box-shadow: var(--shadow); transition: transform .2s; }
.show:hover { transform: translateY(-3px); }
.show > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.show .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(20 16 12 / .45), transparent 34%, transparent 52%, rgb(20 16 12 / .2)); }
.show .tl { position: absolute; top: 12px; inset-inline: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.show .head { position: absolute; top: 52px; inset-inline: 16px; text-align: center; display: grid; gap: 4px; text-shadow: 0 1px 10px rgb(0 0 0 / .3); }
.show .head h3 { font-size: 1.3rem; font-weight: 400; }
.show .head small { font-size: .72rem; opacity: .9; }
.show .info { position: absolute; inset-inline: 10px; bottom: 10px; padding: 28px 14px 14px; border-radius: 24px; background: var(--card); color: var(--ink); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); display: grid; gap: 12px; }
.show .cta { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 8px 16px; border-radius: 999px; background: rgb(46 42 38 / .86); color: #fff; font-size: .8rem; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.show .host span small { display: block; color: var(--muted); font-size: .72rem; }
.host { display: flex; align-items: center; gap: 8px; font-size: .82rem; min-width: 0; }
.host b { display: block; }
.avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; color: #fff; border: 2px solid rgb(255 255 255 / .8); }
.trio-mini { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 6px; font-size: .82rem; }
.trio-mini small { display: block; color: var(--muted); font-size: .68rem; }
.trio-mini .c { text-align: center; }
.trio-mini .c b { font-weight: 400; font-size: 1.05rem; }
.trio-mini .e { text-align: end; }
.upcoming { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.up { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: var(--radius); align-items: center; }
.thumb { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; }
.thumb > svg { width: 100%; height: 100%; display: block; }
.up .body { display: grid; gap: 6px; min-width: 0; }
.up .when { color: var(--accent); font-weight: 700; font-size: .82rem; }
.up .row { display: flex; justify-content: flex-end; }
.remind[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; list-style: none; padding: 0; margin: 0; }
.how li { padding: 18px; border-radius: var(--radius); display: grid; gap: 6px; align-content: start; }
.empty { padding: 32px; border-radius: var(--radius); text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }

/* Salle */
.room { position: relative; display: grid; grid-template-columns: 270px minmax(0, 440px) 330px; justify-content: center; gap: 18px; height: min(860px, calc(100dvh - 110px)); min-height: 580px; }
.panel { border-radius: var(--radius); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.lots { list-style: none; margin: 0; padding: 8px; overflow: auto; display: grid; gap: 6px; align-content: start; }
.lots li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 12px; align-items: center; }
.lots li.current { background: var(--accent-soft); }
.mini { aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
.mini > svg { width: 100%; height: 100%; display: block; }
.lots strong { display: block; font-size: .86rem; line-height: 1.25; }
.lots small { font-size: .76rem; color: var(--muted); font-weight: 700; }
.lots small.sold { color: var(--good); }
.lots small.on { color: var(--live); }
.close-sheet { display: none; }

.stage { position: relative; border-radius: 34px; overflow: hidden; background: #10142e; color: var(--on-media); box-shadow: var(--shadow); isolation: isolate; }
.scene { position: absolute; inset: 0; z-index: -2; }
.scene > svg { width: 100%; height: 100%; display: block; animation: kenburns 9s ease-in-out infinite alternate; transform-origin: var(--ox, 50%) var(--oy, 60%); }
.scene.swap > svg { animation: fadein .7s ease-out, kenburns 9s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1.02); } to { transform: scale(1.14) translate(-2%, -1%); } }
@keyframes fadein { from { opacity: 0; filter: blur(6px); } }
.stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgb(20 16 12 / .42), transparent 24%, transparent 46%, rgb(20 16 12 / .5) 82%); pointer-events: none; }
.stage-top { position: absolute; top: 12px; inset-inline: 12px; display: flex; gap: 8px; align-items: center; }
.stage-top .host { flex: 1; padding: 4px 10px 4px 4px; border-radius: 999px; }
[dir="rtl"] .stage-top .host { padding: 4px 4px 4px 10px; }
.stage-top .host span span { font-size: .72rem; opacity: .8; }
.follow { margin-inline-start: auto; padding: 5px 10px; border-radius: 999px; border: 0; background: var(--on-media); color: #10142e; font-weight: 700; font-size: .75rem; cursor: pointer; }
.follow[aria-pressed="true"] { background: rgb(255 255 255 / .25); color: var(--on-media); }
.iconbtn { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }
.stage-meta { position: absolute; top: 60px; inset-inline: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tour { padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; cursor: pointer; }
.lots-toggle { display: none; }
.hostbar { position: absolute; top: 96px; inset-inline: 12px; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border-radius: 14px; align-items: center; z-index: 4; }
.hostbar b { font-size: .78rem; margin-inline-end: auto; }
.hostbar button { padding: 7px 12px; border-radius: 10px; border: 0; font-weight: 700; font-size: .8rem; cursor: pointer; background: var(--saffron); color: #2a1a00; }
.hostbar button.sec { background: rgb(255 255 255 / .18); color: var(--on-media); }
.hearts { position: absolute; inset-inline-end: 18px; bottom: 240px; width: 60px; height: 260px; pointer-events: none; }
.heart { position: absolute; bottom: 0; inset-inline-start: 18px; width: 26px; height: 26px; animation: floatup 2.6s ease-out forwards; }
@keyframes floatup { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx, 0px), -240px) scale(1.1); opacity: 0; } }

.lotcard { position: absolute; inset-inline: 12px; bottom: 12px; border-radius: 30px; padding: 18px; display: grid; gap: 12px; color: var(--ink); background: var(--card); -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%); border: 1px solid var(--glass-border); box-shadow: 0 20px 50px rgb(0 0 0 / .18); }
.lotcard::before { content: ""; justify-self: center; width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin-top: -8px; }
.lotcard .row1 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.lotcard h2 { font-size: 1.15rem; }
.lotcard .where { font-size: .8rem; color: var(--muted); margin-top: 3px; }
.lotcard .label { color: var(--muted); }
.ring { position: relative; width: 56px; height: 56px; }
.ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--butter-ink); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .3s; }
.ring.hot .bar { stroke: var(--live); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .92rem; font-weight: 400; }
.trio { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 8px; font-size: .9rem; }
.trio small { display: block; font-size: .72rem; color: var(--muted); }
.trio .c { text-align: center; }
.trio .e { text-align: end; }
.trio .big { display: inline-block; font-size: clamp(1.45rem, 5.5vw, 2rem); font-weight: 400; letter-spacing: -.02em; line-height: 1; transition: color .3s, transform .3s; }
.trio .big.bump { color: var(--butter-ink); transform: scale(1.05); }
.lead-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .84rem; min-height: 26px; }
.lead-row small { color: var(--muted); }
.reserve { font-size: .74rem; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.reserve.ok { background: var(--butter); border-color: transparent; color: #2a2826; }
.autochip { justify-self: start; font-size: .75rem; padding: 4px 11px; border-radius: 999px; background: var(--butter); color: #2a2826; }
.slide { position: relative; height: 58px; border-radius: 999px; background: var(--chip); border: 1px solid var(--glass-border); overflow: hidden; user-select: none; touch-action: none; }
.slide .fill { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; background: var(--butter); }
.slide .txt { position: absolute; inset: 0; display: grid; place-items: center; font-size: .95rem; padding-inline: 60px 14px; text-align: center; line-height: 1.15; color: var(--ink); }
.slide .knob { position: absolute; top: 4px; inset-inline-start: 4px; width: 50px; height: 48px; border-radius: 999px; border: 0; background: rgb(46 42 38 / .9); color: #fff; display: grid; place-items: center; cursor: grab; box-shadow: 0 6px 16px rgb(0 0 0 / .25); }
.slide.disabled .knob { cursor: not-allowed; opacity: .55; }
.slide.lead { background: var(--butter); border-color: transparent; }
.slide.lead .txt { color: #2a2826; }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.actions button { padding: 9px 6px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: .78rem; cursor: pointer; line-height: 1.2; }
.actions button:hover { background: var(--chip); }
.actions button[aria-pressed="true"] { background: var(--butter); border-color: transparent; color: #2a2826; }
.custom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.custom input { border-radius: 999px; border: 1px solid var(--line); background: var(--surface-strong); color: var(--ink); padding: 10px 14px; min-width: 0; }
.custom-err { font-size: .78rem; color: var(--danger); }
.phase-note { font-size: .85rem; padding: 10px 14px; border-radius: 18px; background: var(--chip); }
.bidders { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .84rem; }
.bidders li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--chip); }
.legal-note { color: var(--muted); }

/* Pastilles de visite sur la photo (façade, 1, 2, 3…) */
.tourdots { position: absolute; inset-inline-end: 12px; top: 112px; display: grid; gap: 8px; z-index: 1; }
.stage.has-hostbar .tourdots { top: 168px; }

/* ---------- Plan schématique ---------- */
function planSVG(lot) {
  const S = lot.surface, room = (x, y, w, h, label, share) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--accent-soft)" stroke="currentColor" stroke-width="2"/><text x="${x + w / 2}" y="${y + h / 2 - 2}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${esc(label)}</text>${share ? `<text x="${x + w / 2}" y="${y + h / 2 + 14}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">≈ ${Math.round(S * share)} m²</text>` : ""}`;
  let g = "";
  if (lot.type === "terrain") {
    const side = Math.round(Math.sqrt(S));
    g = `<polygon points="40,30 300,20 320,200 30,210" fill="var(--accent-soft)" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><text x="170" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${esc(t("pTerrain"))} · ${numFmt.format(S)} m²</text><text x="170" y="16" text-anchor="middle" font-size="11" fill="currentColor">≈ ${side} m</text><text x="12" y="120" font-size="11" fill="currentColor" transform="rotate(-90 12 120)">≈ ${side} m</text>`;
  } else if (lot.type === "local") {
    g = room(10, 10, 230, 210, t("pPlateau"), 0.75) + room(240, 10, 90, 130, t("pReserve"), 0.17) + room(240, 140, 90, 80, t("pWc"), 0.08);
  } else if (lot.type === "riad") {
    const beds = Math.max(1, lot.bedrooms);
    g = room(10, 10, 200, 60, t("pSalon"), 0.18) + room(210, 10, 120, 60, t("pCuisine"), 0.08) + room(10, 70, 100, 100, `${t("pChambre")} 1`, 0.1) + room(230, 70, 100, 100, t("pSdb"), 0.06) + room(110, 70, 120, 100, t("pPatio"), 0.2);
    const rest = beds - 1, w = rest ? 320 / rest : 320;
    for (let i = 0; i < rest; i++) g += room(10 + i * w, 170, w, 50, `${t("pChambre")} ${i + 2}`, 0.38 / Math.max(1, rest));
  } else {
    const beds = Math.max(1, lot.bedrooms), cols = beds <= 2 ? 1 : 2, rows = Math.ceil(beds / cols), cw = 170 / cols, ch = 210 / rows;
    g = room(10, 10, 150, 130, t("pSalon"), 0.3) + room(10, 140, 80, 80, t("pCuisine"), 0.1) + room(90, 140, 70, 80, t("pSdb"), 0.08);
    for (let i = 0; i < beds; i++) g += room(160 + (i % cols) * cw, 10 + Math.floor(i / cols) * ch, cw, ch, `${t("pChambre")} ${i + 1}`, 0.52 / beds);
  }
  return `<svg class="plan" viewBox="0 0 340 230" role="img" aria-label="${esc(t("tPlan"))}">${g}</svg>`;
}

function wireCard() {
  const knob = $("knob"), slide = $("slide");
  if (knob && !knob.disabled) {
    const sign = lang === "ar" ? -1 : 1;
    let startX = 0, x = 0, max = 0, dragging = false;
    const set = (v) => { x = v; knob.style.transform = `translateX(${sign * v}px)`; $("fill").style.width = `${v + 48}px`; };
    knob.addEventListener("pointerdown", (e) => { dragging = true; sliding = true; startX = e.clientX; max = slide.clientWidth - 56; knob.setPointerCapture(e.pointerId); knob.style.transition = "none"; });
    knob.addEventListener("pointermove", (e) => { if (dragging) set(Math.max(0, Math.min(max, (e.clientX - startX) * sign))); });
    const end = () => {
      if (!dragging) return; dragging = false; sliding = false;
      const done = x >= max * 0.85;
      knob.style.transition = "transform .25s"; set(0); $("fill").style.width = "0";
      if (pendingRender) { pendingRender = false; renderCard(true); }
      // L'offre part au palier en vigueur au moment où l'on relâche.
      if (done) myBid(minBid());
    };
    knob.addEventListener("pointerup", end); knob.addEventListener("pointercancel", end);
    knob.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); myBid(minBid()); } });
    knob.addEventListener("click", (e) => { if (e.detail !== 0 && x === 0) $("slide-txt").textContent = t("slideHint"); });
  }
  const ready = !R.host && qual(lot()).ready;
  $("q-next")?.addEventListener("click", () => nextStep(lot()));
  $("toggle-custom")?.addEventListener("click", () => { if (!ready) return nextStep(lot()); R.custom = !R.custom; renderCard(); $("custom-amt")?.focus(); });
  $("auto-btn")?.addEventListener("click", () => (ready ? openAuto() : nextStep(lot())));
  $("dossier-btn")?.addEventListener("click", () => openDossier(lot(), "docs"));
  $("love")?.addEventListener("click", () => hearts(4));
  $("custom")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = parseAmount($("custom-amt").value), err = $("custom-err");
    if (!Number.isInteger(v) || v < minBid()) { err.textContent = t("minErr", { p: dh(minBid()) }); err.hidden = false; return; }

    myBid(v);
  });
}

function placeChat() {

    if (b.dataset.armed) { prefs.myShows = prefs.myShows.filter((s) => s.id !== b.dataset.del); save("myShows"); if (draftId === b.dataset.del) draftId = null; toast(t("sDeleted")); viewStudio(app); }
    else { b.dataset.armed = "1"; b.textContent = t("sConfirmDel"); }
  }));
  if (draft) wireEditor(app, draft); else wireNewShow(app);
}
function newShowHTML() {
  return `<h2>${esc(t("sNew"))}</h2><form id="new-show" class="page" style="gap:12px" novalidate>

}
function fieldErrors(form, errs) {
  form.querySelectorAll(".field .err").forEach((e) => e.remove());
  Object.entries(errs).forEach(([k, msg]) => form.querySelector(`[data-f="${k}"]`)?.insertAdjacentHTML("beforeend", `<span class="err">${esc(msg)}</span>`));
  const first = Object.keys(errs)[0]; if (first) form.querySelector(`[data-f="${first}"] input, [data-f="${first}"] textarea`)?.focus();
  return !Object.keys(errs).length;
}
function wireNewShow(app) {
  const f = $("new-show");
  $("ns-ex").addEventListener("click", () => { $("ns-title").value = "Appartements neufs à Rabat"; $("ns-city").value = "Rabat · Agdal"; $("ns-cat").value = "appartement"; $("ns-name").value = "Ghita Lahlou"; $("ns-agency").value = "Agdal Immo"; $("ns-notary").value = "Maître Alami"; $("ns-ncity").value = "Rabat"; });
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = (id) => $(id).value.trim(), errs = {};
    if (v("ns-title").length < 4) errs.title = t("errRequired");
    if (!v("ns-city")) errs.city = t("errRequired");
    if (v("ns-name").length < 2) errs.name = t("errRequired");
    if (!v("ns-agency")) errs.agency = t("errRequired");
    if (v("ns-notary").length < 3) errs.notary = t("errRequired");
    if (!v("ns-ncity")) errs.ncity = t("errRequired");
    if (!$("ns-nok").checked) errs.nok = t("errNotaryOk");
    if (!fieldErrors(f, errs)) return;
    const s = { id: `mon-live-${Math.random().toString(36).slice(2, 7)}`, title: v("ns-title"), city: v("ns-city"), tags: [v("ns-cat")], live: false, stage: 0, viewers: Math.round(rand(150, 400)),
      host: { name: v("ns-name"), handle: me() || "agent.demo", agency: v("ns-agency"), hue: Math.floor(rand(0, 360)) }, notary: { name: v("ns-notary"), city: v("ns-ncity") }, lots: [] };
    prefs.myShows.unshift(s); save("myShows"); draftId = s.id; toast(t("sCreated")); viewStudio(app);
  });
}
function lotListHTML(s, editable) {
  return s.lots.length ? `<ul class="lotlist">${s.lots.map((l) => `<li><div class="mini">${sceneSVG("facade", l)}</div><div><b>${esc(l.title)}</b><br><small class="num">${esc(t("types")[l.type])} · ${esc(l.city)} · ${esc(t("startP"))} ${dh(l.start)}</small>${trustHTML(l)}</div>${editable ? `<button class="btn btn-ghost btn-small" type="button" data-rm="${l.id}">${esc(t("sRemoveLot"))}</button>` : `<span></span>`}</li>`).join("")}</ul>` : `<p class="muted">${esc(t("sNoLots"))}</p>`;
}
function editorHTML(s) {
  const st = s.stage || 0;
  const flow = `<ol class="flow">${[0, 1, 2, 3, 4, 5, 6].map((i) => `<li class="${i < st ? "done" : i === st ? "now" : ""}">${i < st ? "✓ " : ""}${esc(t(`flow${i}`))}</li>`).join("")}</ol>`;
  const back = `<button class="btn btn-ghost" type="button" id="f-back">${esc(t("fBack"))}</button>`;
  const go = (k) => `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" type="button" id="f-go">${esc(t(k))}</button>${back}</div>`;
  let panel = "";
  if (st === 0) {
    const opt = Object.entries(t("types")).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
    const fld = (f, id, label, attrs = "") => `<label class="field" data-f="${f}">${esc(t(label))}<input id="${id}" ${attrs}></label>`;
    panel = `${lotListHTML(s, true)}
      <button class="btn btn-primary" type="button" id="f-submit" ${s.lots.length ? "" : "disabled"} style="justify-self:start">${esc(t("fSubmit"))}</button>
      <form id="add-lot" class="page" style="gap:12px;border-top:1px solid var(--line);padding-top:14px" novalidate>
        <h3>${esc(t("sAddTitle"))}</h3>
        ${fld("title", "al-title", "lTitle", 'maxlength="70"')}
        <div class="cols"><label class="field">${esc(t("lType"))}<select id="al-type">${opt}</select></label>${fld("city", "al-city", "lCity", 'maxlength="40"')}${fld("district", "al-district", "lDistrict", 'maxlength="40"')}</div>
        <div class="cols">${fld("surface", "al-surface", "lSurface", 'inputmode="numeric"')}${fld("rooms", "al-rooms", "lRooms", 'inputmode="numeric"')}${fld("beds", "al-beds", "lBeds", 'inputmode="numeric"')}</div>
        <div class="cols">${fld("start", "al-start", "lStart", 'inputmode="numeric"')}${fld("reserve", "al-reserve", "lReserve", 'inputmode="numeric"')}${fld("inc", "al-inc", "lInc", 'inputmode="numeric" value="10000"')}</div>
        ${fld("tf", "al-tf", "lTF", 'maxlength="20" dir="ltr" placeholder="TF 12345/R"')}
        <label class="field" data-f="pitch">${esc(t("lPitch"))}<textarea id="al-pitch" rows="3"></textarea></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" type="submit">${esc(t("sAddLot"))}</button><button class="btn btn-ghost" type="button" id="al-ex">${esc(t("sExample"))}</button></div>
      </form>`;
  } else if (st >= 1 && st <= 3) panel = `<p>${esc(t(`f${st}Txt`))}</p>${lotListHTML(s, false)}${go(`f${st}Go`)}`;
  else if (st === 4) {
    const tm = s.terms || { req: true, pct: 5, holder: `Étude de ${s.notary?.name || ""}`.trim(), cond: "" };
    panel = `<p>${esc(t("f4Txt"))}</p><form id="f-terms" class="page" style="gap:12px" novalidate>
      <label class="check"><input type="checkbox" id="ft-req" ${tm.req ? "checked" : ""}> ${esc(t("f4GuaReq"))}</label>
      <div class="cols"><label class="field" data-f="pct">${esc(t("f4GuaPct"))}<input id="ft-pct" inputmode="numeric" value="${tm.pct}"></label><label class="field" data-f="holder">${esc(t("f4Holder"))}<input id="ft-holder" maxlength="60" value="${esc(tm.holder)}"></label></div>
      <label class="field">${esc(t("f4Cond"))}<textarea id="ft-cond" rows="2" placeholder="${esc(t("f4CondPh"))}">${esc(tm.cond)}</textarea></label>
      <p class="muted" style="font-size:.84rem">${esc(t("kReserve"))} : ${esc(t("vReserve"))}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" type="submit">${esc(t("f4Go"))}</button>${back}</div></form>`;
  } else if (st === 5) panel = `<p>${esc(t("f5Txt"))}</p>${lotListHTML(s, false)}${go("f5Go")}`;
  else {
    const d = new Date(s.startsAt || at(1, 20, 0)); const local = new Date(d.getTime() - d.getTimezoneOffset() * MIN).toISOString().slice(0, 16);
    panel = `<p>${esc(t("f6Txt"))}</p>${s.startsAt ? `<p class="ok-pill" style="justify-self:start">${esc(t("f6Scheduled", { d: dateFmt(s.startsAt, { dateStyle: "full", timeStyle: "short" }) }))}</p>` : ""}
      <form id="f-sched" class="page" style="gap:12px" novalidate><label class="field" data-f="when">${esc(t("f6Date"))}<input id="fs-when" type="datetime-local" value="${local}"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" type="submit">${esc(t("f6Go"))}</button><button class="btn btn-ghost" type="button" id="f-now">${esc(t("f6Now"))}</button>${back}</div></form>`;
  }
  return `<div style="display:grid;gap:12px"><h2>${esc(s.title)}</h2><p class="muted" style="font-size:.86rem">⚖ ${esc(t("notaryLine", { n: notaryOf(s), c: s.notary?.city || "—" }))}</p>${flow}<p class="muted" style="font-size:.78rem">${esc(t("flowLede"))}</p>${panel}</div>`;
}
function wireEditor(app, s) {
  const st = s.stage || 0, redraw = () => { save("myShows"); viewStudio(app); };
  $("f-back")?.addEventListener("click", () => { s.stage = 0; s.startsAt = undefined; s.lots.forEach((l) => { l.docsReviewed = l.sellerVerified = l.approved = false; }); redraw(); });
  $("f-go")?.addEventListener("click", (e) => {
    e.currentTarget.disabled = true; e.currentTarget.textContent = t("fWait");
    setTimeout(() => {
      if (st === 2) s.lots.forEach((l) => (l.docsReviewed = true));
      if (st === 3) s.lots.forEach((l) => (l.sellerVerified = true));
      s.stage = st + 1; toast(t("stepDone")); redraw();
    }, 800);
  });
  if (st === 0) {
    const f = $("add-lot");
    $("f-submit").addEventListener("click", () => { s.stage = 1; redraw(); });
    $("al-ex").addEventListener("click", () => {
      Object.entries({ title: "Appartement neuf avec terrasse", type: "appartement", city: "Rabat", district: "Agdal", surface: 120, rooms: 5, beds: 3, start: 1600000, reserve: 1750000, inc: 10000, tf: "TF 88412/R",
        pitch: "Appartement neuf de 120 m² au cœur de l'Agdal.\nTerrasse de 25 m², double salon, trois chambres.\nTitre foncier individuel, livraison immédiate." }).forEach(([k, v]) => ($(`al-${k}`).value = v));
    });
    app.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { s.lots = s.lots.filter((l) => l.id !== b.dataset.rm); redraw(); }));
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = (k) => $(`al-${k}`).value.trim(), n = (k) => parseAmount(v(k)), errs = {}, type = v("type");
      if (v("title").length < 4) errs.title = t("errRequired");
      if (!v("city")) errs.city = t("errRequired");
      for (const k of ["surface", "start", "inc"]) if (!(Number.isInteger(n(k)) && n(k) > 0)) errs[k] = t("errInt");
      if (type !== "terrain" && !(Number.isInteger(n("rooms")) && n("rooms") > 0)) errs.rooms = t("errInt");
      if (v("beds") && !Number.isInteger(n("beds"))) errs.beds = t("errInt");
      if (!errs.start && n("start") < 10000) errs.start = t("errMin", { p: dh(10000) });
      const reserve = v("reserve") ? n("reserve") : n("start");
      if (!(Number.isInteger(reserve) && reserve >= n("start"))) errs.reserve = t("errReserve");
      if (!errs.inc && n("inc") < 1000) errs.inc = t("errMin", { p: dh(1000) });
      if (!fieldErrors(f, errs)) return;
      s.lots.push({ id: `lot-${Math.random().toString(36).slice(2, 8)}`, title: v("title"), type, city: v("city"), district: v("district") || "—", surface: n("surface"),
        rooms: type === "terrain" ? 0 : n("rooms"), bedrooms: n("beds") || 0, hue: Math.floor(rand(0, 360)), start: n("start"), reserve, inc: n("inc"), tf: v("tf") || "—",
        year: "—", floor: "—", charges: 0, zone: type === "terrain" ? "villa" : type === "local" ? "com" : "hab", state: "good", tour: TOURS[type],
        pitch: v("pitch").split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 5) });
      if (!s.tags.includes(type)) s.tags.push(type);
      toast(t("sLotAdded")); redraw();
    });
  }
  $("f-terms")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = $("f-terms"), req = $("ft-req").checked, pct = parseAmount($("ft-pct").value), holder = $("ft-holder").value.trim(), errs = {};
    if (req && !(Number.isInteger(pct) && pct >= 1 && pct <= 30)) errs.pct = t("fPctErr");
    if (req && !holder) errs.holder = t("errRequired");
    if (!fieldErrors(f, errs)) return;
    s.terms = { req, pct: req ? pct : 0, holder, cond: $("ft-cond").value.trim() };
    s.lots.forEach((l) => (l.approved = !!(l.docsReviewed && l.sellerVerified)));
    s.stage = 5; toast(t("stepDone")); redraw();
  });
  $("f-sched")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const when = new Date($("fs-when").value).getTime();
    if (!(when > Date.now())) return fieldErrors($("f-sched"), { when: t("fDateErr") });
    s.startsAt = when; toast(t("f6Scheduled", { d: dateFmt(when, { dateStyle: "full", timeStyle: "short" }) })); redraw();
  });
  $("f-now")?.addEventListener("click", () => { s.live = true; s.startsAt = undefined; save("myShows"); notify("nLaunched", { t: s.title }); toast(t("sLaunched")); location.hash = `host-${s.id}`; });
}

/* ====================================================================
   Navigation
   ==================================================================== */
function route({ keepRoom = false } = {}) {
  const app = $("app"), h = location.hash.slice(1) || "lives";
  const roomMatch = h.match(/^(live|host)-(.+)$/);
  if (!(keepRoom && roomMatch)) leaveRoom();
  app.classList.remove("room-mode");
  $("footer").hidden = !!roomMatch;
  let nav = "lives";
  if (roomMatch) viewRoom(app, roomMatch[2], roomMatch[1] === "host", keepRoom);
  else if (h === "studio") { nav = "studio"; viewStudio(app); }
  else if (h === "victoires") { nav = "victoires"; viewWins(app); }
  else viewFeed(app);
  document.querySelectorAll("[data-nav]").forEach((a) => { if (a.dataset.nav === nav && !roomMatch) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.body.classList.toggle("in-room", !!roomMatch);
  renderDock(nav);
  if (!keepRoom) window.scrollTo(0, 0);
}
prefs.myShows.forEach((x) => { if (x.stage == null) x.stage = x.live ? 6 : 0; if (x.live) x.lots.forEach((l) => { l.approved = l.approved ?? true; }); });
function renderDock(nav) {
  const map = { lives: [t("navLives"), allShows().filter((x) => x.live).length], studio: [t("navStudio"), prefs.myShows.length], victoires: [t("navWins"), prefs.wins.length] };
  const [title, n] = map[nav] || map.lives;
  $("dock-title").textContent = title; $("dock-count").textContent = n;
  $("dock-back").hidden = nav === "lives";
  $("dock-back").setAttribute("aria-label", t("back")); $("dock-menu").setAttribute("aria-label", t("menu"));
}
$("dock-back").addEventListener("click", () => { location.hash = "lives"; });
$("dock-menu").addEventListener("click", () => {
  const links = [...document.querySelectorAll("nav.main a")].map((a) => `<a href="${a.getAttribute("href")}">${esc(a.textContent)}<span aria-hidden="true">›</span></a>`).join("");
  const unread = prefs.notifs.filter((x) => !x.read).length;
  const el = openModal(`<div class="sheet-head"><h2>${esc(t("menu"))}</h2>${closeBtn()}</div>
    <div class="menu-links">${links}<button type="button" id="m-notifs">${esc(t("notifs"))}<span class="num">${unread || ""}</span></button><button type="button" id="m-lang">${esc(t("langSwitch"))}<span aria-hidden="true">ع / FR</span></button></div>`);
  el.querySelectorAll(".menu-links a").forEach((a) => a.addEventListener("click", closeModal));
  el.querySelector("#m-notifs").addEventListener("click", (e) => { e.stopPropagation(); closeModal(); $("notifs").hidden = false; renderNotifs(); });
  el.querySelector("#m-lang").addEventListener("click", () => { closeModal(); $("lang").click(); });
});
window.addEventListener("hashchange", () => { closeModal(); route(); });
$("terms-link").addEventListener("click", () => openTerms());
$("privacy-link").addEventListener("click", () => openTerms(true));
applyLang();
route();
})();
</script>
